<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Visualizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg-sand: #E8E1D5;
      --primary-teal: #264653;
      --accent-gold: #E9C46A;
      --teal-light: #2A9D8F;
      --teal-dark: #1D3F4A;
      --bp-mobile: 768px;
      --bp-desktop: 1024px;
      --card-radius: 16px;
      --shadow-soft: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-sand);
      color: var(--primary-teal);
      min-height: 100vh;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent-gold);
      outline-offset: 2px;
    }

    .app-shell {
      min-height: 100vh;
    }

    /* Header & Tabs */
    .header {
      background: var(--primary-teal);
      padding: 20px 40px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
    }

    .logo {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      white-space: nowrap;
      flex: 1 1 auto;
      min-width: 0;
      margin: 0 8px 0 14px;
      padding-right: 6px;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      transition: all 0.3s;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      border: none;
      font-family: 'Montserrat', sans-serif;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tab:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .tab.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      flex: 0 0 auto;
      margin-left: 8px;
    }

    .app-shell.mode-mobile .tabs {
      flex-wrap: nowrap;
      width: 100%;
      overflow-x: auto;
      margin: 0;
      padding-right: 0;
    }

    .app-shell.mode-mobile .tab {
      flex: 0 0 auto;
      text-align: center;
      min-height: 44px;
    }

    .app-shell.mode-mobile .header-right {
      width: 100%;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 13px;
      width: 210px;
      outline: none;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .search-mode-select {
      padding: 9px 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 12px;
      min-width: 92px;
      font-family: 'Montserrat', sans-serif;
      outline: none;
    }

    .search-mode-select option {
      color: #183440;
    }

    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-box:focus {
      background: rgba(255, 255, 255, 0.2);
      width: 280px;
    }

    .lang-toggle {
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .lang-btn {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.8);
    }

    .lang-btn.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    .data-timestamp {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .refresh-btn {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      white-space: nowrap;
      min-width: 86px;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .refresh-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .refresh-status {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.75);
      white-space: nowrap;
    }

    .refresh-status.error {
      color: #FFD2D2;
    }

    .alert-btn {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 13px;
      min-width: 40px;
    }

    .alert-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .alert-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--accent-gold);
      color: var(--primary-teal);
      font-size: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .alerts-panel {
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      width: min(420px, 95vw);
      max-height: 360px;
      overflow-y: auto;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      padding: 12px;
      z-index: 150;
      color: var(--primary-teal);
    }

    .alerts-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.15);
    }

    .alerts-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .alerts-clear {
      border: none;
      background: transparent;
      color: var(--teal-light);
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }

    .alert-item {
      border: 1px solid rgba(38, 70, 83, 0.12);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(38, 70, 83, 0.03);
      font-size: 12px;
      line-height: 1.5;
    }

    .alert-item.unread {
      border-color: rgba(233, 196, 106, 0.7);
      background: rgba(233, 196, 106, 0.12);
    }

    .watch-btn {
      border: none;
      background: transparent;
      color: rgba(38, 70, 83, 0.5);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .watch-btn:hover {
      background: rgba(233, 196, 106, 0.18);
      color: var(--primary-teal);
    }

    .watch-btn.active {
      color: var(--accent-gold);
      text-shadow: 0 0 1px rgba(0, 0, 0, 0.25);
    }

    .watch-btn.compact {
      font-size: 14px;
      padding: 0;
      margin-left: 6px;
    }

    /* Main Content */
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px;
    }

    .app-shell.mode-desktop .main-content {
      padding: 48px;
    }

    .app-shell.mode-mobile .main-content {
      padding: 20px;
    }

    /* Layout with legend */
    .home-layout {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 32px;
    }

    .list-layout-wrapper {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 32px;
    }

    /* Sector Legend */
    .sector-legend {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .sector-legend-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-teal);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--bg-sand);
    }

    .sector-legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      font-size: 12px;
      color: var(--primary-teal);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .sector-legend-item:hover {
      background: rgba(38, 70, 83, 0.05);
    }

    .sector-legend-item.active {
      background: var(--accent-gold);
      font-weight: 600;
    }

    .sector-legend-item.dimmed {
      opacity: 0.4;
    }

    .sector-legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .sector-legend-label {
      font-weight: 500;
    }

    /* Home Grid */
    .funds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .fund-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .fund-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(38, 70, 83, 0.15);
    }

    .fund-card-chart {
      width: 140px;
      height: 140px;
      margin-bottom: 16px;
    }

    .fund-card-name {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: var(--primary-teal);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .fund-card-meta {
      font-size: 11px;
      color: var(--teal-light);
      display: flex;
      gap: 12px;
    }

    .fund-card-meta span {
      background: rgba(42, 157, 143, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* List View */
    .list-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 40px;
      min-height: calc(100vh - 140px);
    }

    .list-sidebar {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      height: fit-content;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      position: sticky;
      top: 100px;
    }

    .list-item {
      padding: 14px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
      margin-bottom: 4px;
      border-left: 3px solid transparent;
    }

    .list-item:hover {
      background: rgba(38, 70, 83, 0.05);
    }

    .list-item.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
      font-weight: 600;
      border-left-color: var(--primary-teal);
    }

    /* Detail View */
    .detail-view {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .detail-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 20px;
    }

    .detail-tab {
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(38, 70, 83, 0.08);
      color: var(--primary-teal);
      border: none;
      transition: all 0.2s;
      font-family: 'Montserrat', sans-serif;
    }

    .detail-tab.active {
      background: var(--primary-teal);
      color: #fff;
    }

    .detail-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .detail-sort {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-teal);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail-sort select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid rgba(38, 70, 83, 0.12);
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-teal);
      font-family: 'Montserrat', sans-serif;
      background: #fff;
      cursor: pointer;
    }

    .detail-hint {
      font-size: 11px;
      color: var(--teal-light);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      background: rgba(38, 70, 83, 0.05);
      color: var(--primary-teal);
      border: none;
      margin-bottom: 24px;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .back-btn:hover {
      background: rgba(38, 70, 83, 0.1);
    }

    .fund-title {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-teal);
    }

    .fund-subtitle {
      color: var(--teal-light);
      font-size: 14px;
      margin-bottom: 40px;
    }

    .chart-container {
      max-width: 350px;
      margin: 0 auto 40px;
    }

    .table-container {
      background: var(--bg-sand);
      border-radius: 16px;
      overflow: hidden;
    }

    .holdings-table {
      width: 100%;
      border-collapse: collapse;
    }

    .holdings-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 16px 20px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 600;
    }

    .holdings-table td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.1);
      background: #fff;
    }

    .holdings-table tr:last-child td {
      border-bottom: none;
    }

    .holdings-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .holding-row.match td {
      background: rgba(233, 196, 106, 0.18);
    }

    .holding-row.match td:first-child {
      box-shadow: inset 4px 0 0 var(--accent-gold);
    }

    .holding-row.match .ticker {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    .ticker {
      font-weight: 700;
      color: var(--primary-teal);
      background: rgba(233, 196, 106, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
    }

    .sector-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      color: #fff;
      display: inline-block;
      margin-left: 8px;
    }

    .percent-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .percent-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(38, 70, 83, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .percent-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-teal), var(--teal-light));
      border-radius: 4px;
    }

    .percent-bar-fill.top {
      background: linear-gradient(90deg, var(--accent-gold), #F4A261);
    }

    .percent-value {
      font-weight: 600;
      min-width: 50px;
      text-align: right;
    }

    .about-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .profile-card {
      background: var(--bg-sand);
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: inset 0 0 0 1px rgba(38, 70, 83, 0.08);
    }

    .profile-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--teal-light);
      margin-bottom: 6px;
    }

    .profile-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-teal);
      line-height: 1.4;
    }

    .profile-description {
      font-size: 13px;
      line-height: 1.7;
      color: var(--primary-teal);
      margin-top: 12px;
    }

    .read-more {
      border: none;
      background: none;
      color: var(--teal-light);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-top: 6px;
    }

    /* Ranking View */
    .ranking-table-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      overflow: hidden;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
    }

    .ranking-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 16px 20px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 600;
    }

    .ranking-table td {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.08);
      background: #fff;
      font-size: 13px;
    }

    .ranking-table tr:last-child td {
      border-bottom: none;
    }

    .ranking-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .ranking-rank {
      font-weight: 700;
      color: var(--primary-teal);
      font-size: 14px;
    }

    .ranking-rank.top3 {
      color: var(--accent-gold);
    }

    .weight-cell {
      position: relative;
      overflow: hidden;
    }

    .weight-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: rgba(38, 70, 83, 0.1);
      border-radius: 0 4px 4px 0;
      transition: width 0.5s ease;
    }

    .weight-bar.accent {
      background: rgba(42, 157, 143, 0.15);
    }

    .weight-value {
      position: relative;
      z-index: 1;
      font-weight: 600;
      font-size: 13px;
    }

    .ranking-funds-count {
      font-size: 11px;
      color: var(--teal-light);
      background: rgba(42, 157, 143, 0.1);
      padding: 3px 8px;
      border-radius: 10px;
    }

    .ranking-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--primary-teal);
      margin-bottom: 20px;
    }

    .ranking-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .ranking-tab {
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s;
      background: #fff;
      color: var(--primary-teal);
      border: 2px solid rgba(38, 70, 83, 0.12);
      font-family: 'Montserrat', sans-serif;
    }

    .ranking-tab:hover {
      border-color: var(--teal-light);
    }

    .ranking-tab.active {
      background: var(--primary-teal);
      color: #fff;
      border-color: var(--primary-teal);
    }

    .ranking-table tr.clickable {
      cursor: pointer;
    }

    .ranking-table tr.clickable:hover td {
      background: rgba(233, 196, 106, 0.15);
    }

    .ticker-funds-panel {
      background: var(--bg-sand);
      border-radius: 0 0 12px 12px;
    }

    .ticker-funds-panel td {
      padding: 0 !important;
      background: transparent !important;
    }

    .ticker-funds-inner {
      padding: 12px 20px 16px 60px;
    }

    .ticker-funds-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--teal-light);
      margin-bottom: 8px;
    }

    .ticker-fund-chip {
      display: inline-block;
      background: #fff;
      border: 1px solid rgba(38, 70, 83, 0.1);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 500;
      color: var(--primary-teal);
      margin: 3px 4px 3px 0;
      transition: all 0.2s;
    }

    .ticker-fund-chip:hover {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    .ticker-fund-chip .chip-weight {
      font-weight: 700;
      color: var(--teal-light);
      margin-left: 6px;
    }

    /* Overlap Analysis */
    .overlap-controls {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .overlap-select-group {
      flex: 1;
      min-width: 240px;
    }

    .overlap-select-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-teal);
      margin-bottom: 8px;
      display: block;
    }

    .overlap-select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid rgba(38, 70, 83, 0.15);
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-teal);
      background: #fff;
      cursor: pointer;
      transition: all 0.3s;
      outline: none;
    }

    .overlap-select:focus {
      border-color: var(--teal-light);
      box-shadow: 0 0 0 3px rgba(42, 157, 143, 0.1);
    }

    .overlap-vs {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-gold);
      padding-top: 20px;
    }

    .overlap-result {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .overlap-summary {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .overlap-stat {
      background: var(--bg-sand);
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
    }

    .overlap-stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-teal);
    }

    .overlap-stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--teal-light);
      margin-top: 4px;
    }

    .overlap-table {
      width: 100%;
      border-collapse: collapse;
    }

    .overlap-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 14px 16px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 11px;
      font-weight: 600;
    }

    .overlap-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.08);
      font-size: 13px;
    }

    .overlap-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .overlap-empty {
      text-align: center;
      padding: 40px;
      color: var(--primary-teal);
      opacity: 0.5;
      font-size: 14px;
    }

    /* Flow / Treemap */
    .flow-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      padding: 32px;
    }

    .treemap-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    .treemap-wrapper svg {
      display: block;
    }

    .treemap-cell rect {
      stroke: var(--bg-sand);
      stroke-width: 2px;
      transition: opacity 0.15s;
    }

    .treemap-cell:hover rect {
      opacity: 0.85;
    }

    .treemap-cell text {
      pointer-events: none;
      font-family: 'Montserrat', sans-serif;
    }

    .treemap-tooltip {
      position: fixed;
      background: var(--primary-teal);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Montserrat', sans-serif;
      pointer-events: none;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      line-height: 1.6;
      max-width: 260px;
    }

    .treemap-tooltip .tt-ticker {
      font-weight: 700;
      font-size: 14px;
    }

    .treemap-tooltip .tt-company {
      opacity: 0.8;
      font-size: 11px;
    }

    .treemap-tooltip .tt-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 4px;
    }

    .treemap-tooltip .tt-change-pos {
      color: #FF6B6B;
      font-weight: 700;
    }

    .treemap-tooltip .tt-change-neg {
      color: #6BCB77;
      font-weight: 700;
    }

    .flow-legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--primary-teal);
    }

    .flow-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flow-legend-swatch {
      width: 28px;
      height: 14px;
      border-radius: 3px;
    }

    .flow-scale {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .flow-scale-bar {
      width: 120px;
      height: 12px;
      border-radius: 3px;
    }

    .flow-scale-label {
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 400px;
      color: var(--primary-teal);
      opacity: 0.6;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    /* View Toggle - Neumorphism Style */
    .view-toggle-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .view-toggle {
      display: flex;
      background: #E8E1D5;
      border-radius: 16px;
      padding: 6px;
      box-shadow: inset 3px 3px 8px rgba(0, 0, 0, 0.08),
        inset -3px -3px 8px rgba(255, 255, 255, 0.9);
    }

    .view-toggle-btn {
      padding: 12px 28px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      background: transparent;
      color: var(--primary-teal);
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .view-toggle-btn:hover {
      color: var(--teal-light);
    }

    .view-toggle-btn.active {
      background: #fff;
      box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.1),
        -2px -2px 6px rgba(255, 255, 255, 0.8);
      color: var(--primary-teal);
    }

    /* Sector Momentum Bar Chart */
    .sector-momentum-container {
      background: #fff;
      border-radius: 16px;
      padding: 24px 32px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .momentum-chart {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .momentum-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      align-items: center;
      gap: 16px;
      height: 40px;
    }

    .momentum-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-teal);
      text-align: right;
    }

    .momentum-bar-wrapper {
      display: flex;
      align-items: center;
      height: 100%;
      position: relative;
    }

    .momentum-bar-center {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(38, 70, 83, 0.2);
      transform: translateX(-50%);
    }

    .momentum-bar {
      height: 28px;
      border-radius: 4px;
      position: absolute;
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
    }

    .momentum-bar.positive {
      left: 50%;
      background: linear-gradient(90deg, #E87B7B, #FF6B6B);
    }

    .momentum-bar.negative {
      right: 50%;
      background: linear-gradient(270deg, #6BCB77, #4CAF50);
    }

    .momentum-score {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      padding: 0 10px;
      white-space: nowrap;
    }

    .momentum-score.positive {
      margin-left: auto;
      padding-right: 10px;
    }

    .momentum-score.negative {
      margin-right: auto;
      padding-left: 10px;
    }

    .watch-container {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-soft);
    }

    .watch-toggle {
      display: inline-flex;
      border-radius: 10px;
      background: rgba(38, 70, 83, 0.08);
      padding: 4px;
      margin-bottom: 16px;
    }

    .watch-toggle-btn {
      border: none;
      background: transparent;
      color: var(--primary-teal);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .watch-toggle-btn.active {
      background: #fff;
      box-shadow: 0 2px 8px rgba(38, 70, 83, 0.16);
    }

    .watch-table {
      width: 100%;
      border-collapse: collapse;
    }

    .watch-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 12px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: left;
    }

    .watch-table td {
      padding: 11px 12px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.08);
      font-size: 13px;
    }

    .watch-table tr:hover td {
      background: rgba(233, 196, 106, 0.12);
    }

    .watch-delta-pos {
      color: #C0392B;
      font-weight: 700;
    }

    .watch-delta-neg {
      color: #1E8449;
      font-weight: 700;
    }

    .watch-detail {
      margin-top: 14px;
      border: 1px solid rgba(38, 70, 83, 0.12);
      border-radius: 10px;
      padding: 14px;
      background: rgba(38, 70, 83, 0.03);
    }

    .watch-detail-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-teal);
    }

    /* Mobile */
    @media (max-width: 768px) {
      .header {
        padding: 16px 20px;
      }

      .header-content {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .header-right {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .search-box {
        flex: 1;
        width: auto;
        min-width: 180px;
      }

      .refresh-btn {
        min-width: 76px;
        padding: 8px 10px;
      }

      .search-mode-select {
        min-width: 86px;
      }

      .search-box:focus {
        width: auto;
      }

      .main-content {
        padding: 20px;
      }

      .home-layout {
        grid-template-columns: 1fr;
      }

      .list-layout-wrapper {
        grid-template-columns: 1fr;
      }

      .sector-legend {
        position: static;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        padding: 16px;
      }

      .sector-legend-title {
        width: 100%;
        margin-bottom: 8px;
      }

      .sector-legend-item {
        padding: 4px 0;
      }

      .funds-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
      }

      .fund-card {
        padding: 16px;
      }

      .fund-card-chart {
        width: 100px;
        height: 100px;
      }

      .fund-card-name {
        font-size: 12px;
      }

      .list-container {
        grid-template-columns: 1fr;
      }

      .list-sidebar {
        position: static;
        max-height: none;
      }

      .detail-view {
        padding: 24px;
      }

      .fund-title {
        font-size: 18px;
        letter-spacing: 2px;
      }

      .tab {
        padding: 12px 16px;
        min-height: 44px;
      }

      .ranking-tab,
      .detail-tab,
      .view-toggle-btn {
        min-height: 44px;
      }

      .detail-tabs {
        margin-top: 4px;
      }

      .detail-sort {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (min-width: 1024px) {
      .home-layout {
        grid-template-columns: minmax(0, 1fr) 240px;
      }

      .list-container {
        grid-template-columns: 360px 1fr;
      }

      .funds-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      }

      .search-box {
        width: 260px;
      }
    }

    @media (max-width: 1500px) and (min-width: 769px) {
      .tab {
        padding: 9px 12px;
        font-size: 11px;
      }

      .search-box {
        width: 165px;
      }

      .search-mode-select {
        min-width: 80px;
        font-size: 11px;
      }

      .refresh-btn {
        min-width: 76px;
        font-size: 10px;
        padding: 8px 9px;
      }

      .search-box:focus {
        width: 190px;
      }

      .data-timestamp {
        display: none;
      }
    }

    function getNestedValue(source, path) {
      return path.split('.').reduce((acc, key) => (acc && acc[key] !== undefined ? acc[key] : undefined), source);
    }

    function interpolate(template, params) {
      if (!params) return template;
      return template.replace(/\{\{(\w+)\}\}/g, (match, key) => {
        const value = params[key];
        return value !== undefined && value !== null ? value : '';
      });
    }

    function translate(language, key, params) {
      const primary = getNestedValue(LOCALES[language], key);
      const fallback = getNestedValue(LOCALES.en, key);
      const text = typeof primary === 'string' ? primary : (typeof fallback === 'string' ? fallback : '');
      return interpolate(text, params);
    }

    function getInitialLanguage() {
      if (typeof window === 'undefined') return 'en';
      const stored = window.localStorage.getItem('pv_lang');
      if (stored === 'en' || stored === 'ja') return stored;
      const browser = (navigator.language || '').toLowerCase();
      return browser.startsWith('ja') ? 'ja' : 'en';
    }

    function getInitialWatchlist() {
      if (typeof window === 'undefined') return { tickers: [], funds: [] };
      try {
        const parsed = JSON.parse(window.localStorage.getItem(WATCHLIST_STORAGE_KEY) || '{}');
        const tickers = Array.isArray(parsed.tickers) ? parsed.tickers.map(normalizeTicker).filter(Boolean) : [];
        const funds = Array.isArray(parsed.funds) ? parsed.funds.map(v => String(v || '').trim()).filter(Boolean) : [];
        return {
          tickers: Array.from(new Set(tickers)),
          funds: Array.from(new Set(funds))
        };
      } catch (err) {
        return { tickers: [], funds: [] };
      }
    }

    function getInitialReadAlerts() {
      if (typeof window === 'undefined') return [];
      try {
        const parsed = JSON.parse(window.localStorage.getItem(ALERT_READ_STORAGE_KEY) || '[]');
        if (!Array.isArray(parsed)) return [];
        return parsed.map(v => String(v || '')).filter(Boolean);
      } catch (err) {
        return [];
      }
    }

    function resolveLocalizedValue(value, language) {
      if (!value) return '';
      if (typeof value === 'string') return value;
      if (typeof value === 'object') return value[language] || value.en || '';
      return '';
    }

    const I18nContext = React.createContext({
      language: 'en',
      setLanguage: () => {},
      t: (key, params) => translate('en', key, params)

    function useI18n() {
      return React.useContext(I18nContext);

    function normalizeTicker(value) {
      return String(value || '').trim().toUpperCase();
    }

    function normalizeSearchText(value) {
      return String(value || '').trim();
    }

    function isTickerLikeQuery(value) {
      const query = normalizeTicker(value);
      if (!query) return false;
      if (!/^[A-Z0-9.\-]+$/.test(query)) return false;
      if (query.length > 8) return false;
      return !/\s/.test(String(value || ''));
    }

    function resolveSearchIntent(query, mode) {
      if (mode === 'fund') return 'fund';
      if (mode === 'ticker') return 'ticker';
      return isTickerLikeQuery(query) ? 'ticker' : 'fund';
    }

    function matchesTicker(ticker, query, mode) {
      const intent = resolveSearchIntent(query, mode);
      if (intent !== 'ticker') return false;
      return normalizeTicker(ticker) === normalizeTicker(query);
    }

    function matchesFundName(name, query, mode) {
      const intent = resolveSearchIntent(query, mode);
      if (intent !== 'fund') return false;
      return String(name || '').toLowerCase().includes(normalizeSearchText(query).toLowerCase());
    }

    function formatGeneratedAt(value, language) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      const locale = language === 'ja' ? 'ja-JP' : 'en-US';
      return date.toLocaleString(locale, {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function normalizeFundKey(value) {
      return String(value || '')
        .toUpperCase()
        .replace(/[^A-Z0-9]+/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function formatAumValue(valueUsd) {
      if (valueUsd === null || valueUsd === undefined) return null;
      const abs = Math.abs(valueUsd);
      if (abs >= 1e12) return `$${(valueUsd / 1e12).toFixed(2)}T`;
      if (abs >= 1e9) return `$${(valueUsd / 1e9).toFixed(1)}B`;
      if (abs >= 1e6) return `$${(valueUsd / 1e6).toFixed(1)}M`;
      return `$${Number(valueUsd).toLocaleString()}`;
    }

      React.useEffect(() => {
        let cancelled = false;
        const load = async () => {
          const cacheBust = `ts=${Date.now()}`;
          try {
            const [metaRes, dataRes, prevRes] = await Promise.all([
              fetch(`${META_URL}?${cacheBust}`, { cache: 'no-store' }),
              fetch(`${DATA_URL}?${cacheBust}`, { cache: 'no-store' }),
              fetch(`${PREVIOUS_DATA_URL}?${cacheBust}`, { cache: 'no-store' })
            ]);
            if (dataRes.ok) {
              const data = await dataRes.json();
              if (!cancelled) setFunds(Array.isArray(data) ? data : []);
              if (prevRes.ok) {
                const prevData = await prevRes.json();
                if (!cancelled) setPreviousFunds(Array.isArray(prevData) ? prevData : []);
              } else if (!cancelled) {
                setPreviousFunds([]);
              }
              if (metaRes.ok) {
                const meta = await metaRes.json();
                if (!cancelled && meta?.asOf) setDataAsOf(meta.asOf);
                if (!cancelled) setDataGeneratedAt(String(meta?.generatedAt || ''));
              }
              return;
            }
          } catch (e) {
            // fall through to fallback
          }

          try {
            const fallbackRes = await fetch(FALLBACK_URL, { cache: 'no-store' });
            if (fallbackRes.ok) {
              const data = await fallbackRes.json();
              if (!cancelled) setFunds(Array.isArray(data) ? data : []);
              if (!cancelled) setPreviousFunds([]);
              if (!cancelled) setDataGeneratedAt('');
            }
          } catch (e) {
            if (!cancelled) {
              setFunds([]);
              setPreviousFunds([]);
              setDataGeneratedAt('');
            }
          }

          if (!cancelled) {
            setDataAsOf(FALLBACK_AS_OF);
            setDataGeneratedAt('');
          }
        };

        load();
        return () => { cancelled = true; };
      }, [reloadSeq]);

      React.useEffect(() => {

      const tickerSummary = React.useMemo(() => {
        const map = {};
        (funds || []).forEach((fund) => {
          (fund.holdings || []).forEach((holding) => {
            const ticker = normalizeTicker(holding?.ticker);
            if (!ticker) return;
            if (!map[ticker]) {
              map[ticker] = {
                ticker,
                name: holding?.name || ticker,
                sector: getHoldingSector(holding),
                fundCount: 0,
                totalWeight: 0,
                funds: []

            map[ticker].fundCount += 1;
            map[ticker].totalWeight += Number(holding?.percent || 0);
            map[ticker].funds.push({
              name: fund.name,
              weight: Number(holding?.percent || 0)
            });
          });
        });
        return Object.values(map)
          .map((row) => ({
            ...row,
            totalWeight: Number(row.totalWeight.toFixed(1)),
            funds: row.funds.sort((a, b) => b.weight - a.weight)

        () => buildTickerDeltaMap(funds, previousFunds),

      const currentFundMap = React.useMemo(() => {

      const alerts = React.useMemo(() => {

          if (!delta || delta.score === 0) return;
          items.push({
            id: `ticker:${ticker}:${delta.score}`,
            type: 'ticker',
            ticker,
            message: `${t('alerts.tickerFlow')}: ${ticker} (${delta.score > 0 ? '+' : ''}${delta.score})`
          });
        });

        watchedFundSet.forEach((fundName) => {
          const currentFund = currentFundMap.get(fundName);
          const prevFund = previousFundMap.get(fundName);
          const currentCount = (currentFund?.holdings || []).length;
          const prevCount = (prevFund?.holdings || []).length;
          const currentTop = currentFund?.holdings?.[0]?.ticker || '';
          const prevTop = prevFund?.holdings?.[0]?.ticker || '';

          if (!currentFund && !prevFund) return;
          if (currentCount === prevCount && currentTop === prevTop) return;
          items.push({
            id: `fund:${fundName}:${currentCount}:${prevCount}:${currentTop}:${prevTop}`,
            type: 'fund',
            fundName,
            message: `${t('alerts.fundChanged')}: ${fundName} (${prevCount}→${currentCount})`

      const triggerDataRefresh = React.useCallback(async () => {
        if (refreshState === 'requesting' || refreshState === 'queued') return;
        if (refreshPollRef.current) {
          window.clearInterval(refreshPollRef.current);
          refreshPollRef.current = null;
        }

        setRefreshState('requesting');
        setRefreshLabel(t('refresh.requesting'));
        const baselineGeneratedAt = dataGeneratedAt;

        try {
          const headers = { 'Content-Type': 'application/json' };
          if (typeof window !== 'undefined') {
            const refreshKey = window.localStorage.getItem('pv_refresh_key');
            if (refreshKey) headers['x-refresh-key'] = refreshKey;
          }

          const res = await fetch('/api/refresh-13f', {
            method: 'POST',
            headers
          });
          const payload = await res.json().catch(() => ({}));
          if (!res.ok || !payload?.ok) {
            throw new Error(payload?.error || 'dispatch failed');
          }

          setRefreshState('queued');
          setRefreshLabel(t('refresh.queued'));

          let checks = 0;
          refreshPollRef.current = window.setInterval(async () => {
            checks += 1;
            try {
              const metaRes = await fetch(`${META_URL}?ts=${Date.now()}`, { cache: 'no-store' });
              if (metaRes.ok) {
                const meta = await metaRes.json();
                const nextGeneratedAt = String(meta?.generatedAt || '');
                const changed = nextGeneratedAt && nextGeneratedAt !== baselineGeneratedAt;
                if (changed) {
                  window.clearInterval(refreshPollRef.current);
                  refreshPollRef.current = null;
                  setDataAsOf(meta?.asOf || FALLBACK_AS_OF);
                  setDataGeneratedAt(nextGeneratedAt);
                  setRefreshState('done');
                  setRefreshLabel(t('refresh.done'));
                  setReloadSeq((prev) => prev + 1);
                  window.setTimeout(() => {
                    setRefreshState('idle');
                    setRefreshLabel('');
                  }, 6000);
                  return;
                }
              }
            } catch (err) {
              // keep polling
            }

            if (checks % 3 === 0) {
              setRefreshLabel(t('refresh.waiting'));
            }

            if (checks >= 54) {
              window.clearInterval(refreshPollRef.current);
              refreshPollRef.current = null;
              setRefreshState('error');
              setRefreshLabel(t('refresh.timeout'));
            }
          }, 10000);
        } catch (err) {
          setRefreshState('error');
          setRefreshLabel(t('refresh.failed'));
          window.setTimeout(() => {
            setRefreshState('idle');
            setRefreshLabel('');
          }, 6000);
        }
      }, [dataGeneratedAt, refreshState, t]);

      const filtered = funds.filter(f => {
        const query = normalizeSearchText(search);
        if (!query) return true;
        const nameMatch = matchesFundName(f.name, query, searchMode);
        const tickerMatch = (f.holdings || []).some(h => matchesTicker(h.ticker, query, searchMode));
        return nameMatch || tickerMatch;
      });

      const searchPlaceholder = React.useMemo(() => {
        if (searchMode === 'ticker') return t('search.placeholderTicker');
        if (searchMode === 'fund') return t('search.placeholderFund');
        return t('search.placeholder');
      }, [searchMode, t]);

      const handleSelectFund = (fund) => {
        setSelected(fund);
        if (tab === 'home') setTab('detail');
      };

      const handleOpenFundDetail = (fund) => {
        setSelected(fund);
        setTab('detail');
      };

      const handleBack = () => {
        setSelected(null);
        setTab('home');
      };

      return (
        <I18nContext.Provider value={{ language, setLanguage, t }}>
          <div className={`app-shell mode-${layout}`}>
            <header className="header">
              <div className="header-content">
                <div className="logo">{t('app.title')}</div>
                <div className="tabs">
                  <button className={`tab ${tab === 'home' || tab === 'detail' ? 'active' : ''}`} onClick={() => { setTab('home'); setSelected(null); }}>{t('nav.home')}</button>
                  <button className={`tab ${tab === 'list' ? 'active' : ''}`} onClick={() => setTab('list')}>{t('nav.list')}</button>
                  <button className={`tab ${tab === 'ranking' ? 'active' : ''}`} onClick={() => setTab('ranking')}>{t('nav.ranking')}</button>
                  <button className={`tab ${tab === 'overlap' ? 'active' : ''}`} onClick={() => setTab('overlap')}>{t('nav.overlap')}</button>
                  <button className={`tab ${tab === 'flow' ? 'active' : ''}`} onClick={() => setTab('flow')}>{t('nav.flow')}</button>
                  <button className={`tab ${tab === 'watch' ? 'active' : ''}`} onClick={() => setTab('watch')}>{t('nav.watch')}</button>
                </div>
                <div className="header-right">
                  <button
                    className="refresh-btn"
                    onClick={triggerDataRefresh}
                    disabled={refreshState === 'requesting' || refreshState === 'queued'}
                    title={t('refresh.button')}
                  >
                    {refreshButtonLabel}
                  </button>
                  <select className="search-mode-select" value={searchMode} onChange={(e) => setSearchMode(e.target.value)}>
                    <option value="smart">{t('search.modeSmart')}</option>
                    <option value="fund">{t('search.modeFund')}</option>
                    <option value="ticker">{t('search.modeTicker')}</option>
                  </select>
                  <input type="text" className="search-box" placeholder={searchPlaceholder} value={search} onChange={e => setSearch(e.target.value)} />
                  <div className="data-timestamp">
                    {t('common.dataAsOf')}: {dataAsOf}
                    {generatedAtText ? ` · ${t('refresh.generatedAt')}: ${generatedAtText}` : ''}
                  </div>
                  {refreshLabel && (
                    <div className={`refresh-status ${refreshState === 'error' ? 'error' : ''}`}>
                      {refreshLabel}
                    </div>
                  )}
                  <button className="alert-btn" onClick={() => setAlertsOpen((v) => !v)}>
                    🔔
                    {unreadAlertCount > 0 && <span className="alert-badge">{unreadAlertCount}</span>}
                  </button>
                  {alertsOpen && (
                    <div className="alerts-panel">
                      <div className="alerts-header">
                        <div className="alerts-title">{t('alerts.title')}</div>
                        <button className="alerts-clear" onClick={markAllAlertsRead}>{t('alerts.markAllRead')}</button>
                      </div>
                      {alerts.length === 0 && <div className="alert-item">{t('alerts.noAlerts')}</div>}
                      {alerts.map((alert) => (
                        <div key={alert.id} className={`alert-item ${readAlertIds.includes(alert.id) ? '' : 'unread'}`}>
                          {alert.message}
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="lang-toggle">
                    <button className={`lang-btn ${language === 'en' ? 'active' : ''}`} onClick={() => setLanguage('en')}>EN</button>
                    <button className={`lang-btn ${language === 'ja' ? 'active' : ''}`} onClick={() => setLanguage('ja')}>JP</button>
                  </div>
                </div>
              </div>
            </header>
            <main className="main-content">
              {tab === 'home' && (
                <HomeView
                  funds={filtered}
                  onSelect={handleSelectFund}
                  watchedFundSet={watchedFundSet}
                  onToggleFundWatch={toggleWatchFund}
                />
              )}
              {tab === 'detail' && selected && (
                <DetailView
                  fund={selected}
                  searchTerm={search}
                  searchMode={searchMode}
                  onBack={handleBack}
                  watchedTickerSet={watchedTickerSet}
                  watchedFundSet={watchedFundSet}
                  onToggleTickerWatch={toggleWatchTicker}
                  onToggleFundWatch={toggleWatchFund}
                />
              )}
              {tab === 'list' && (
                <ListView
                  funds={filtered}
                  selected={selected}
                  onSelect={setSelected}
                  searchTerm={search}
                  searchMode={searchMode}
                  watchedTickerSet={watchedTickerSet}
                  watchedFundSet={watchedFundSet}
                  onToggleTickerWatch={toggleWatchTicker}
                  onToggleFundWatch={toggleWatchFund}
                />
              )}
              {tab === 'ranking' && <RankingView funds={funds} watchedTickerSet={watchedTickerSet} onToggleTickerWatch={toggleWatchTicker} />}
              {tab === 'overlap' && <OverlapView funds={funds} />}
              {tab === 'flow' && <FlowView currentFunds={funds} previousFunds={previousFunds} dataAsOf={dataAsOf} />}
              {tab === 'watch' && (
                <WatchView
                  currentFunds={funds}
                  previousFunds={previousFunds}
                  watchlist={watchlist}
                  tickerSummary={tickerSummary}
                  tickerDeltaRows={tickerDeltaRows}
                  watchedTickerSet={watchedTickerSet}
                  watchedFundSet={watchedFundSet}
                  onToggleTickerWatch={toggleWatchTicker}
                  onToggleFundWatch={toggleWatchFund}
                  onOpenFund={handleOpenFundDetail}
                />
              )}
            </main>
          </div>
        </I18nContext.Provider>
      );
    }

    function HomeView({ funds, onSelect, watchedFundSet, onToggleFundWatch }) {
      const { t } = useI18n();
      const [activeSector, setActiveSector] = React.useState(null);

      const sortedFunds = React.useMemo(() => {
        if (!activeSector) return funds;
        return [...funds].sort((a, b) => {
          const aWeight = a.holdings.reduce((sum, h) => getHoldingSector(h) === activeSector ? sum + h.percent : sum, 0);
          const bWeight = b.holdings.reduce((sum, h) => getHoldingSector(h) === activeSector ? sum + h.percent : sum, 0);
          return bWeight - aWeight;
        });
      }, [funds, activeSector]);

      if (!funds || funds.length === 0) {
        return (
          <div className="empty-state">
            <div className="empty-icon">🔍</div>
            <h2>{t('common.noResults')}</h2>
            <p>{t('common.selectFundDesc')}</p>
          </div>
        );
      }

      return (
        <div className="home-layout">
          <div className="funds-grid">
            {sortedFunds.map((fund, i) => (
              <FundCard
                key={fund.name}
                fund={fund}
                onClick={() => onSelect(fund)}
                isWatched={watchedFundSet.has(fund.name)}
                onToggleWatch={onToggleFundWatch}
              />
            ))}
          </div>
          <SectorLegend activeSector={activeSector} onSectorClick={setActiveSector} />
        </div>
      );
    }

    function FundCard({ fund, onClick, isWatched, onToggleWatch }) {
      const chartRef = React.useRef(null);
      const chartInstance = React.useRef(null);
      const { t } = useI18n();

      React.useEffect(() => {
        if (chartInstance.current) chartInstance.current.destroy();
        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: fund.holdings.slice(0, 5).map(h => h.ticker),
            datasets: [{ data: fund.holdings.slice(0, 5).map(h => h.percent), backgroundColor: fund.holdings.slice(0, 5).map(h => getHoldingSectorColor(h)), borderWidth: 2, borderColor: '#fff' }]
          },
          options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false }, tooltip: { enabled: false } }, cutout: '55%', animation: { duration: 0 } }
        });
        return () => chartInstance.current?.destroy();
      }, [fund]);

      return (
        <div className="fund-card" onClick={onClick}>
          <button
            className={`watch-btn ${isWatched ? 'active' : ''}`}
            style={{ position: 'absolute', top: '10px', right: '10px', background: 'rgba(255,255,255,0.9)' }}
            onClick={(e) => {
              e.stopPropagation();
              onToggleWatch(fund.name);
            }}
            title={isWatched ? 'Unwatch' : 'Watch'}
          >
            ★
          </button>
          <div className="fund-card-chart"><canvas ref={chartRef}></canvas></div>
          <div className="fund-card-name">{fund.name}</div>
          <div className="fund-card-meta">
            <span>{t('common.holdingsCount', { count: fund.holdings.length })}</span>
            <span>{t('common.top')}: {fund.holdings[0]?.ticker}</span>
          </div>
        </div>
      );
    }

    function ListView({ funds, selected, onSelect, searchTerm, searchMode, watchedTickerSet, watchedFundSet, onToggleTickerWatch, onToggleFundWatch }) {
      const { t } = useI18n();
      if (!funds || funds.length === 0) {
        return (
          <div className="empty-state">
            <div className="empty-icon">🔍</div>
            <h2>{t('common.noResults')}</h2>
            <p>{t('common.selectFundDesc')}</p>
          </div>
        );
      }
      return (
        <div className="list-layout-wrapper">
          <div className="list-container">
            <div className="list-sidebar">
              {funds.map((fund, i) => (
                <div key={i} className={`list-item ${selected?.name === fund.name ? 'active' : ''}`} onClick={() => onSelect(fund)}>{fund.name}</div>
              ))}
            </div>
            <div>
              {selected ? (
                <DetailView
                  fund={selected}
                  searchTerm={searchTerm}
                  searchMode={searchMode}
                  watchedTickerSet={watchedTickerSet}
                  watchedFundSet={watchedFundSet}
                  onToggleTickerWatch={onToggleTickerWatch}
                  onToggleFundWatch={onToggleFundWatch}
                />
              ) : <div className="empty-state"><div className="empty-icon">📊</div><h2>{t('common.selectFund')}</h2><p>{t('common.selectFundDesc')}</p></div>}
            </div>
          </div>
          <SectorLegend />
        </div>
      );
    }

    function DetailView({ fund, onBack, searchTerm, searchMode, watchedTickerSet, watchedFundSet, onToggleTickerWatch, onToggleFundWatch }) {
      const chartRef = React.useRef(null);
      const chartInstance = React.useRef(null);
      const matchRowRef = React.useRef(null);
      const { t, language } = useI18n();
      const [detailTab, setDetailTab] = React.useState('holdings');
      const [sortMode, setSortMode] = React.useState('weight');
      const [isExpanded, setIsExpanded] = React.useState(false);
      const holdings = fund?.holdings || [];
      const normalizedSearch = normalizeSearchText(searchTerm);
      const shouldHighlightTickers = resolveSearchIntent(normalizedSearch, searchMode) === 'ticker';

      React.useEffect(() => {
        setDetailTab('holdings');
        setSortMode('weight');
        setIsExpanded(false);
      }, [fund?.name]);

      const sortedHoldings = React.useMemo(() => {
        const items = [...holdings];
        if (sortMode === 'ticker') {
          items.sort((a, b) => normalizeTicker(a.ticker).localeCompare(normalizeTicker(b.ticker)));
        } else {
          items.sort((a, b) => b.percent - a.percent);
        }
        return items;
      }, [holdings, sortMode]);

      const firstMatchIndex = React.useMemo(() => {
        if (!normalizedSearch || !shouldHighlightTickers) return -1;
        return sortedHoldings.findIndex(h => normalizeTicker(h.ticker) === normalizeTicker(normalizedSearch));
      }, [sortedHoldings, normalizedSearch, shouldHighlightTickers]);

      React.useEffect(() => {
        if (detailTab !== 'holdings') return;
        if (!normalizedSearch || !shouldHighlightTickers) return;
        if (matchRowRef.current) {
          matchRowRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, [normalizedSearch, shouldHighlightTickers, detailTab, sortMode, fund?.name]);

      React.useEffect(() => {
        if (chartInstance.current) chartInstance.current.destroy();
        if (detailTab !== 'holdings' || !chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: holdings.map(h => h.ticker),
            datasets: [{
              data: holdings.map(h => h.percent),
              backgroundColor: holdings.map(h => getHoldingSectorColor(h)),
              borderWidth: 2,
              borderColor: '#fff'
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#264653',
                titleFont: { family: 'Montserrat', weight: '600' },
                bodyFont: { family: 'Montserrat' },
                callbacks: {
                  title: function (items) {
                    return items[0].label + '  ' + items[0].raw.toFixed(1) + '%';
                  },
                  label: function (ctx) {
                    const holding = holdings[ctx.dataIndex];
                    return getHoldingSectorName(holding, language);
                  }
                }
              }
            },
            cutout: '60%'
          }
        });
        return () => chartInstance.current?.destroy();
      }, [holdings, language, detailTab]);

      const profile = React.useMemo(() => getFundProfile(fund), [fund]);
      const topConcentration = React.useMemo(() => getTopConcentration(holdings), [holdings]);
      const description = resolveLocalizedValue(profile.overview, language) || t('fund.aboutPlaceholder');
      const isLongDescription = description.length > 160;
      const visibleDescription = isExpanded || !isLongDescription ? description : `${description.slice(0, 160)}...`;

      const manager = resolveLocalizedValue(profile.manager, language) || t('common.unknown');
      const strategy = resolveLocalizedValue(profile.strategy, language) || t('common.unknown');
      const strength = resolveLocalizedValue(profile.strength, language) || t('common.unknown');
      const aumValue = profile.aum?.value;
      const aumAsOf = profile.aum?.asOf;
      const aum = aumValue
        ? (aumAsOf
          ? (language === 'ja' ? `${aumValue} (${aumAsOf} ${t('common.asOf')})` : `${aumValue} (${t('common.asOf')} ${aumAsOf})`)
          : aumValue)
        : t('common.notAvailable');
      const concentration = topConcentration ? `${topConcentration.toFixed(1)}%` : t('common.notAvailable');

      return (
        <div className="detail-view">
          {onBack && <button className="back-btn" onClick={onBack}>← {t('common.backToHome')}</button>}
          <h1 className="fund-title" style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span>{fund.name}</span>
            <button
              className={`watch-btn ${watchedFundSet?.has(fund.name) ? 'active' : ''}`}
              onClick={() => onToggleFundWatch && onToggleFundWatch(fund.name)}
              title={watchedFundSet?.has(fund.name) ? 'Unwatch fund' : 'Watch fund'}
            >
              ★
            </button>
          </h1>
          <p className="fund-subtitle">{t('common.holdingsCount', { count: holdings.length })}</p>
          <div className="detail-tabs">
            <button className={`detail-tab ${detailTab === 'holdings' ? 'active' : ''}`} onClick={() => setDetailTab('holdings')}>{t('fund.tabs.holdings')}</button>
            <button className={`detail-tab ${detailTab === 'about' ? 'active' : ''}`} onClick={() => setDetailTab('about')}>{t('fund.tabs.about')}</button>
          </div>

          {detailTab === 'holdings' && (
            <>
              <div className="detail-toolbar">
                <div className="detail-sort">
                  <span>{t('common.sortLabel')}</span>
                  <select value={sortMode} onChange={e => setSortMode(e.target.value)}>
                    <option value="weight">{t('common.sortWeight')}</option>
                    <option value="ticker">{t('common.sortTicker')}</option>
                  </select>
                </div>
                {shouldHighlightTickers && normalizedSearch && firstMatchIndex !== -1 && <div className="detail-hint">{t('common.highlightHint')}</div>}
              </div>
              {holdings.length === 0 ? (
                <div className="empty-state">
                  <div className="empty-icon">📄</div>
                  <h2>{t('common.noHoldings')}</h2>
                </div>
              ) : (
                <>
                  <div className="chart-container"><canvas ref={chartRef}></canvas></div>
                  <div className="table-container">
                    <table className="holdings-table">
                      <thead><tr><th>{t('common.ticker')}</th><th>{t('common.company')}</th><th>{t('common.sector')}</th><th>{t('common.allocation')}</th></tr></thead>
                      <tbody>
                        {sortedHoldings.map((h, i) => {
                          const sector = getHoldingSector(h);
                          const sectorLabel = translate(language, `sector.${sector}`) || sector;
                          const isMatch = shouldHighlightTickers && normalizedSearch && normalizeTicker(h.ticker) === normalizeTicker(normalizedSearch);
                          const rowRef = i === firstMatchIndex ? matchRowRef : null;
                          return (
                            <tr key={i} ref={rowRef} className={`holding-row ${isMatch ? 'match' : ''}`}>
                              <td>
                                <span className="ticker">{h.ticker}</span>
                                <button
                                  className={`watch-btn compact ${watchedTickerSet?.has(normalizeTicker(h.ticker)) ? 'active' : ''}`}
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    onToggleTickerWatch && onToggleTickerWatch(h.ticker);
                                  }}
                                  title={watchedTickerSet?.has(normalizeTicker(h.ticker)) ? 'Unwatch ticker' : 'Watch ticker'}
                                >
                                  ★
                                </button>
                              </td>
                              <td>{h.name}</td>
                              <td><span className="sector-badge" style={{ background: SECTOR_COLORS[sector] }}>{sectorLabel}</span></td>
                              <td><div className="percent-bar"><div className="percent-bar-bg"><div className={`percent-bar-fill ${i === 0 ? 'top' : ''}`} style={{ width: `${h.percent}%` }}></div></div><span className="percent-value">{h.percent.toFixed(1)}%</span></div></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </>
              )}
            </>
          )}

          {detailTab === 'about' && (
            <>
              <div className="about-grid">
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.fundInfo')}</div>
                  <div className="profile-value">{fund.name}</div>
                </div>
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.manager')}</div>
                  <div className="profile-value">{manager}</div>
                </div>
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.aum')}</div>
                  <div className="profile-value">{aum}</div>
                </div>
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.strategy')}</div>
                  <div className="profile-value">{strategy}</div>
                </div>
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.strength')}</div>
                  <div className="profile-value">{strength}</div>
                </div>
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.top10')}</div>
                  <div className="profile-value">{concentration}</div>
                </div>
              </div>
              <div className="profile-description">
                <div className="profile-label">{t('fund.section.overview')}</div>
                <div>{visibleDescription}</div>
                {isLongDescription && (
                  <button className="read-more" onClick={() => setIsExpanded(v => !v)}>
                    {isExpanded ? t('common.readLess') : t('common.readMore')}
                  </button>
                )}
              </div>
            </>
          )}
        </div>
      );
    }

    function OverlapView({ funds }) {
      const { t, language } = useI18n();
      const [fundAIndex, setFundAIndex] = React.useState('');
      const [fundBIndex, setFundBIndex] = React.useState('');

      if (!funds || funds.length === 0) {
        return (
          <div className="empty-state">
            <div className="empty-icon">📄</div>
            <h2>{t('common.noResults')}</h2>
            <p>{t('common.selectFundDesc')}</p>
          </div>
        );
      }

      const fundA = fundAIndex !== '' ? funds[parseInt(fundAIndex)] : null;
      const fundB = fundBIndex !== '' ? funds[parseInt(fundBIndex)] : null;

      const analysis = React.useMemo(() => {
        if (!fundA || !fundB) return null;
        const holdingsA = {};
        fundA.holdings.forEach(h => { holdingsA[h.ticker] = h; });
        const holdingsB = {};
        fundB.holdings.forEach(h => { holdingsB[h.ticker] = h; });

        const common = [];
        const onlyA = [];
        const onlyB = [];

        Object.keys(holdingsA).forEach(ticker => {
          if (holdingsB[ticker]) {
            const sector = holdingsA[ticker].sector || holdingsB[ticker].sector || '';
            common.push({ ticker, name: holdingsA[ticker].name, weightA: holdingsA[ticker].percent, weightB: holdingsB[ticker].percent, sector });
          } else {
            onlyA.push(holdingsA[ticker]);
          }
        });
        Object.keys(holdingsB).forEach(ticker => {
          if (!holdingsA[ticker]) onlyB.push(holdingsB[ticker]);
        });

        common.sort((a, b) => (b.weightA + b.weightB) - (a.weightA + a.weightB));
        return { common, onlyA, onlyB };
      }, [fundA, fundB]);

      return (
        <div>
          <div className="ranking-section-title">{t('overlap.title')}</div>
          <div className="overlap-controls">
            <div className="overlap-select-group">
              <label className="overlap-select-label">{t('overlap.fundA')}</label>
              <select className="overlap-select" value={fundAIndex} onChange={e => setFundAIndex(e.target.value)}>
                <option value="">{t('common.selectFundPlaceholder')}</option>
                {funds.map((f, i) => <option key={i} value={i}>{f.name}</option>)}
              </select>
            </div>
            <div className="overlap-vs">{t('common.vs')}</div>
            <div className="overlap-select-group">
              <label className="overlap-select-label">{t('overlap.fundB')}</label>
              <select className="overlap-select" value={fundBIndex} onChange={e => setFundBIndex(e.target.value)}>
                <option value="">{t('common.selectFundPlaceholder')}</option>
                {funds.map((f, i) => <option key={i} value={i}>{f.name}</option>)}
              </select>
            </div>
          </div>

          {!analysis && (
            <div className="overlap-result">
              <div className="overlap-empty">{t('common.selectBothFunds')}</div>
            </div>
          )}

          {analysis && (
            <div className="overlap-result">
              <div className="overlap-summary">
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.common.length}</div>
                  <div className="overlap-stat-label">{t('common.commonHoldings')}</div>
                </div>
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.onlyA.length}</div>
                  <div className="overlap-stat-label">{t('common.onlyInA')}</div>
                </div>
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.onlyB.length}</div>
                  <div className="overlap-stat-label">{t('common.onlyInB')}</div>
                </div>
              </div>

              {analysis.common.length > 0 ? (
                <div style={{ borderRadius: '12px', overflow: 'hidden' }}>
