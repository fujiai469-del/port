<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Visualizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg-sand: #E8E1D5;
      --primary-teal: #264653;
      --accent-gold: #E9C46A;
      --teal-light: #2A9D8F;
      --teal-dark: #1D3F4A;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-sand);
      color: var(--primary-teal);
      min-height: 100vh;
    }

    /* Header & Tabs */
    .header {
      background: var(--primary-teal);
      padding: 20px 40px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      gap: 8px;
    }

    .tab {
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      border: none;
      font-family: 'Montserrat', sans-serif;
    }

    .tab:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .tab.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search-box {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 13px;
      width: 220px;
      outline: none;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-box:focus {
      background: rgba(255, 255, 255, 0.2);
      width: 280px;
    }

    .lang-toggle {
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .lang-btn {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.8);
    }

    .lang-btn.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    .data-timestamp {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* Main Content */
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px;
    }

    /* Layout with legend */
    .home-layout {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 32px;
    }

    .list-layout-wrapper {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 32px;
    }

    /* Sector Legend */
    .sector-legend {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .sector-legend-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-teal);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--bg-sand);
    }

    .sector-legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      font-size: 12px;
      color: var(--primary-teal);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .sector-legend-item:hover {
      background: rgba(38, 70, 83, 0.05);
    }

    .sector-legend-item.active {
      background: var(--accent-gold);
      font-weight: 600;
    }

    .sector-legend-item.dimmed {
      opacity: 0.4;
    }

    .sector-legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .sector-legend-label {
      font-weight: 500;
    }

    /* Home Grid */
    .funds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .fund-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .fund-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(38, 70, 83, 0.15);
    }

    .fund-card-chart {
      width: 140px;
      height: 140px;
      margin-bottom: 16px;
    }

    .fund-card-name {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: var(--primary-teal);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .fund-card-meta {
      font-size: 11px;
      color: var(--teal-light);
      display: flex;
      gap: 12px;
    }

    .fund-card-meta span {
      background: rgba(42, 157, 143, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* List View */
    .list-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 40px;
      min-height: calc(100vh - 140px);
    }

    .list-sidebar {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      height: fit-content;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      position: sticky;
      top: 100px;
    }

    .list-item {
      padding: 14px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
      margin-bottom: 4px;
      border-left: 3px solid transparent;
    }

    .list-item:hover {
      background: rgba(38, 70, 83, 0.05);
    }

    .list-item.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
      font-weight: 600;
      border-left-color: var(--primary-teal);
    }

    /* Detail View */
    .detail-view {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      background: rgba(38, 70, 83, 0.05);
      color: var(--primary-teal);
      border: none;
      margin-bottom: 24px;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .back-btn:hover {
      background: rgba(38, 70, 83, 0.1);
    }

    .fund-title {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-teal);
    }

    .fund-subtitle {
      color: var(--teal-light);
      font-size: 14px;
      margin-bottom: 40px;
    }

    .chart-container {
      max-width: 350px;
      margin: 0 auto 40px;
    }

    .table-container {
      background: var(--bg-sand);
      border-radius: 16px;
      overflow: hidden;
    }

    .holdings-table {
      width: 100%;
      border-collapse: collapse;
    }

    .holdings-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 16px 20px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 600;
    }

    .holdings-table td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.1);
      background: #fff;
    }

    .holdings-table tr:last-child td {
      border-bottom: none;
    }

    .holdings-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .ticker {
      font-weight: 700;
      color: var(--primary-teal);
      background: rgba(233, 196, 106, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
    }

    .sector-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      color: #fff;
      display: inline-block;
      margin-left: 8px;
    }

    .percent-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .percent-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(38, 70, 83, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .percent-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-teal), var(--teal-light));
      border-radius: 4px;
    }

    .percent-bar-fill.top {
      background: linear-gradient(90deg, var(--accent-gold), #F4A261);
    }

    .percent-value {
      font-weight: 600;
      min-width: 50px;
      text-align: right;
    }

    /* Ranking View */
    .ranking-table-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      overflow: hidden;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
    }

    .ranking-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 16px 20px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 600;
    }

    .ranking-table td {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.08);
      background: #fff;
      font-size: 13px;
    }

    .ranking-table tr:last-child td {
      border-bottom: none;
    }

    .ranking-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .ranking-rank {
      font-weight: 700;
      color: var(--primary-teal);
      font-size: 14px;
    }

    .ranking-rank.top3 {
      color: var(--accent-gold);
    }

    .weight-cell {
      position: relative;
      overflow: hidden;
    }

    .weight-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: rgba(38, 70, 83, 0.1);
      border-radius: 0 4px 4px 0;
      transition: width 0.5s ease;
    }

    .weight-bar.accent {
      background: rgba(42, 157, 143, 0.15);
    }

    .weight-value {
      position: relative;
      z-index: 1;
      font-weight: 600;
      font-size: 13px;
    }

    .ranking-funds-count {
      font-size: 11px;
      color: var(--teal-light);
      background: rgba(42, 157, 143, 0.1);
      padding: 3px 8px;
      border-radius: 10px;
    }

    .ranking-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--primary-teal);
      margin-bottom: 20px;
    }

    .ranking-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .ranking-tab {
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s;
      background: #fff;
      color: var(--primary-teal);
      border: 2px solid rgba(38, 70, 83, 0.12);
      font-family: 'Montserrat', sans-serif;
    }

    .ranking-tab:hover {
      border-color: var(--teal-light);
    }

    .ranking-tab.active {
      background: var(--primary-teal);
      color: #fff;
      border-color: var(--primary-teal);
    }

    .ranking-table tr.clickable {
      cursor: pointer;
    }

    .ranking-table tr.clickable:hover td {
      background: rgba(233, 196, 106, 0.15);
    }

    .ticker-funds-panel {
      background: var(--bg-sand);
      border-radius: 0 0 12px 12px;
    }

    .ticker-funds-panel td {
      padding: 0 !important;
      background: transparent !important;
    }

    .ticker-funds-inner {
      padding: 12px 20px 16px 60px;
    }

    .ticker-funds-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--teal-light);
      margin-bottom: 8px;
    }

    .ticker-fund-chip {
      display: inline-block;
      background: #fff;
      border: 1px solid rgba(38, 70, 83, 0.1);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 500;
      color: var(--primary-teal);
      margin: 3px 4px 3px 0;
      transition: all 0.2s;
    }

    .ticker-fund-chip:hover {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    .ticker-fund-chip .chip-weight {
      font-weight: 700;
      color: var(--teal-light);
      margin-left: 6px;
    }

    /* Overlap Analysis */
    .overlap-controls {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .overlap-select-group {
      flex: 1;
      min-width: 240px;
    }

    .overlap-select-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-teal);
      margin-bottom: 8px;
      display: block;
    }

    .overlap-select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid rgba(38, 70, 83, 0.15);
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-teal);
      background: #fff;
      cursor: pointer;
      transition: all 0.3s;
      outline: none;
    }

    .overlap-select:focus {
      border-color: var(--teal-light);
      box-shadow: 0 0 0 3px rgba(42, 157, 143, 0.1);
    }

    .overlap-vs {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-gold);
      padding-top: 20px;
    }

    .overlap-result {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .overlap-summary {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .overlap-stat {
      background: var(--bg-sand);
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
    }

    .overlap-stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-teal);
    }

    .overlap-stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--teal-light);
      margin-top: 4px;
    }

    .overlap-table {
      width: 100%;
      border-collapse: collapse;
    }

    .overlap-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 14px 16px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 11px;
      font-weight: 600;
    }

    .overlap-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.08);
      font-size: 13px;
    }

    .overlap-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .overlap-empty {
      text-align: center;
      padding: 40px;
      color: var(--primary-teal);
      opacity: 0.5;
      font-size: 14px;
    }

    /* Flow / Treemap */
    .flow-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      padding: 32px;
    }

    .treemap-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    .treemap-wrapper svg {
      display: block;
    }

    .treemap-cell rect {
      stroke: var(--bg-sand);
      stroke-width: 2px;
      transition: opacity 0.15s;
    }

    .treemap-cell:hover rect {
      opacity: 0.85;
    }

    .treemap-cell text {
      pointer-events: none;
      font-family: 'Montserrat', sans-serif;
    }

    .treemap-tooltip {
      position: fixed;
      background: var(--primary-teal);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Montserrat', sans-serif;
      pointer-events: none;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      line-height: 1.6;
      max-width: 260px;
    }

    .treemap-tooltip .tt-ticker {
      font-weight: 700;
      font-size: 14px;
    }

    .treemap-tooltip .tt-company {
      opacity: 0.8;
      font-size: 11px;
    }

    .treemap-tooltip .tt-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 4px;
    }

    .treemap-tooltip .tt-change-pos {
      color: #FF6B6B;
      font-weight: 700;
    }

    .treemap-tooltip .tt-change-neg {
      color: #6BCB77;
      font-weight: 700;
    }

    .flow-legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--primary-teal);
    }

    .flow-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flow-legend-swatch {
      width: 28px;
      height: 14px;
      border-radius: 3px;
    }

    .flow-scale {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .flow-scale-bar {
      width: 120px;
      height: 12px;
      border-radius: 3px;
    }

    .flow-scale-label {
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 400px;
      color: var(--primary-teal);
      opacity: 0.6;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    /* View Toggle - Neumorphism Style */
    .view-toggle-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .view-toggle {
      display: flex;
      background: #E8E1D5;
      border-radius: 16px;
      padding: 6px;
      box-shadow: inset 3px 3px 8px rgba(0, 0, 0, 0.08),
        inset -3px -3px 8px rgba(255, 255, 255, 0.9);
    }

    .view-toggle-btn {
      padding: 12px 28px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      background: transparent;
      color: var(--primary-teal);
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .view-toggle-btn:hover {
      color: var(--teal-light);
    }

    .view-toggle-btn.active {
      background: #fff;
      box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.1),
        -2px -2px 6px rgba(255, 255, 255, 0.8);
      color: var(--primary-teal);
    }

    /* Sector Momentum Bar Chart */
    .sector-momentum-container {
      background: #fff;
      border-radius: 16px;
      padding: 24px 32px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .momentum-chart {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .momentum-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      align-items: center;
      gap: 16px;
      height: 40px;
    }

    .momentum-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-teal);
      text-align: right;
    }

    .momentum-bar-wrapper {
      display: flex;
      align-items: center;
      height: 100%;
      position: relative;
    }

    .momentum-bar-center {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(38, 70, 83, 0.2);
      transform: translateX(-50%);
    }

    .momentum-bar {
      height: 28px;
      border-radius: 4px;
      position: absolute;
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
    }

    .momentum-bar.positive {
      left: 50%;
      background: linear-gradient(90deg, #E87B7B, #FF6B6B);
    }

    .momentum-bar.negative {
      right: 50%;
      background: linear-gradient(270deg, #6BCB77, #4CAF50);
    }

    .momentum-score {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      padding: 0 10px;
      white-space: nowrap;
    }

    .momentum-score.positive {
      margin-left: auto;
      padding-right: 10px;
    }

    .momentum-score.negative {
      margin-right: auto;
      padding-left: 10px;
    }

    /* Signals */
    .signals-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    .signal-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .signal-card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-teal);
      margin-bottom: 4px;
    }

    .signal-card-desc {
      font-size: 11px;
      color: var(--teal-light);
      margin-bottom: 16px;
    }

    .signal-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      transition: background 0.2s;
    }

    .signal-item:hover {
      background: rgba(38, 70, 83, 0.04);
    }

    .signal-ticker {
      font-weight: 700;
      font-size: 13px;
      min-width: 60px;
    }

    .signal-name {
      flex: 1;
      font-size: 12px;
      color: #555;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .signal-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      color: #fff;
    }

    .signal-badge.buy { background: #E74C3C; }
    .signal-badge.sell { background: #27AE60; }
    .signal-badge.up { background: #E74C3C; }
    .signal-badge.down { background: #27AE60; }

    .signal-funds {
      font-size: 10px;
      color: var(--teal-light);
      margin-top: 4px;
    }

    .signal-fund-chip {
      display: inline-block;
      background: var(--bg-sand);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      margin: 2px 3px 2px 0;
      color: var(--primary-teal);
    }

    .signal-delta {
      font-weight: 700;
      font-size: 12px;
      min-width: 60px;
      text-align: right;
    }

    .signal-delta.positive { color: #E74C3C; }
    .signal-delta.negative { color: #27AE60; }

    .signal-count {
      background: var(--accent-gold);
      color: var(--primary-teal);
      font-weight: 700;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      min-width: 24px;
      text-align: center;
    }

    /* Conviction Chart */
    .conviction-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .conviction-bar-label {
      min-width: 55px;
      font-size: 12px;
      font-weight: 600;
      text-align: right;
    }

    .conviction-bar-track {
      flex: 1;
      height: 20px;
      background: rgba(38, 70, 83, 0.06);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .conviction-bar-fill {
      height: 100%;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      transition: width 0.5s;
    }

    .conviction-bar-fill.increase {
      background: linear-gradient(90deg, #E74C3C, #FF6B6B);
    }

    .conviction-bar-fill.decrease {
      background: linear-gradient(90deg, #27AE60, #6BCB77);
    }

    /* Performance */
    .perf-container {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .perf-controls {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .perf-select {
      flex: 1;
      min-width: 240px;
      padding: 12px 16px;
      border: 2px solid rgba(38, 70, 83, 0.15);
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-teal);
      background: #fff;
      cursor: pointer;
      outline: none;
    }

    .perf-chart-wrapper {
      height: 350px;
      margin-bottom: 24px;
    }

    .perf-stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .perf-stat {
      background: var(--bg-sand);
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
      flex: 1;
      min-width: 120px;
    }

    .perf-stat-value {
      font-size: 24px;
      font-weight: 700;
    }

    .perf-stat-value.positive { color: #E74C3C; }
    .perf-stat-value.negative { color: #27AE60; }

    .perf-stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--teal-light);
      margin-top: 4px;
    }

    .perf-note {
      font-size: 11px;
      color: var(--teal-light);
      font-style: italic;
    }

    .perf-holdings-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    .perf-holdings-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .perf-holdings-table td {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.08);
      font-size: 12px;
    }

    .perf-holdings-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    @media (max-width: 900px) {
      .signals-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Mobile */
    @media (max-width: 900px) {
      .header {
        padding: 16px 20px;
      }

      .header-content {
        flex-wrap: wrap;
        gap: 12px;
      }

      .header-right {
        width: 100%;
        justify-content: space-between;
      }

      .search-box {
        flex: 1;
        width: auto;
      }

      .search-box:focus {
        width: auto;
      }

      .main-content {
        padding: 20px;
      }

      .home-layout {
        grid-template-columns: 1fr;
      }

      .list-layout-wrapper {
        grid-template-columns: 1fr;
      }

      .sector-legend {
        position: static;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        padding: 16px;
      }

      .sector-legend-title {
        width: 100%;
        margin-bottom: 8px;
      }

      .sector-legend-item {
        padding: 4px 0;
      }

      .funds-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }

      .fund-card {
        padding: 16px;
      }

      .fund-card-chart {
        width: 100px;
        height: 100px;
      }

      .fund-card-name {
        font-size: 12px;
      }

      .list-container {
        grid-template-columns: 1fr;
      }

      .list-sidebar {
        position: static;
        max-height: none;
      }

      .detail-view {
        padding: 24px;
      }

      .fund-title {
        font-size: 18px;
        letter-spacing: 2px;
      }
    }

      'VTV': 'ETF', 'VB': 'ETF', 'VT': 'ETF', 'IEMG': 'ETF', 'IJR': 'ETF',
      'IBIT': 'ETF', 'ETH': 'ETF', 'XLK': 'ETF', 'IAU': 'ETF', 'GLD': 'ETF',
      'GDX': 'ETF', 'GDXJ': 'ETF', 'EWZ': 'ETF', 'QLTY': 'ETF',
      'LAUR': 'Consumer', 'LOPE': 'Consumer', 'MAA': 'Financial', 'NIQ': 'Technology',
      'AMRZ': 'Financial', 'SE': 'Technology', 'BZ': 'Technology', 'YMM': 'Technology',
      'IRS': 'Financial', 'RAL': 'Other', 'ADES': 'Consumer'
    };

    function getSector(ticker) {
      return SECTOR_MAP[ticker] || 'Other';
    }

    function getHoldingSector(holding) {
      if (!holding) return 'Other';
      return holding.sector || getSector(holding.ticker);
    }

    function getHoldingSectorColor(holding) {
      return SECTOR_COLORS[getHoldingSector(holding)];
    }

    function getHoldingSectorName(holding, lang) {
      const sector = getHoldingSector(holding);
      return lang === 'ja' ? (SECTOR_NAMES_JP[sector] || sector) : sector;
    }

    function getSectorColor(ticker) {
      return SECTOR_COLORS[getSector(ticker)];
    }

    function getSectorName(ticker, lang) {
      const sector = getSector(ticker);
      return lang === 'ja' ? (SECTOR_NAMES_JP[sector] || sector) : sector;
    }

    // Language context
    const LangContext = React.createContext('en');

    function SectorLegend({ activeSector, onSectorClick }) {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];
      const sectors = Object.keys(SECTOR_COLORS);
      return (
        <div className="sector-legend">
          <div className="sector-legend-title">{t.sectorLegend}</div>
          {sectors.map(s => {
            const isActive = activeSector === s;
            const isDimmed = activeSector && !isActive;
            return (
              <div key={s}
                className={`sector-legend-item ${isActive ? 'active' : ''} ${isDimmed ? 'dimmed' : ''}`}
                onClick={() => onSectorClick ? onSectorClick(isActive ? null : s) : null}>
                <div className="sector-legend-dot" style={{ background: SECTOR_COLORS[s] }}></div>
                <span className="sector-legend-label">{t[s] || s}</span>
              </div>
            );
          })}
        </div>
      );
    }

    function App() {
      const [tab, setTab] = React.useState('home');
      const [selected, setSelected] = React.useState(null);
      const [search, setSearch] = React.useState('');
      const [lang, setLang] = React.useState('en');
      const [funds, setFunds] = React.useState([]);
      const [prevFunds, setPrevFunds] = React.useState([]);
      const [dataAsOf, setDataAsOf] = React.useState(FALLBACK_AS_OF);
      const t = I18N[lang];

      React.useEffect(() => {
        let cancelled = false;
        const load = async () => {
          try {
            const [metaRes, dataRes, prevRes] = await Promise.all([
              fetch(META_URL, { cache: 'no-store' }),
              fetch(DATA_URL, { cache: 'no-store' }),
              fetch(PREV_DATA_URL, { cache: 'no-store' }).catch(() => null)
            ]);
            if (dataRes.ok) {
              const data = await dataRes.json();
              if (!cancelled) setFunds(Array.isArray(data) ? data : []);
              if (prevRes?.ok) {
                const prev = await prevRes.json();
                if (!cancelled) setPrevFunds(Array.isArray(prev) ? prev : []);
              }
              if (metaRes.ok) {
                const meta = await metaRes.json();
                if (!cancelled && meta?.generatedAt) setDataAsOf(meta.generatedAt.slice(0, 10));
                else if (!cancelled && meta?.asOf) setDataAsOf(meta.asOf);
              }
              return;
            }
          } catch (e) {
            // fall through to fallback
          }

          try {
            const fallbackRes = await fetch(FALLBACK_URL, { cache: 'no-store' });
            if (fallbackRes.ok) {
              const data = await fallbackRes.json();
              if (!cancelled) setFunds(Array.isArray(data) ? data : []);
            }
          } catch (e) {
            if (!cancelled) setFunds([]);
          }

          if (!cancelled) setDataAsOf(FALLBACK_AS_OF);
        };

        load();
        return () => { cancelled = true; };
      }, []);

      const filtered = funds.filter(f => {
        const nameMatch = String(f.name || '').toLowerCase().includes(search.toLowerCase());
        const tickerMatch = (f.holdings || []).some(h =>
          String(h.ticker || '').toLowerCase().includes(search.toLowerCase())
        );
        return nameMatch || tickerMatch;
      });

      const handleSelectFund = (fund) => {
        setSelected(fund);
        if (tab === 'home') setTab('detail');
      };

      const handleBack = () => {
        setSelected(null);
        setTab('home');
      };

      return (
        <LangContext.Provider value={lang}>
          <div>
            <header className="header">
              <div className="header-content">
                <div className="logo">Portfolio Visualizer</div>
                <div className="tabs">
                  <button className={`tab ${tab === 'home' || tab === 'detail' ? 'active' : ''}`} onClick={() => { setTab('home'); setSelected(null); }}>{t.home}</button>
                  <button className={`tab ${tab === 'list' ? 'active' : ''}`} onClick={() => setTab('list')}>{t.list}</button>
                  <button className={`tab ${tab === 'ranking' ? 'active' : ''}`} onClick={() => setTab('ranking')}>{t.ranking}</button>
                  <button className={`tab ${tab === 'overlap' ? 'active' : ''}`} onClick={() => setTab('overlap')}>{t.overlap}</button>
                  <button className={`tab ${tab === 'flow' ? 'active' : ''}`} onClick={() => setTab('flow')}>{t.flow}</button>
                  <button className={`tab ${tab === 'signals' ? 'active' : ''}`} onClick={() => setTab('signals')}>{t.signals}</button>
                  <button className={`tab ${tab === 'performance' ? 'active' : ''}`} onClick={() => setTab('performance')}>{t.performance}</button>
                </div>
                <div className="header-right">
                  <input type="text" className="search-box" placeholder={t.searchPlaceholder} value={search} onChange={e => setSearch(e.target.value)} />
                  <div className="data-timestamp">{t.dataAsOf}: {dataAsOf}</div>
                  <div className="lang-toggle">
                    <button className={`lang-btn ${lang === 'en' ? 'active' : ''}`} onClick={() => setLang('en')}>EN</button>
                    <button className={`lang-btn ${lang === 'ja' ? 'active' : ''}`} onClick={() => setLang('ja')}>JP</button>
                  </div>
                </div>
              </div>
            </header>
            <main className="main-content">
              {tab === 'home' && <HomeView funds={filtered} onSelect={handleSelectFund} />}
              {tab === 'detail' && selected && <DetailView fund={selected} onBack={handleBack} />}
              {tab === 'list' && <ListView funds={filtered} selected={selected} onSelect={setSelected} />}
              {tab === 'ranking' && <RankingView funds={funds} />}
              {tab === 'overlap' && <OverlapView funds={funds} />}
              {tab === 'flow' && <FlowView funds={funds} prevFunds={prevFunds} />}
              {tab === 'signals' && <SignalsView funds={funds} prevFunds={prevFunds} />}
              {tab === 'performance' && <PerformanceView funds={funds} />}
            </main>
          </div>
        </LangContext.Provider>
      );
    }

    function HomeView({ funds, onSelect }) {
      const [activeSector, setActiveSector] = React.useState(null);

      const sortedFunds = React.useMemo(() => {
        if (!activeSector) return funds;
        return [...funds].sort((a, b) => {
          const aWeight = a.holdings.reduce((sum, h) => getHoldingSector(h) === activeSector ? sum + h.percent : sum, 0);
          const bWeight = b.holdings.reduce((sum, h) => getHoldingSector(h) === activeSector ? sum + h.percent : sum, 0);
          return bWeight - aWeight;
        });
      }, [funds, activeSector]);

      return (
        <div className="home-layout">
          <div className="funds-grid">
            {sortedFunds.map((fund, i) => <FundCard key={fund.name} fund={fund} onClick={() => onSelect(fund)} />)}

          <SectorLegend activeSector={activeSector} onSectorClick={setActiveSector} />

    function OverlapView({ funds }) {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];
      const [fundAIndex, setFundAIndex] = React.useState('');
      const [fundBIndex, setFundBIndex] = React.useState('');

      const fundA = fundAIndex !== '' ? funds[parseInt(fundAIndex)] : null;
      const fundB = fundBIndex !== '' ? funds[parseInt(fundBIndex)] : null;

      const analysis = React.useMemo(() => {
        if (!fundA || !fundB) return null;
        const holdingsA = {};
        fundA.holdings.forEach(h => { holdingsA[h.ticker] = h; });
        const holdingsB = {};
        fundB.holdings.forEach(h => { holdingsB[h.ticker] = h; });

        const common = [];
        const onlyA = [];
        const onlyB = [];

        Object.keys(holdingsA).forEach(ticker => {
          if (holdingsB[ticker]) {
            const sector = holdingsA[ticker].sector || holdingsB[ticker].sector || '';
            common.push({ ticker, name: holdingsA[ticker].name, weightA: holdingsA[ticker].percent, weightB: holdingsB[ticker].percent, sector });
          } else {
            onlyA.push(holdingsA[ticker]);
          }
        });
        Object.keys(holdingsB).forEach(ticker => {
          if (!holdingsA[ticker]) onlyB.push(holdingsB[ticker]);
        });

        common.sort((a, b) => (b.weightA + b.weightB) - (a.weightA + a.weightB));
        return { common, onlyA, onlyB };
      }, [fundA, fundB]);

      return (
        <div>
          <div className="ranking-section-title">{t.overlapTitle}</div>
          <div className="overlap-controls">
            <div className="overlap-select-group">
              <label className="overlap-select-label">{t.fundA}</label>
              <select className="overlap-select" value={fundAIndex} onChange={e => setFundAIndex(e.target.value)}>
                <option value="">{t.selectFundPlaceholder}</option>
                {funds.map((f, i) => <option key={i} value={i}>{f.name}</option>)}
              </select>
            </div>
            <div className="overlap-vs">VS</div>
            <div className="overlap-select-group">
              <label className="overlap-select-label">{t.fundB}</label>
              <select className="overlap-select" value={fundBIndex} onChange={e => setFundBIndex(e.target.value)}>
                <option value="">{t.selectFundPlaceholder}</option>
                {funds.map((f, i) => <option key={i} value={i}>{f.name}</option>)}
              </select>
            </div>
          </div>

          {!analysis && (
            <div className="overlap-result">
              <div className="overlap-empty">{t.selectBothFunds}</div>
            </div>
          )}

          {analysis && (
            <div className="overlap-result">
              <div className="overlap-summary">
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.common.length}</div>
                  <div className="overlap-stat-label">{t.commonHoldings}</div>
                </div>
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.onlyA.length}</div>
                  <div className="overlap-stat-label">{t.onlyInA}</div>
                </div>
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.onlyB.length}</div>
                  <div className="overlap-stat-label">{t.onlyInB}</div>
                </div>
              </div>

              {analysis.common.length > 0 ? (
                <div style={{ borderRadius: '12px', overflow: 'hidden' }}>
                  <table className="overlap-table">
                    <thead>
                      <tr>
                        <th>{t.ticker}</th>
                        <th>{t.company}</th>
                        <th>{t.sector}</th>
                        <th>{t.weightInA}</th>
                        <th>{t.weightInB}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {analysis.common.map(item => {
                        const sector = item.sector || getSector(item.ticker);
                        const sectorLabel = lang === 'ja' ? (SECTOR_NAMES_JP[sector] || sector) : sector;
                        return (
                          <tr key={item.ticker}>
                            <td><span className="ticker">{item.ticker}</span></td>
                            <td>{item.name}</td>
                            <td><span className="sector-badge" style={{ background: SECTOR_COLORS[sector] }}>{sectorLabel}</span></td>
                            <td style={{ fontWeight: 600 }}>{item.weightA.toFixed(1)}%</td>
                            <td style={{ fontWeight: 600 }}>{item.weightB.toFixed(1)}%</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              ) : (
                <div className="overlap-empty">{t.noOverlap}</div>
              )}
            </div>
          )}
        </div>
      );
    }

    function RankingView({ funds }) {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];
      const [mode, setMode] = React.useState('weight');
      const [expandedTicker, setExpandedTicker] = React.useState(null);

      const allData = React.useMemo(() => {
        const tickerMap = {};
        funds.forEach(fund => {
          fund.holdings.forEach(h => {
            if (!tickerMap[h.ticker]) {
              tickerMap[h.ticker] = { ticker: h.ticker, name: h.name, totalWeight: 0, fundCount: 0, funds: [], sector: h.sector || '' };
            } else if (!tickerMap[h.ticker].sector && h.sector) {
              tickerMap[h.ticker].sector = h.sector;
            }
            tickerMap[h.ticker].totalWeight += h.percent;
            tickerMap[h.ticker].fundCount += 1;
            tickerMap[h.ticker].funds.push({ name: fund.name, weight: h.percent });
          });
        });
        return Object.values(tickerMap).map(item => ({
          ...item,
          avgWeight: item.totalWeight / item.fundCount
        }));
      }, [funds]);

      const rankingData = React.useMemo(() => {
        const sorted = [...allData];
        if (mode === 'weight') {
          sorted.sort((a, b) => b.totalWeight - a.totalWeight);
        } else {
          sorted.sort((a, b) => b.fundCount - a.fundCount || b.totalWeight - a.totalWeight);
        }
        return sorted.slice(0, 30);
      }, [allData, mode]);

      const maxTotal = rankingData.length > 0 ? Math.max(...rankingData.map(d => d.totalWeight)) : 1;
      const maxAvg = rankingData.length > 0 ? Math.max(...rankingData.map(d => d.avgWeight)) : 1;
      const maxFunds = rankingData.length > 0 ? Math.max(...rankingData.map(d => d.fundCount)) : 1;

      return (
        <div>
          <div className="ranking-section-title">{t.rankingTitle}</div>
          <div className="ranking-tabs">
            <button className={`ranking-tab ${mode === 'weight' ? 'active' : ''}`} onClick={() => { setMode('weight'); setExpandedTicker(null); }}>{t.rankByWeight}</button>
            <button className={`ranking-tab ${mode === 'popularity' ? 'active' : ''}`} onClick={() => { setMode('popularity'); setExpandedTicker(null); }}>{t.rankByPopularity}</button>
          </div>
          <div className="ranking-table-container">
            <table className="ranking-table">
              <thead>
                <tr>
                  <th>{t.rank}</th>
                  <th>{t.ticker}</th>
                  <th>{t.company}</th>
                  <th>{t.sector}</th>
                  <th>{t.avgWeight}</th>
                  <th>{t.totalWeight}</th>
                  <th>{t.funds}</th>
                </tr>
              </thead>
              <tbody>
                {rankingData.map((item, i) => {
                  const sector = item.sector || getSector(item.ticker);
                  const sectorLabel = lang === 'ja' ? (SECTOR_NAMES_JP[sector] || sector) : sector;
                  const totalBarWidth = (item.totalWeight / maxTotal) * 100;
                  const avgBarWidth = (item.avgWeight / maxAvg) * 100;
                  const isExpanded = expandedTicker === item.ticker;
                  return (
                    <React.Fragment key={item.ticker}>
                      <tr className="clickable" onClick={() => setExpandedTicker(isExpanded ? null : item.ticker)}>
                        <td><span className={`ranking-rank ${i < 3 ? 'top3' : ''}`}>{i + 1}</span></td>
                        <td><span className="ticker">{item.ticker}</span></td>
                        <td>{item.name}</td>
                        <td><span className="sector-badge" style={{ background: SECTOR_COLORS[sector] }}>{sectorLabel}</span></td>
                        <td className="weight-cell">
                          <div className="weight-bar" style={{ width: avgBarWidth + '%' }}></div>
                          <span className="weight-value">{item.avgWeight.toFixed(1)}%</span>
                        </td>
                        <td className="weight-cell">
                          <div className="weight-bar accent" style={{ width: totalBarWidth + '%' }}></div>
                          <span className="weight-value">{item.totalWeight.toFixed(1)}%</span>
                        </td>
                        <td><span className="ranking-funds-count">{item.fundCount}</span></td>
                      </tr>
                      {isExpanded && (
                        <tr className="ticker-funds-panel">
                          <td colSpan="7">
                            <div className="ticker-funds-inner">
                              <div className="ticker-funds-label">{t.holdingFunds}</div>
                              {item.funds.sort((a, b) => b.weight - a.weight).map((f, fi) => (
                                <span key={fi} className="ticker-fund-chip">
                                  {f.name}<span className="chip-weight">{f.weight.toFixed(1)}%</span>
                                </span>
                              ))}
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Compute signals from current vs previous fund data
    function computeSignals(funds, prevFunds) {
      const prevLookup = {};
      prevFunds.forEach(fund => {
        prevLookup[fund.name] = {};
        (fund.holdings || []).forEach(h => { prevLookup[fund.name][h.ticker] = h; });
      });

      const signals = {};
      const ensure = (ticker, name, sector) => {
        if (!signals[ticker]) signals[ticker] = { ticker, name: name || ticker, sector: sector || '', newBuys: [], exits: [], increases: [], decreases: [] };
        if (!signals[ticker].name || signals[ticker].name === ticker) signals[ticker].name = name || signals[ticker].name;
        if (!signals[ticker].sector && sector) signals[ticker].sector = sector;
      };

      funds.forEach(fund => {
        const prev = prevLookup[fund.name] || {};
        const currentTickers = new Set((fund.holdings || []).map(h => h.ticker));
        const prevTickers = new Set(Object.keys(prev));

        (fund.holdings || []).forEach(h => {
          ensure(h.ticker, h.name, h.sector);
          if (!prevTickers.has(h.ticker)) {
            signals[h.ticker].newBuys.push({ fund: fund.name, weight: h.percent });
          } else {
            const delta = h.percent - prev[h.ticker].percent;
            if (delta > 0.3) signals[h.ticker].increases.push({ fund: fund.name, delta, current: h.percent, prev: prev[h.ticker].percent });
            else if (delta < -0.3) signals[h.ticker].decreases.push({ fund: fund.name, delta, current: h.percent, prev: prev[h.ticker].percent });
          }
        });

        prevTickers.forEach(ticker => {
          if (!currentTickers.has(ticker)) {
            ensure(ticker, prev[ticker].name, prev[ticker].sector);
            signals[ticker].exits.push({ fund: fund.name, prevWeight: prev[ticker].percent });
          }
        });
      });

      return signals;
    }

    // Build flow data from real signals
    function buildFlowData(funds, prevFunds) {
      const signals = computeSignals(funds, prevFunds);
      const sectorGroups = {};

      // Collect all tickers from current holdings
      funds.forEach(fund => {
        (fund.holdings || []).forEach(h => {
          const sector = getHoldingSector(h);
          if (!sectorGroups[sector]) sectorGroups[sector] = {};
          if (!sectorGroups[sector][h.ticker]) {
            const sig = signals[h.ticker] || { newBuys: [], exits: [], increases: [], decreases: [] };
            sectorGroups[sector][h.ticker] = {
              name: h.ticker,
              fullName: h.name,
              holders: 0,
              buyers: sig.newBuys.length + sig.increases.length,
              sellers: sig.exits.length + sig.decreases.length
            };
          }
          sectorGroups[sector][h.ticker].holders++;
        });
      });

      return Object.entries(sectorGroups)
        .map(([name, tickers]) => ({
          name,
          children: Object.values(tickers).sort((a, b) => b.holders - a.holders).slice(0, 15)
        }))
        .filter(g => g.children.length > 0)
        .sort((a, b) => b.children.reduce((s, c) => s + c.holders, 0) - a.children.reduce((s, c) => s + c.holders, 0));
    }

    function FlowView({ funds, prevFunds }) {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];
      const FLOW_DATA = React.useMemo(() => buildFlowData(funds, prevFunds), [funds, prevFunds]);
      const containerRef = React.useRef(null);
      const [tooltip, setTooltip] = React.useState(null);
      const [dims, setDims] = React.useState({ width: 1000, height: 600 });
      const [viewMode, setViewMode] = React.useState('stocks'); // 'stocks' | 'sectors'

      // Measure container
      React.useEffect(() => {
        const measure = () => {
          if (containerRef.current) {
            const w = containerRef.current.clientWidth;
            setDims({ width: w, height: Math.max(500, Math.min(700, w * 0.55)) });
          }
        };
        measure();
        window.addEventListener('resize', measure);
        return () => window.removeEventListener('resize', measure);
      }, []);

      // Color: Diffusion Index — normalized score = (buyers - sellers) / (buyers + sellers)
      // Japanese style: red = net buy, green = net sell, grey = neutral
      const getColor = (d) => {
        const total = d.buyers + d.sellers;
        if (total === 0) return '#B8B5AD';
        const score = (d.buyers - d.sellers) / total; // -1 to +1
        if (score > 0) {
          const intensity = score; // 0..1
          const r = Math.round(200 + 55 * intensity);
          const g = Math.round(130 - 90 * intensity);
          const b = Math.round(130 - 90 * intensity);
          return `rgb(${r},${g},${b})`;
        } else if (score < 0) {
          const intensity = Math.abs(score); // 0..1
          const r = Math.round(110 - 60 * intensity);
          const g = Math.round(160 + 40 * intensity);
          const b = Math.round(110 - 40 * intensity);
          return `rgb(${r},${g},${b})`;
        }
        return '#B8B5AD';
      };

      // Diffusion label for cell text
      const getDiffusionLabel = (d) => {
        const total = d.buyers + d.sellers;
        if (total === 0) return '—';
        const score = d.buyers - d.sellers;
        return (score > 0 ? '+' : '') + score;
      };

      // Build treemap layout — size = holders count
      const cells = React.useMemo(() => {
        const { width, height } = dims;
        const root = d3.hierarchy({ name: 'root', children: FLOW_DATA })
          .sum(d => d.holders || 0)
          .sort((a, b) => b.value - a.value);

        d3.treemap()
          .size([width, height])
          .paddingTop(22)
          .paddingInner(2)
          .paddingOuter(3)
          .round(true)(root);

        return root;
      }, [dims]);

      const handleMouseMove = (e, d) => {
        setTooltip({
          x: e.clientX + 12,
          y: e.clientY - 10,
          ticker: d.data.name,
          fullName: d.data.fullName,
          holders: d.data.holders,
          buyers: d.data.buyers,
          sellers: d.data.sellers,
        });
      };

      const sectorGroups = cells.children || [];

      // Calculate Sector Momentum data
      const sectorMomentumData = React.useMemo(() => {
        return FLOW_DATA.map(sector => {
          let netBuyers = 0;
          let netSellers = 0;
          sector.children.forEach(stock => {
            if (stock.buyers > stock.sellers) netBuyers++;
            else if (stock.sellers > stock.buyers) netSellers++;
          });
          const score = netBuyers - netSellers;
          return {
            name: sector.name,
            score,
            netBuyers,
            netSellers,
            totalStocks: sector.children.length
          };
        }).sort((a, b) => b.score - a.score);
      }, []);

      const maxAbsScore = Math.max(...sectorMomentumData.map(d => Math.abs(d.score)), 1);

      return (
        <div>
          <div className="ranking-section-title">{t.flowTitle}</div>
          <p style={{ fontSize: '12px', color: '#2A9D8F', marginBottom: '24px', marginTop: '-12px' }}>
            {viewMode === 'stocks' ? t.flowSubtitle : (lang === 'ja' ? 'セクター別の資金流入/流出を表示（買い越し銘柄数 - 売り越し銘柄数）' : 'Sector-level fund flow (net buyers - net sellers)')}
          </p>

          {/* View Toggle */}
          <div className="view-toggle-container">
            <div className="view-toggle">
              <button
                className={`view-toggle-btn ${viewMode === 'stocks' ? 'active' : ''}`}
                onClick={() => setViewMode('stocks')}
              >
                {t.stocksBreakdown}
              </button>
              <button
                className={`view-toggle-btn ${viewMode === 'sectors' ? 'active' : ''}`}
                onClick={() => setViewMode('sectors')}
              >
                {t.sectorMomentum}
              </button>
            </div>
          </div>

          {/* Stocks Breakdown View (TreeMap) */}
          {viewMode === 'stocks' && (
            <div className="flow-container">
              <div className="treemap-wrapper" ref={containerRef}>
                <svg width={dims.width} height={dims.height} style={{ fontFamily: 'Montserrat, sans-serif' }}>
                  {sectorGroups.map(group => (
                    <g key={group.data.name}>
                      <rect
                        x={group.x0} y={group.y0}
                        width={group.x1 - group.x0} height={group.y1 - group.y0}
                        fill="rgba(38, 70, 83, 0.04)"
                        stroke="rgba(38, 70, 83, 0.12)"
                        strokeWidth="1"
                        rx="4"
                      />
                      <text
                        x={group.x0 + 8} y={group.y0 + 15}
                        fontSize="10" fontWeight="700" fill="#264653"
                        textAnchor="start" letterSpacing="1.5"
                        style={{ textTransform: 'uppercase' }}
                      >
                        {lang === 'ja' ? (SECTOR_NAMES_JP[group.data.name] || group.data.name) : group.data.name}
                      </text>
                      {(group.children || []).map(leaf => {
                        const w = leaf.x1 - leaf.x0;
                        const h = leaf.y1 - leaf.y0;
                        const showTicker = w > 32 && h > 20;
                        const showDI = w > 44 && h > 34;
                        return (
                          <g key={leaf.data.name} className="treemap-cell"
                            onMouseMove={e => handleMouseMove(e, leaf)}
                            onMouseLeave={() => setTooltip(null)}
                          >
                            <rect
                              x={leaf.x0} y={leaf.y0}
                              width={w} height={h}
                              fill={getColor(leaf.data)}
                              rx="3"
                            />
                            {showTicker && (
                              <text
                                x={leaf.x0 + w / 2} y={leaf.y0 + h / 2 + (showDI ? -4 : 2)}
                                textAnchor="middle"
                                fontSize={w > 70 ? '12' : '10'}
                                fontWeight="700"
                                fill="#fff"
                              >
                                {leaf.data.name}
                              </text>
                            )}
                            {showDI && (
                              <text
                                x={leaf.x0 + w / 2} y={leaf.y0 + h / 2 + 12}
                                textAnchor="middle"
                                fontSize="9"
                                fontWeight="600"
                                fill="rgba(255,255,255,0.85)"
                              >
                                {getDiffusionLabel(leaf.data)}
                              </text>
                            )}
                          </g>
                        );
                      })}
                    </g>
                  ))}
                </svg>
              </div>

              {/* Legend */}
              <div className="flow-legend">
                <div className="flow-scale">
                  <span className="flow-scale-label">{t.netSell}</span>
                  <div className="flow-scale-bar" style={{
                    background: 'linear-gradient(90deg, rgb(50,200,70), rgb(110,160,110), #B8B5AD, rgb(200,130,130), rgb(255,40,40))'
                  }}></div>
                  <span className="flow-scale-label">{t.netBuy}</span>
                </div>
              </div>
            </div>
          )}

          {/* Sector Momentum View (Bar Chart) */}
          {viewMode === 'sectors' && (
            <div className="sector-momentum-container">
              <div className="momentum-chart">
                {sectorMomentumData.map((sector, idx) => {
                  const barWidth = (Math.abs(sector.score) / maxAbsScore) * 45; // max 45% of half width
                  const isPositive = sector.score > 0;
                  const isNegative = sector.score < 0;
                  const sectorLabel = lang === 'ja' ? (SECTOR_NAMES_JP[sector.name] || sector.name) : sector.name;

                  return (
                    <div key={sector.name} className="momentum-row">
                      <div className="momentum-label">{sectorLabel}</div>
                      <div className="momentum-bar-wrapper">
                        <div className="momentum-bar-center"></div>
                        {sector.score !== 0 && (
                          <div
                            className={`momentum-bar ${isPositive ? 'positive' : 'negative'}`}
                            style={{ width: barWidth + '%' }}
                          >
                            <span className={`momentum-score ${isPositive ? 'positive' : 'negative'}`}>
                              {isPositive ? '+' : ''}{sector.score}
                            </span>
                          </div>
                        )}
                        {sector.score === 0 && (
                          <span style={{
                            position: 'absolute',
                            left: '50%',
                            transform: 'translateX(-50%)',
                            fontSize: '11px',
                            fontWeight: '600',
                            color: 'var(--primary-teal)'
                          }}>0</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Legend for Sector Momentum */}
              <div className="flow-legend" style={{ marginTop: '24px' }}>
                <div className="flow-scale">
                  <span className="flow-scale-label">{t.netSell}</span>
                  <div className="flow-scale-bar" style={{
                    background: 'linear-gradient(90deg, #4CAF50, #B8B5AD, #FF6B6B)'
                  }}></div>
                  <span className="flow-scale-label">{t.netBuy}</span>
                </div>
              </div>
            </div>
          )}

          {/* Tooltip (for stocks view) */}
          {viewMode === 'stocks' && tooltip && (
            <div className="treemap-tooltip" style={{ left: tooltip.x, top: tooltip.y }}>
              <div className="tt-ticker">{tooltip.ticker}</div>
              <div className="tt-company">{tooltip.fullName}</div>
              <div className="tt-row">
                <span>{t.heldBy}</span>
                <span style={{ fontWeight: 700 }}>{tooltip.holders} {t.fundsUnit}</span>
              </div>
              <div className="tt-row">
                <span>{t.sentiment}</span>
                <span>
                  <span className="tt-change-pos">{tooltip.buyers} {t.buys}</span>
                  {' / '}
                  <span className="tt-change-neg">{tooltip.sellers} {t.sells}</span>
                </span>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SignalsView({ funds, prevFunds }) {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];

      const analysis = React.useMemo(() => {
        if (!prevFunds.length) return null;
        const signals = computeSignals(funds, prevFunds);
        const all = Object.values(signals);

        // Consensus buys: stocks with 2+ new buyers
        const consensusBuys = all
          .filter(s => s.newBuys.length >= 2)
          .sort((a, b) => b.newBuys.length - a.newBuys.length)
          .slice(0, 15);

        // Consensus exits: stocks with 2+ exits
        const consensusSells = all
          .filter(s => s.exits.length >= 2)
          .sort((a, b) => b.exits.length - a.exits.length)
          .slice(0, 15);

        // Conviction increases: stocks with biggest avg weight increase
        const convictionUp = all
          .filter(s => s.increases.length > 0)
          .map(s => ({
            ...s,
            avgDelta: s.increases.reduce((sum, i) => sum + i.delta, 0) / s.increases.length,
            totalDelta: s.increases.reduce((sum, i) => sum + i.delta, 0)
          }))
          .sort((a, b) => b.totalDelta - a.totalDelta)
          .slice(0, 15);

        // Conviction decreases
        const convictionDown = all
          .filter(s => s.decreases.length > 0)
          .map(s => ({
            ...s,
            avgDelta: s.decreases.reduce((sum, i) => sum + i.delta, 0) / s.decreases.length,
            totalDelta: s.decreases.reduce((sum, i) => sum + i.delta, 0)
          }))
          .sort((a, b) => a.totalDelta - b.totalDelta)
          .slice(0, 15);

        return { consensusBuys, consensusSells, convictionUp, convictionDown };
      }, [funds, prevFunds]);

      if (!analysis) {
        return (
          <div>
            <div className="ranking-section-title">{t.signalsTitle}</div>
            <div className="perf-container"><div className="overlap-empty">{t.noSignals}</div></div>
          </div>
        );
      }

      const maxConvUp = analysis.convictionUp.length > 0 ? Math.max(...analysis.convictionUp.map(s => s.totalDelta)) : 1;
      const maxConvDown = analysis.convictionDown.length > 0 ? Math.max(...analysis.convictionDown.map(s => Math.abs(s.totalDelta))) : 1;

      return (
        <div>
          <div className="ranking-section-title">{t.signalsTitle}</div>
          <div className="signals-grid">
            {/* Consensus Buys */}
            <div className="signal-card">
              <div className="signal-card-title">{t.consensusBuys}</div>
              <div className="signal-card-desc">{t.consensusBuysDesc}</div>
              {analysis.consensusBuys.length === 0 && <div className="overlap-empty" style={{height: 'auto', padding: '20px'}}>{lang === 'ja' ? 'なし' : 'None'}</div>}
              {analysis.consensusBuys.map(s => (
                <div key={s.ticker} className="signal-item">
                  <span className="signal-ticker" style={{color: getHoldingSectorColor(s)}}>{s.ticker}</span>
                  <span className="signal-name">{s.name}</span>
                  <span className="signal-count">{s.newBuys.length}</span>
                  <span className="signal-badge buy">{t.newPosition}</span>
                  <div className="signal-funds">
                    {s.newBuys.map((b, i) => <span key={i} className="signal-fund-chip">{b.fund.split('(')[0].trim()} {b.weight.toFixed(1)}%</span>)}
                  </div>
                </div>
              ))}
            </div>

            {/* Consensus Exits */}
            <div className="signal-card">
              <div className="signal-card-title">{t.consensusSells}</div>
              <div className="signal-card-desc">{t.consensusSellsDesc}</div>
              {analysis.consensusSells.length === 0 && <div className="overlap-empty" style={{height: 'auto', padding: '20px'}}>{lang === 'ja' ? 'なし' : 'None'}</div>}
              {analysis.consensusSells.map(s => (
                <div key={s.ticker} className="signal-item">
                  <span className="signal-ticker" style={{color: getHoldingSectorColor(s)}}>{s.ticker}</span>
                  <span className="signal-name">{s.name}</span>
                  <span className="signal-count">{s.exits.length}</span>
                  <span className="signal-badge sell">{t.exited}</span>
                  <div className="signal-funds">
                    {s.exits.map((b, i) => <span key={i} className="signal-fund-chip">{b.fund.split('(')[0].trim()}</span>)}
                  </div>
                </div>
              ))}
            </div>

            {/* Conviction Up */}
            <div className="signal-card">
              <div className="signal-card-title">{t.convictionUp}</div>
              <div className="signal-card-desc">{t.convictionUpDesc}</div>
              {analysis.convictionUp.map(s => (
                <div key={s.ticker}>
                  <div className="conviction-bar-row">
                    <span className="conviction-bar-label" style={{color: getHoldingSectorColor(s)}}>{s.ticker}</span>
                    <div className="conviction-bar-track">
                      <div className="conviction-bar-fill increase" style={{width: (s.totalDelta / maxConvUp * 100) + '%'}}>
                        +{s.totalDelta.toFixed(1)}%
                      </div>
                    </div>
                    <span className="signal-count">{s.increases.length}</span>
                  </div>
                </div>
              ))}
            </div>

            {/* Conviction Down */}
            <div className="signal-card">
              <div className="signal-card-title">{t.convictionDown}</div>
              <div className="signal-card-desc">{t.convictionDownDesc}</div>
              {analysis.convictionDown.map(s => (
                <div key={s.ticker}>
                  <div className="conviction-bar-row">
                    <span className="conviction-bar-label" style={{color: getHoldingSectorColor(s)}}>{s.ticker}</span>
                    <div className="conviction-bar-track">
                      <div className="conviction-bar-fill decrease" style={{width: (Math.abs(s.totalDelta) / maxConvDown * 100) + '%'}}>
                        {s.totalDelta.toFixed(1)}%
                      </div>
                    </div>
                    <span className="signal-count">{s.decreases.length}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function PerformanceView({ funds }) {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];
      const [selectedFundIdx, setSelectedFundIdx] = React.useState('');
      const [perfData, setPerfData] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      const chartRef = React.useRef(null);
      const chartInstance = React.useRef(null);

      const selectedFund = selectedFundIdx !== '' ? funds[parseInt(selectedFundIdx)] : null;

      // Fetch price data for a ticker using Yahoo Finance
      const fetchPrices = React.useCallback(async (ticker, period) => {
        try {
          const cleanTicker = ticker.replace('.', '-');
          const range = period === '1m' ? '1mo' : period === '3m' ? '3mo' : period === '6m' ? '6mo' : '1y';
          const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${cleanTicker}?range=${range}&interval=1d`);
          if (!res.ok) return null;
          const data = await res.json();
          const result = data?.chart?.result?.[0];
          if (!result?.indicators?.quote?.[0]?.close) return null;
          const closes = result.indicators.quote[0].close.filter(v => v != null);
          if (closes.length < 2) return null;
          return (closes[closes.length - 1] / closes[0] - 1) * 100;
        } catch { return null; }
      }, []);

      const [period, setPeriod] = React.useState('3m');

      React.useEffect(() => {
        if (!selectedFund) { setPerfData(null); return; }
        let cancelled = false;
        setLoading(true);

        const compute = async () => {
          const holdings = selectedFund.holdings.slice(0, 20);
          const tickers = holdings.map(h => h.ticker);
          tickers.push('SPY');

          const returns = {};
          // Fetch in batches of 5
          for (let i = 0; i < tickers.length; i += 5) {
            const batch = tickers.slice(i, i + 5);
            const results = await Promise.all(batch.map(t => fetchPrices(t, period)));
            batch.forEach((ticker, j) => { returns[ticker] = results[j]; });
          }

          if (cancelled) return;

          const holdingReturns = holdings.map(h => ({
            ticker: h.ticker,
            name: h.name,
            weight: h.percent,
            ret: returns[h.ticker],
            contribution: returns[h.ticker] != null ? (h.percent / 100) * returns[h.ticker] : null
          }));

          const totalWeight = holdingReturns.filter(h => h.ret != null).reduce((s, h) => s + h.weight, 0);
          const portfolioReturn = totalWeight > 0 ? holdingReturns.filter(h => h.ret != null).reduce((s, h) => s + (h.weight / totalWeight) * h.ret, 0) : null;
          const spyReturn = returns['SPY'];

          setPerfData({
            holdings: holdingReturns.sort((a, b) => (b.contribution || 0) - (a.contribution || 0)),
            portfolioReturn,
            spyReturn
          });
          setLoading(false);
        };

        compute();
        return () => { cancelled = true; };
      }, [selectedFund, period, fetchPrices]);

      // Chart
      React.useEffect(() => {
        if (chartInstance.current) chartInstance.current.destroy();
        if (!perfData || perfData.portfolioReturn == null) return;

        const ctx = chartRef.current?.getContext('2d');
        if (!ctx) return;

        const positiveHoldings = perfData.holdings.filter(h => h.contribution != null && h.contribution > 0);
        const negativeHoldings = perfData.holdings.filter(h => h.contribution != null && h.contribution < 0);
        const combined = [...positiveHoldings.slice(0, 10), ...negativeHoldings.slice(-5)].sort((a, b) => (b.contribution || 0) - (a.contribution || 0));

        chartInstance.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: combined.map(h => h.ticker),
            datasets: [{
              label: lang === 'ja' ? '寄与度 (%)' : 'Contribution (%)',
              data: combined.map(h => h.contribution?.toFixed(2) || 0),
              backgroundColor: combined.map(h => (h.contribution || 0) >= 0 ? 'rgba(231, 76, 60, 0.7)' : 'rgba(39, 174, 96, 0.7)'),
              borderRadius: 4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { titleFont: { family: 'Montserrat' }, bodyFont: { family: 'Montserrat' } }
            },
            scales: {
              y: { title: { display: true, text: lang === 'ja' ? '寄与度 (%)' : 'Contribution (%)' }, grid: { color: 'rgba(38,70,83,0.08)' } },
              x: { grid: { display: false } }
            }
          }
        });
        return () => chartInstance.current?.destroy();
      }, [perfData, lang]);

      return (
        <div>
          <div className="ranking-section-title">{t.perfTitle}</div>
          <p style={{ fontSize: '12px', color: '#2A9D8F', marginBottom: '24px', marginTop: '-12px' }}>{t.perfDesc}</p>

          <div className="perf-container">
            <div className="perf-controls">
              <select className="perf-select" value={selectedFundIdx} onChange={e => setSelectedFundIdx(e.target.value)}>
                <option value="">{t.selectFundPlaceholder}</option>
                {funds.map((f, i) => <option key={i} value={i}>{f.name}</option>)}
              </select>
              <div className="ranking-tabs">
                {[['1m','m1'],['3m','m3'],['6m','m6'],['1y','y1']].map(([p, k]) => (
                  <button key={p} className={`ranking-tab ${period === p ? 'active' : ''}`} onClick={() => setPeriod(p)}>
                    {t[k] || p}
                  </button>
                ))}
              </div>
            </div>

            {!selectedFund && <div className="overlap-empty">{t.selectFundPerf}</div>}

            {loading && selectedFund && (
              <div className="overlap-empty" style={{height: 'auto', padding: '40px'}}>
                {lang === 'ja' ? '価格データを取得中...' : 'Fetching price data...'}
              </div>
            )}

            {perfData && !loading && (
              <div>
                <div className="perf-stats">
                  <div className="perf-stat">
                    <div className={`perf-stat-value ${(perfData.portfolioReturn || 0) >= 0 ? 'positive' : 'negative'}`}>
                      {perfData.portfolioReturn != null ? ((perfData.portfolioReturn >= 0 ? '+' : '') + perfData.portfolioReturn.toFixed(2) + '%') : 'N/A'}
                    </div>
                    <div className="perf-stat-label">{t.fundReturn}</div>
                  </div>
                  <div className="perf-stat">
                    <div className={`perf-stat-value ${(perfData.spyReturn || 0) >= 0 ? 'positive' : 'negative'}`}>
                      {perfData.spyReturn != null ? ((perfData.spyReturn >= 0 ? '+' : '') + perfData.spyReturn.toFixed(2) + '%') : 'N/A'}
                    </div>
                    <div className="perf-stat-label">{t.benchmark}</div>
                  </div>
                  {perfData.portfolioReturn != null && perfData.spyReturn != null && (
                    <div className="perf-stat">
                      <div className={`perf-stat-value ${(perfData.portfolioReturn - perfData.spyReturn) >= 0 ? 'positive' : 'negative'}`}>
                        {((perfData.portfolioReturn - perfData.spyReturn) >= 0 ? '+' : '') + (perfData.portfolioReturn - perfData.spyReturn).toFixed(2) + '%'}
                      </div>
                      <div className="perf-stat-label">Alpha</div>
                    </div>
                  )}
                </div>

                <div className="perf-chart-wrapper"><canvas ref={chartRef}></canvas></div>

                <div style={{borderRadius: '12px', overflow: 'hidden'}}>
                  <table className="perf-holdings-table">
                    <thead>
                      <tr>
                        <th>{t.ticker}</th>
                        <th>{t.company}</th>
                        <th>{t.weight}</th>
                        <th>{lang === 'ja' ? 'リターン' : 'Return'}</th>
                        <th>{lang === 'ja' ? '寄与度' : 'Contribution'}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {perfData.holdings.map(h => (
                        <tr key={h.ticker}>
                          <td><span className="ticker">{h.ticker}</span></td>
                          <td>{h.name}</td>
                          <td style={{fontWeight: 600}}>{h.weight.toFixed(1)}%</td>
                          <td style={{fontWeight: 600, color: h.ret == null ? '#999' : h.ret >= 0 ? '#E74C3C' : '#27AE60'}}>
                            {h.ret != null ? ((h.ret >= 0 ? '+' : '') + h.ret.toFixed(2) + '%') : 'N/A'}
                          </td>
                          <td style={{fontWeight: 600, color: h.contribution == null ? '#999' : h.contribution >= 0 ? '#E74C3C' : '#27AE60'}}>
                            {h.contribution != null ? ((h.contribution >= 0 ? '+' : '') + h.contribution.toFixed(2) + '%') : 'N/A'}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <p className="perf-note" style={{marginTop: '16px'}}>{t.perfNote}</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
