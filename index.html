    function App() {
      const [tab, setTab] = React.useState('home');
      const [selected, setSelected] = React.useState(null);
      const [search, setSearch] = React.useState('');
      const [searchMode, setSearchMode] = React.useState('smart');
      const [language, setLanguage] = React.useState(getInitialLanguage);
      const [funds, setFunds] = React.useState([]);
      const [previousFunds, setPreviousFunds] = React.useState([]);
      const [dataAsOf, setDataAsOf] = React.useState(FALLBACK_AS_OF);
      const [dataGeneratedAt, setDataGeneratedAt] = React.useState('');
      const [reloadSeq, setReloadSeq] = React.useState(0);
      const [refreshState, setRefreshState] = React.useState('idle');
      const [refreshLabel, setRefreshLabel] = React.useState('');
      const [layout, setLayout] = React.useState(
        getLayoutMode(typeof window !== 'undefined' ? window.innerWidth : BREAKPOINTS.desktop)
      );
      const [watchlist, setWatchlist] = React.useState(getInitialWatchlist);
      const [readAlertIds, setReadAlertIds] = React.useState(getInitialReadAlerts);
      const [alertsOpen, setAlertsOpen] = React.useState(false);
      const refreshPollRef = React.useRef(null);
      const t = React.useCallback((key, params) => translate(language, key, params), [language]);

      React.useEffect(() => {
        let cancelled = false;
        const load = async () => {
          const cacheBust = `ts=${Date.now()}`;
          try {
            const [metaRes, dataRes, prevRes, manualRes, tickerMapRes] = await Promise.all([
              fetch(`${META_URL}?${cacheBust}`, { cache: 'no-store' }),
              fetch(`${DATA_URL}?${cacheBust}`, { cache: 'no-store' }),
              fetch(`${PREVIOUS_DATA_URL}?${cacheBust}`, { cache: 'no-store' }),
              fetch(`${FALLBACK_URL}?${cacheBust}`, { cache: 'no-store' }),
              fetch(`${TICKER_MAP_URL}?${cacheBust}`, { cache: 'no-store' })
            ]);
            const manualData = manualRes.ok ? await manualRes.json() : [];
            if (tickerMapRes.ok) {
              const rawMap = await tickerMapRes.json();
              TICKER_MAP = normalizeTickerMap(rawMap);
            } else {
              TICKER_MAP = {};
            }
            if (dataRes.ok) {
              const data = await dataRes.json();
              const merged = mergeManualHoldings(data, manualData);
              if (!cancelled) setFunds(normalizeFunds(merged));
              if (prevRes.ok) {
                const prevData = await prevRes.json();
                if (!cancelled) setPreviousFunds(normalizeFunds(prevData));
              } else if (!cancelled) {
                setPreviousFunds([]);
              }
              if (metaRes.ok) {
                const meta = await metaRes.json();
                if (!cancelled && meta?.asOf) setDataAsOf(meta.asOf);
                if (!cancelled) setDataGeneratedAt(String(meta?.generatedAt || ''));
              }
              return;
            }
          } catch (e) {
            // fall through to fallback
          }

          try {
            const fallbackRes = await fetch(FALLBACK_URL, { cache: 'no-store' });
            if (fallbackRes.ok) {
              const data = await fallbackRes.json();
              if (!cancelled) setFunds(normalizeFunds(data));
              if (!cancelled) setPreviousFunds([]);
              if (!cancelled) setDataGeneratedAt('');
            }
          } catch (e) {
            if (!cancelled) {
              setFunds([]);
              setPreviousFunds([]);
              setDataGeneratedAt('');
            }
          }

          if (!cancelled) {
            setDataAsOf(FALLBACK_AS_OF);
            setDataGeneratedAt('');
          }
        };

        load();
        return () => { cancelled = true; };
      }, [reloadSeq]);

      React.useEffect(() => {
        if (typeof window === 'undefined') return;
        window.localStorage.setItem('pv_lang', language);
        document.documentElement.lang = language;
      }, [language]);

      React.useEffect(() => {
        if (typeof window === 'undefined') return;
        window.localStorage.setItem(WATCHLIST_STORAGE_KEY, JSON.stringify(watchlist));
      }, [watchlist]);

      React.useEffect(() => {
        if (typeof window === 'undefined') return;
        window.localStorage.setItem(ALERT_READ_STORAGE_KEY, JSON.stringify(readAlertIds));
      }, [readAlertIds]);

      React.useEffect(() => {
        const handleResize = () => setLayout(getLayoutMode(window.innerWidth));
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      React.useEffect(() => {
        return () => {
          if (refreshPollRef.current) {
            window.clearInterval(refreshPollRef.current);
            refreshPollRef.current = null;
          }
        };
      }, []);

      const watchedTickerSet = React.useMemo(
        () => new Set((watchlist.tickers || []).map(normalizeTicker)),
        [watchlist]
      );
      const watchedFundSet = React.useMemo(
        () => new Set((watchlist.funds || []).map(v => String(v || '').trim())),
        [watchlist]
      );

      const tickerSummary = React.useMemo(() => {
        const map = {};
        (funds || []).forEach((fund) => {
          (fund.holdings || []).forEach((holding) => {
            const ticker = normalizeTicker(holding?.ticker);
            if (!ticker) return;
            if (!map[ticker]) {
              map[ticker] = {
                ticker,
                name: holding?.name || ticker,
                sector: getHoldingSector(holding),
                fundCount: 0,
                totalWeight: 0,
                funds: []
              };
            }
            map[ticker].fundCount += 1;
            map[ticker].totalWeight += Number(holding?.percent || 0);
            map[ticker].funds.push({
              name: fund.name,
              weight: Number(holding?.percent || 0)
            });
          });
        });
        return Object.values(map)
          .map((row) => ({
            ...row,
            totalWeight: Number(row.totalWeight.toFixed(1)),
            funds: row.funds.sort((a, b) => b.weight - a.weight)
          }))
          .sort((a, b) => b.fundCount - a.fundCount || b.totalWeight - a.totalWeight);
      }, [funds]);

      const tickerDeltaRows = React.useMemo(
        () => buildTickerDeltaMap(funds, previousFunds),
        [funds, previousFunds]
      );

      const tickerDeltaMap = React.useMemo(() => {
        const map = new Map();
        tickerDeltaRows.forEach((row) => map.set(normalizeTicker(row.ticker), row));
        return map;
      }, [tickerDeltaRows]);

      const currentFundMap = React.useMemo(() => {
        const map = new Map();
        (funds || []).forEach((fund) => map.set(String(fund.name || '').trim(), fund));
        return map;
      }, [funds]);

      const previousFundMap = React.useMemo(() => {
        const map = new Map();
        (previousFunds || []).forEach((fund) => map.set(String(fund.name || '').trim(), fund));
        return map;
      }, [previousFunds]);

      const alerts = React.useMemo(() => {
        const items = [];
        watchedTickerSet.forEach((ticker) => {
          const delta = tickerDeltaMap.get(ticker);
          if (!delta || delta.score === 0) return;
          items.push({
            id: `ticker:${ticker}:${delta.score}`,
            type: 'ticker',
            ticker,
            message: `${t('alerts.tickerFlow')}: ${ticker} (${delta.score > 0 ? '+' : ''}${delta.score})`
          });
        });

        watchedFundSet.forEach((fundName) => {
          const currentFund = currentFundMap.get(fundName);
          const prevFund = previousFundMap.get(fundName);
          const currentCount = (currentFund?.holdings || []).length;
          const prevCount = (prevFund?.holdings || []).length;
          const currentTop = currentFund?.holdings?.[0]?.ticker || '';
          const prevTop = prevFund?.holdings?.[0]?.ticker || '';

          if (!currentFund && !prevFund) return;
          if (currentCount === prevCount && currentTop === prevTop) return;
          items.push({
            id: `fund:${fundName}:${currentCount}:${prevCount}:${currentTop}:${prevTop}`,
            type: 'fund',
            fundName,
            message: `${t('alerts.fundChanged')}: ${fundName} (${prevCount}→${currentCount})`
          });
        });

        return items;
      }, [watchedTickerSet, watchedFundSet, tickerDeltaMap, currentFundMap, previousFundMap, t]);

      const unreadAlertCount = React.useMemo(
        () => alerts.filter((alert) => !readAlertIds.includes(alert.id)).length,
        [alerts, readAlertIds]
      );

      const toggleWatchTicker = React.useCallback((ticker) => {
        const normalized = normalizeTicker(ticker);
        if (!normalized) return;
        setWatchlist((prev) => {
          const set = new Set((prev.tickers || []).map(normalizeTicker));
          if (set.has(normalized)) set.delete(normalized);
          else set.add(normalized);
          return { ...prev, tickers: Array.from(set) };
        });
      }, []);

      const toggleWatchFund = React.useCallback((fundName) => {
        const normalized = String(fundName || '').trim();
        if (!normalized) return;
        setWatchlist((prev) => {
          const set = new Set((prev.funds || []).map(v => String(v || '').trim()));
          if (set.has(normalized)) set.delete(normalized);
          else set.add(normalized);
          return { ...prev, funds: Array.from(set) };
        });
      }, []);

      const markAllAlertsRead = React.useCallback(() => {
        setReadAlertIds(alerts.map((a) => a.id));
      }, [alerts]);

      const generatedAtText = React.useMemo(
        () => formatGeneratedAt(dataGeneratedAt, language),
        [dataGeneratedAt, language]
      );

      const triggerDataRefresh = React.useCallback(async () => {
        if (refreshState === 'requesting' || refreshState === 'queued') return;
        if (refreshPollRef.current) {
          window.clearInterval(refreshPollRef.current);
          refreshPollRef.current = null;
        }

        setRefreshState('requesting');
        setRefreshLabel(t('refresh.requesting'));
        const baselineGeneratedAt = dataGeneratedAt;

        try {
          const headers = { 'Content-Type': 'application/json' };
          if (typeof window !== 'undefined') {
            const refreshKey = window.localStorage.getItem('pv_refresh_key');
            if (refreshKey) headers['x-refresh-key'] = refreshKey;
          }

          const res = await fetch('/api/refresh-13f', {
            method: 'POST',
            headers
          });
          const payload = await res.json().catch(() => ({}));
          if (!res.ok || !payload?.ok) {
            throw new Error(payload?.error || payload?.details || `dispatch failed (${res.status})`);
          }

          setRefreshState('queued');
          setRefreshLabel(t('refresh.queued'));

          let checks = 0;
          refreshPollRef.current = window.setInterval(async () => {
            checks += 1;
            try {
              const metaRes = await fetch(`${META_URL}?ts=${Date.now()}`, { cache: 'no-store' });
              if (metaRes.ok) {
                const meta = await metaRes.json();
                const nextGeneratedAt = String(meta?.generatedAt || '');
                const changed = nextGeneratedAt && nextGeneratedAt !== baselineGeneratedAt;
                if (changed) {
                  window.clearInterval(refreshPollRef.current);
                  refreshPollRef.current = null;
                  setDataAsOf(meta?.asOf || FALLBACK_AS_OF);
                  setDataGeneratedAt(nextGeneratedAt);
                  setRefreshState('done');
                  setRefreshLabel(t('refresh.done'));
                  setReloadSeq((prev) => prev + 1);
                  window.setTimeout(() => {
                    setRefreshState('idle');
                    setRefreshLabel('');
                  }, 6000);
                  return;
                }
              }
            } catch (err) {
              // keep polling
            }

            if (checks % 3 === 0) {
              setRefreshLabel(t('refresh.waiting'));
            }

            if (checks >= 54) {
              window.clearInterval(refreshPollRef.current);
              refreshPollRef.current = null;
              setRefreshState('error');
              setRefreshLabel(t('refresh.timeout'));
            }
          }, 10000);
        } catch (err) {
          setRefreshState('error');
          setRefreshLabel(formatRefreshErrorMessage(err?.message || err, t));
          window.setTimeout(() => {
            setRefreshState('idle');
            setRefreshLabel('');
          }, 6000);
        }
      }, [dataGeneratedAt, refreshState, t]);

      const filtered = funds.filter(f => {
        const query = normalizeSearchText(search);
        if (!query) return true;
        const nameMatch = matchesFundName(f.name, query, searchMode);
        const tickerMatch = (f.holdings || []).some(h => matchesTicker(h.ticker, query, searchMode));
        return nameMatch || tickerMatch;
      });

      const searchPlaceholder = React.useMemo(() => {
        if (searchMode === 'ticker') return t('search.placeholderTicker');
        if (searchMode === 'fund') return t('search.placeholderFund');
        return t('search.placeholder');
      }, [searchMode, t]);

      const handleSelectFund = (fund) => {
        setSelected(fund);
        if (tab === 'home') setTab('detail');
      };

      const handleOpenFundDetail = (fund) => {
        setSelected(fund);
        setTab('detail');
      };

      const handleBack = () => {
        setSelected(null);
        setTab('home');
      };

      return (
        <I18nContext.Provider value={{ language, setLanguage, t }}>
          <div className={`app-shell mode-${layout}`}>
            <header className="header">
              <div className="header-content">
                <div className="logo">{t('app.title')}</div>
                <div className="tabs-area">
                  <div className="tabs">
                    <button className={`tab ${tab === 'home' || tab === 'detail' ? 'active' : ''}`} onClick={() => { setTab('home'); setSelected(null); }}>{t('nav.home')}</button>
                    <button className={`tab ${tab === 'list' ? 'active' : ''}`} onClick={() => setTab('list')}>{t('nav.list')}</button>
                    <button className={`tab ${tab === 'ranking' ? 'active' : ''}`} onClick={() => setTab('ranking')}>{t('nav.ranking')}</button>
                    <button className={`tab ${tab === 'overlap' ? 'active' : ''}`} onClick={() => setTab('overlap')}>{t('nav.overlap')}</button>
                    <button className={`tab ${tab === 'flow' ? 'active' : ''}`} onClick={() => setTab('flow')}>{t('nav.flow')}</button>
                    <button className={`tab ${tab === 'watch' ? 'active' : ''}`} onClick={() => setTab('watch')}>{t('nav.watch')}</button>
                    <button className={`tab ${tab === 'settings' ? 'active' : ''}`} onClick={() => setTab('settings')}>⚙</button>
                  </div>
                  <button
                    className="tab-refresh-btn"
                    onClick={triggerDataRefresh}
                    disabled={refreshState === 'requesting' || refreshState === 'queued'}
                    title={t('refresh.button')}
                    aria-label={t('refresh.button')}
                  >
                    <span className={`refresh-icon ${(refreshState === 'requesting' || refreshState === 'queued') ? 'spinning' : ''}`}>↻</span>
                  </button>
                </div>
                <div className="header-right">
                  <select className="search-mode-select" value={searchMode} onChange={(e) => setSearchMode(e.target.value)}>
                    <option value="smart">{t('search.modeSmart')}</option>
                    <option value="fund">{t('search.modeFund')}</option>
                    <option value="ticker">{t('search.modeTicker')}</option>
                  </select>
                  <input type="text" className="search-box" placeholder={searchPlaceholder} value={search} onChange={e => setSearch(e.target.value)} />
                  <div className="data-timestamp">
                    {t('common.dataAsOf')}: {dataAsOf}
                    {generatedAtText ? ` · ${t('refresh.generatedAt')}: ${generatedAtText}` : ''}
                  </div>
                  {refreshLabel && (
                    <div className={`refresh-status ${refreshState === 'error' ? 'error' : ''}`}>
                      {refreshLabel}
                    </div>
                  )}
                  <button className="alert-btn" onClick={() => setAlertsOpen((v) => !v)}>
                    🔔
                    {unreadAlertCount > 0 && <span className="alert-badge">{unreadAlertCount}</span>}
                  </button>
                  {alertsOpen && (
                    <div className="alerts-panel">
                      <div className="alerts-header">
                        <div className="alerts-title">{t('alerts.title')}</div>
                        <button className="alerts-clear" onClick={markAllAlertsRead}>{t('alerts.markAllRead')}</button>
                      </div>
                      {alerts.length === 0 && <div className="alert-item">{t('alerts.noAlerts')}</div>}
                      {alerts.map((alert) => (
                        <div key={alert.id} className={`alert-item ${readAlertIds.includes(alert.id) ? '' : 'unread'}`}>
                          {alert.message}
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="lang-toggle">
                    <button className={`lang-btn ${language === 'en' ? 'active' : ''}`} onClick={() => setLanguage('en')}>EN</button>
                    <button className={`lang-btn ${language === 'ja' ? 'active' : ''}`} onClick={() => setLanguage('ja')}>JP</button>
                  </div>
                </div>
              </div>
            </header>
            <main className="main-content">
              {tab === 'home' && (
                <HomeView
                  funds={filtered}
                  onSelect={handleSelectFund}
                  watchedFundSet={watchedFundSet}
                  onToggleFundWatch={toggleWatchFund}
                />
              )}
              {tab === 'detail' && selected && (
                <DetailView
                  fund={selected}
                  searchTerm={search}
                  searchMode={searchMode}
                  onBack={handleBack}
                  watchedTickerSet={watchedTickerSet}
                  watchedFundSet={watchedFundSet}
                  onToggleTickerWatch={toggleWatchTicker}
                  onToggleFundWatch={toggleWatchFund}
                />
              )}
              {tab === 'list' && (
                <ListView
                  funds={filtered}
                  selected={selected}
                  onSelect={setSelected}
                  searchTerm={search}
                  searchMode={searchMode}
                  watchedTickerSet={watchedTickerSet}
                  watchedFundSet={watchedFundSet}
                  onToggleTickerWatch={toggleWatchTicker}
                  onToggleFundWatch={toggleWatchFund}
                />
              )}
              {tab === 'ranking' && (
                <RankingView
                  funds={funds}
                  watchedTickerSet={watchedTickerSet}
                  onToggleTickerWatch={toggleWatchTicker}
                  onOpenFund={handleOpenFundDetail}
                />
              )}
              {tab === 'overlap' && <OverlapView funds={funds} />}
              {tab === 'flow' && <FlowView currentFunds={funds} previousFunds={previousFunds} dataAsOf={dataAsOf} />}
              {tab === 'watch' && (
                <WatchView
                  currentFunds={funds}
                  previousFunds={previousFunds}
                  watchlist={watchlist}
                  tickerSummary={tickerSummary}
                  tickerDeltaRows={tickerDeltaRows}
                  watchedTickerSet={watchedTickerSet}
                  watchedFundSet={watchedFundSet}
                  onToggleTickerWatch={toggleWatchTicker}
                  onToggleFundWatch={toggleWatchFund}
                  onOpenFund={handleOpenFundDetail}
                />
              )}
              {tab === 'settings' && (
                <SettingsDataSources onBack={() => setTab('home')} />
              )}
            </main>
          </div>
        </I18nContext.Provider>
      );
    }

    function HomeView({ funds, onSelect, watchedFundSet, onToggleFundWatch }) {
      const { t } = useI18n();
      const [activeSector, setActiveSector] = React.useState(null);
      const { sortedFunds: perfSorted, sortKey, setSortKey, perfCache, fundTopTickers } = useFundPerformanceSort(funds);

      const sortedFunds = React.useMemo(() => {
        const base = perfSorted || funds;
        if (!activeSector) return base;
        return [...base].sort((a, b) => {
          const aWeight = a.holdings.reduce((sum, h) => getHoldingSector(h) === activeSector ? sum + h.percent : sum, 0);
          const bWeight = b.holdings.reduce((sum, h) => getHoldingSector(h) === activeSector ? sum + h.percent : sum, 0);
          return bWeight - aWeight;
        });
      }, [funds, perfSorted, sortKey, activeSector]);

      if (!funds || funds.length === 0) {
        return (
          <div className="empty-state">
            <div className="empty-icon">🔍</div>
            <h2>{t('common.noResults')}</h2>
            <p>{t('common.selectFundDesc')}</p>
          </div>
        );
      }

      return (
        <div className="home-layout">
          <div className="home-main">
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '12px', flexWrap: 'wrap', marginBottom: '8px' }}>
              <div className="home-summary">
                <span className="home-summary-label">{t('home.totalFunds')}</span>
                <span className="home-summary-value">{sortedFunds.length}</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span style={{ fontSize: '11px', fontWeight: 700, letterSpacing: '1px', textTransform: 'uppercase', color: 'var(--primary-teal)' }}>{t('perf.sortBy')}</span>
                <select className="perf-sort-select" value={sortKey} onChange={e => setSortKey(e.target.value)}>
                  <option value="default">{t('perf.sortDefault')}</option>
                  <option value="1Y">{t('perf.sort1Y')}</option>
                  <option value="6M">{t('perf.sort6M')}</option>
                  <option value="3M">{t('perf.sort3M')}</option>
                  <option value="1M">{t('perf.sort1M')}</option>
                  <option value="YTD">{t('perf.sortYTD')}</option>
                  <option value="sharpe">{t('perf.sortSharpe')}</option>
                  <option value="mdd">{t('perf.sortMDD')}</option>
                  <option value="vol">{t('perf.sortVol')}</option>
                </select>
              </div>
            </div>
            <div className="funds-grid">
              {sortedFunds.map((fund) => {
                const topTicker = fundTopTickers.get(fund.name);
                const perf = topTicker ? perfCache.get(topTicker) : null;
                return (
                  <FundCard
                    key={fund.name}
                    fund={fund}
                    onClick={() => onSelect(fund)}
                    isWatched={watchedFundSet.has(fund.name)}
                    onToggleWatch={onToggleFundWatch}
                    perfMetrics={perf?.metrics}
                    perfError={perf?.error}
                    showPerf={sortKey !== 'default'}
                  />
                );
              })}
            </div>
          </div>
          <SectorLegend activeSector={activeSector} onSectorClick={setActiveSector} />
        </div>
      );
    }

    function FundCard({ fund, onClick, isWatched, onToggleWatch, perfMetrics, perfError, showPerf }) {
      const chartRef = React.useRef(null);
      const chartInstance = React.useRef(null);
      const { t } = useI18n();

      React.useEffect(() => {
        if (chartInstance.current) chartInstance.current.destroy();
        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: fund.holdings.slice(0, 5).map(h => h.ticker),
            datasets: [{ data: fund.holdings.slice(0, 5).map(h => h.percent), backgroundColor: fund.holdings.slice(0, 5).map(h => getHoldingSectorColor(h)), borderWidth: 2, borderColor: '#fff' }]
          },
          options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false }, tooltip: { enabled: false } }, cutout: '55%', animation: { duration: 0 } }
        });
        return () => chartInstance.current?.destroy();
      }, [fund]);

      // Performance summary line
      let perfLine = null;
      if (showPerf) {
        if (perfMetrics) {
          const ret1Y = perfMetrics.totalReturn['1Y'] ?? perfMetrics.totalReturn['6M'] ?? perfMetrics.totalReturn['3M'] ?? perfMetrics.totalReturn['1M'];
          const mdd = perfMetrics.maxDrawdown;
          const vol = perfMetrics.volatility;
          const sh = perfMetrics.sharpe;
          const retStr = formatPercent(ret1Y);
          const retCls = ret1Y != null ? (ret1Y >= 0 ? 'positive' : 'negative') : 'na';
          perfLine = (
            <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', justifyContent: 'center', marginTop: '6px' }}>
              <span className={`perf-inline ${retCls}`} style={{ fontSize: '10px' }}>{retStr || '—'}</span>
              {mdd != null && <span className="perf-inline" style={{ fontSize: '10px', color: 'var(--teal-light)' }}>MDD {formatPercent(mdd)}</span>}

              {sh != null && <span className="perf-inline" style={{ fontSize: '10px', color: 'var(--teal-light)' }}>SR {formatRatio(sh)}</span>}
            </div>
          );
        } else if (perfError) {
          perfLine = <div style={{ fontSize: '10px', color: '#E67E22', marginTop: '4px', textAlign: 'center' }}>⚠ {t('perf.noData')}</div>;
        }

      return (

            className={`watch-btn ${isWatched ? 'active' : ''}`}

    function DetailView({ fund, onBack, searchTerm, searchMode, watchedTickerSet, watchedFundSet, onToggleTickerWatch, onToggleFundWatch }) {
      const chartRef = React.useRef(null);
      const chartInstance = React.useRef(null);
      const matchRowRef = React.useRef(null);
      const { t, language } = useI18n();
      const [detailTab, setDetailTab] = React.useState('holdings');
      const [sortMode, setSortMode] = React.useState('weight');
      const [isExpanded, setIsExpanded] = React.useState(false);
      const holdings = fund?.holdings || [];
      const normalizedSearch = normalizeSearchText(searchTerm);
      const shouldHighlightTickers = resolveSearchIntent(normalizedSearch, searchMode) === 'ticker';

      React.useEffect(() => {
        setDetailTab('holdings');
        setSortMode('weight');
        setIsExpanded(false);
      }, [fund?.name]);

      const sortedHoldings = React.useMemo(() => {
        const items = [...holdings];
        if (sortMode === 'ticker') {
          items.sort((a, b) => normalizeTicker(a.ticker).localeCompare(normalizeTicker(b.ticker)));
        } else {
          items.sort((a, b) => b.percent - a.percent);
        }
        return items;
      }, [holdings, sortMode]);

      const firstMatchIndex = React.useMemo(() => {
        if (!normalizedSearch || !shouldHighlightTickers) return -1;
        return sortedHoldings.findIndex(h => normalizeTicker(h.ticker) === normalizeTicker(normalizedSearch));
      }, [sortedHoldings, normalizedSearch, shouldHighlightTickers]);

      React.useEffect(() => {
        if (detailTab !== 'holdings') return;
        if (!normalizedSearch || !shouldHighlightTickers) return;
        if (matchRowRef.current) {
          matchRowRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, [normalizedSearch, shouldHighlightTickers, detailTab, sortMode, fund?.name]);

      React.useEffect(() => {
        if (chartInstance.current) chartInstance.current.destroy();
        if (detailTab !== 'holdings' || !chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: holdings.map(h => h.ticker),
            datasets: [{
              data: holdings.map(h => h.percent),
              backgroundColor: holdings.map(h => getHoldingSectorColor(h)),
              borderWidth: 2,
              borderColor: '#fff'
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#264653',
                titleFont: { family: 'Montserrat', weight: '600' },
                bodyFont: { family: 'Montserrat' },
                callbacks: {
                  title: function (items) {
                    return items[0].label + '  ' + items[0].raw.toFixed(1) + '%';
                  },
                  label: function (ctx) {
                    const holding = holdings[ctx.dataIndex];
                    return getHoldingSectorName(holding, language);
                  }
                }
              }
            },
            cutout: '60%'
          }
        });
        return () => chartInstance.current?.destroy();
      }, [holdings, language, detailTab]);

      const profile = React.useMemo(() => getFundProfile(fund), [fund]);
      const topConcentration = React.useMemo(() => getTopConcentration(holdings), [holdings]);
      const description = resolveLocalizedValue(profile.overview, language) || t('fund.aboutPlaceholder');
      const isLongDescription = description.length > 160;
      const visibleDescription = isExpanded || !isLongDescription ? description : `${description.slice(0, 160)}...`;

      const manager = resolveLocalizedValue(profile.manager, language) || t('common.unknown');
      const strategy = resolveLocalizedValue(profile.strategy, language) || t('common.unknown');
      const strength = resolveLocalizedValue(profile.strength, language) || t('common.unknown');
      const aumValue = profile.aum?.value;
      const aumAsOf = profile.aum?.asOf;
      const aum = aumValue
        ? (aumAsOf
          ? (language === 'ja' ? `${aumValue} (${aumAsOf} ${t('common.asOf')})` : `${aumValue} (${t('common.asOf')} ${aumAsOf})`)
          : aumValue)
        : t('common.notAvailable');
      const concentration = topConcentration ? `${topConcentration.toFixed(1)}%` : t('common.notAvailable');

      return (
        <div className="detail-view">
          {onBack && <button className="back-btn" onClick={onBack}>← {t('common.backToHome')}</button>}
          <h1 className="fund-title" style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span>{fund.name}</span>
            <button
              className={`watch-btn ${watchedFundSet?.has(fund.name) ? 'active' : ''}`}
              onClick={() => onToggleFundWatch && onToggleFundWatch(fund.name)}
              title={watchedFundSet?.has(fund.name) ? 'Unwatch fund' : 'Watch fund'}
            >
              ★
            </button>
          </h1>
          <p className="fund-subtitle">{t('common.holdingsCount', { count: holdings.length })}</p>
          <div className="detail-tabs">
            <button className={`detail-tab ${detailTab === 'holdings' ? 'active' : ''}`} onClick={() => setDetailTab('holdings')}>{t('fund.tabs.holdings')}</button>
            <button className={`detail-tab ${detailTab === 'performance' ? 'active' : ''}`} onClick={() => setDetailTab('performance')}>{t('perf.title')}</button>
            <button className={`detail-tab ${detailTab === 'about' ? 'active' : ''}`} onClick={() => setDetailTab('about')}>{t('fund.tabs.about')}</button>
          </div>

          {detailTab === 'holdings' && (
            <>
              <div className="detail-toolbar">
                <div className="detail-sort">
                  <span>{t('common.sortLabel')}</span>
                  <select value={sortMode} onChange={e => setSortMode(e.target.value)}>
                    <option value="weight">{t('common.sortWeight')}</option>
                    <option value="ticker">{t('common.sortTicker')}</option>
                  </select>
                </div>
              </div>
              {holdings.length === 0 ? (
                <div className="empty-state">
                  <div className="empty-icon">📄</div>
                  <h2>{t('common.noHoldings')}</h2>
                </div>
              ) : (
                <>
                  <div className="chart-container"><canvas ref={chartRef}></canvas></div>
                  <div className="table-container">
                    <table className="holdings-table">
                      <thead><tr><th>{t('common.ticker')}</th><th>{t('common.company')}</th><th>{t('common.sector')}</th><th>{t('common.allocation')}</th></tr></thead>
                      <tbody>
                        {sortedHoldings.map((h, i) => {
                          const sector = getHoldingSector(h);
                          const sectorLabel = translate(language, `sector.${sector}`) || sector;
                          const isMatch = shouldHighlightTickers && normalizedSearch && normalizeTicker(h.ticker) === normalizeTicker(normalizedSearch);
                          const rowRef = i === firstMatchIndex ? matchRowRef : null;
                          return (
                            <tr key={i} ref={rowRef} className={`holding-row ${isMatch ? 'match' : ''}`}>
                              <td>
                                <span className="ticker">{h.ticker}</span>
                                <button
                                  className={`watch-btn compact ${watchedTickerSet?.has(normalizeTicker(h.ticker)) ? 'active' : ''}`}
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    onToggleTickerWatch && onToggleTickerWatch(h.ticker);
                                  }}
                                  title={watchedTickerSet?.has(normalizeTicker(h.ticker)) ? 'Unwatch ticker' : 'Watch ticker'}
                                >
                                  ★
                                </button>
                              </td>
                              <td>{h.name}</td>
                              <td><span className="sector-badge" style={{ background: SECTOR_COLORS[sector] }}>{sectorLabel}</span></td>
                              <td><div className="percent-bar"><div className="percent-bar-bg"><div className={`percent-bar-fill ${i === 0 ? 'top' : ''}`} style={{ width: `${h.percent}%` }}></div></div><span className="percent-value">{h.percent.toFixed(1)}%</span></div></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </>
              )}
            </>
          )}

          {detailTab === 'performance' && (
            <DetailPerfTab fund={fund} t={t} />
          )}

          {detailTab === 'about' && (
            <>
              <div className="about-grid">
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.fundInfo')}</div>
                  <div className="profile-value">{fund.name}</div>
                </div>
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.manager')}</div>
                  <div className="profile-value">{manager}</div>
                </div>
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.aum')}</div>
                  <div className="profile-value">{aum}</div>
                </div>
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.strategy')}</div>
                  <div className="profile-value">{strategy}</div>
                </div>
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.strength')}</div>
                  <div className="profile-value">{strength}</div>
                </div>
                <div className="profile-card">
                  <div className="profile-label">{t('fund.cards.top10')}</div>
                  <div className="profile-value">{concentration}</div>
                </div>
              </div>
              <div className="profile-description">
                <div className="profile-label">{t('fund.section.overview')}</div>
                <div>{visibleDescription}</div>
                {isLongDescription && (
                  <button className="read-more" onClick={() => setIsExpanded(v => !v)}>
                    {isExpanded ? t('common.readLess') : t('common.readMore')}
                  </button>
                )}
              </div>
            </>
          )}
        </div>
      );
    }

    function DetailPerfTab({ fund, t }) {
      const topTicker = fund?.holdings?.[0]?.ticker ? normalizeTicker(fund.holdings[0].ticker) : null;
      const [retryKey, setRetryKey] = React.useState(0);
      const perfState = useTickerPerformance(topTicker, retryKey);

      const handleRetry = () => {
        if (topTicker) priceSeriesCache.delete(`stooq:${topTicker}`);
        setRetryKey(k => k + 1);
      };

      return (
        <div>
          <div style={{ fontSize: '12px', color: 'var(--teal-light)', marginBottom: '16px', fontWeight: 600 }}>
            {t('perf.fundPerf')} — {t('common.top')}: <span className="ticker">{topTicker || '—'}</span>
          </div>

          <PerformanceCards
            metrics={perfState.metrics}
            loading={perfState.loading}
            error={perfState.error}
            onRetry={handleRetry}
            t={t}
          />

          {perfState.metrics && (
            <div style={{ marginTop: '8px' }}>
              <div className="perf-cards" style={{ marginBottom: '16px' }}>
                {['1M', '3M', '6M', '1Y', 'YTD', 'MAX'].map(period => {
                  const val = perfState.metrics.totalReturn[period];
                  const str = formatPercent(val);
                  const cls = str === null ? 'na' : (val >= 0 ? 'positive' : 'negative');
                  return (
                    <div key={period} className="perf-card">
                      <div className="perf-card-label">{t(`perf.period${period}`)}</div>
                      <div className={`perf-card-value ${cls}`}>{str || '—'}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <PerformanceChart
            series={perfState.series}
            loading={perfState.loading}
            error={perfState.error}
            t={t}
          />
        </div>
      );
    }

    function OverlapView({ funds }) {
      const { t, language } = useI18n();
      const [fundAIndex, setFundAIndex] = React.useState('');
      const [fundBIndex, setFundBIndex] = React.useState('');

      if (!funds || funds.length === 0) {
        return (
          <div className="empty-state">
            <div className="empty-icon">📄</div>
            <h2>{t('common.noResults')}</h2>
            <p>{t('common.selectFundDesc')}</p>
          </div>
        );
      }

      const fundA = fundAIndex !== '' ? funds[parseInt(fundAIndex)] : null;
      const fundB = fundBIndex !== '' ? funds[parseInt(fundBIndex)] : null;

      const analysis = React.useMemo(() => {
        if (!fundA || !fundB) return null;
        const holdingsA = {};
        fundA.holdings.forEach(h => { holdingsA[h.ticker] = h; });
        const holdingsB = {};
        fundB.holdings.forEach(h => { holdingsB[h.ticker] = h; });

        const common = [];
        const onlyA = [];
        const onlyB = [];

        Object.keys(holdingsA).forEach(ticker => {
          if (holdingsB[ticker]) {
            const sector = holdingsA[ticker].sector || holdingsB[ticker].sector || '';
            common.push({ ticker, name: holdingsA[ticker].name, weightA: holdingsA[ticker].percent, weightB: holdingsB[ticker].percent, sector });
          } else {
            onlyA.push(holdingsA[ticker]);
          }
        });
        Object.keys(holdingsB).forEach(ticker => {
          if (!holdingsA[ticker]) onlyB.push(holdingsB[ticker]);
        });

        common.sort((a, b) => (b.weightA + b.weightB) - (a.weightA + a.weightB));
        return { common, onlyA, onlyB };
      }, [fundA, fundB]);

      return (
        <div>
          <div className="ranking-section-title">{t('overlap.title')}</div>
          <div className="overlap-controls">
            <div className="overlap-select-group">
              <label className="overlap-select-label">{t('overlap.fundA')}</label>
              <select className="overlap-select" value={fundAIndex} onChange={e => setFundAIndex(e.target.value)}>
                <option value="">{t('common.selectFundPlaceholder')}</option>
                {funds.map((f, i) => <option key={i} value={i}>{f.name}</option>)}
              </select>
            </div>
            <div className="overlap-vs">{t('common.vs')}</div>
            <div className="overlap-select-group">
              <label className="overlap-select-label">{t('overlap.fundB')}</label>
              <select className="overlap-select" value={fundBIndex} onChange={e => setFundBIndex(e.target.value)}>
                <option value="">{t('common.selectFundPlaceholder')}</option>
                {funds.map((f, i) => <option key={i} value={i}>{f.name}</option>)}
              </select>
            </div>
          </div>

          {!analysis && (
            <div className="overlap-result">
              <div className="overlap-empty">{t('common.selectBothFunds')}</div>
            </div>
          )}

          {analysis && (
            <div className="overlap-result">
              <div className="overlap-summary">
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.common.length}</div>
                  <div className="overlap-stat-label">{t('common.commonHoldings')}</div>
                </div>
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.onlyA.length}</div>
                  <div className="overlap-stat-label">{t('common.onlyInA')}</div>
                </div>
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.onlyB.length}</div>
                  <div className="overlap-stat-label">{t('common.onlyInB')}</div>
                </div>
              </div>

              {analysis.common.length > 0 ? (
                <div style={{ borderRadius: '12px', overflow: 'hidden' }}>
                  <table className="overlap-table">
                    <thead>
                      <tr>
                        <th>{t('common.ticker')}</th>
                        <th>{t('common.company')}</th>
                        <th>{t('common.sector')}</th>
                        <th>{t('common.weightInA')}</th>
                        <th>{t('common.weightInB')}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {analysis.common.map(item => {
                        const sector = resolveSector(item);
                        const sectorLabel = translate(language, `sector.${sector}`) || sector;
                        return (
                          <tr key={item.ticker}>
                            <td><span className="ticker">{item.ticker}</span></td>
                            <td>{item.name}</td>
                            <td><span className="sector-badge" style={{ background: SECTOR_COLORS[sector] }}>{sectorLabel}</span></td>
                            <td style={{ fontWeight: 600 }}>{item.weightA.toFixed(1)}%</td>
                            <td style={{ fontWeight: 600 }}>{item.weightB.toFixed(1)}%</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              ) : (
                <div className="overlap-empty">{t('common.noOverlap')}</div>
              )}
            </div>
          )}
        </div>
      );
    }

    function RankingView({ funds, watchedTickerSet, onToggleTickerWatch, onOpenFund }) {
      const { t, language } = useI18n();
      const [mode, setMode] = React.useState('weight');
      const [expandedTicker, setExpandedTicker] = React.useState(null);

      if (!funds || funds.length === 0) {
        return (
          <div className="empty-state">
            <div className="empty-icon">📄</div>
            <h2>{t('common.noResults')}</h2>
            <p>{t('common.selectFundDesc')}</p>
          </div>
        );
      }

      const allData = React.useMemo(() => {
        const tickerMap = {};
        funds.forEach(fund => {
          fund.holdings.forEach(h => {
            if (!tickerMap[h.ticker]) {
              tickerMap[h.ticker] = { ticker: h.ticker, name: h.name, totalWeight: 0, fundCount: 0, funds: [], sector: h.sector || '' };
            } else if (!tickerMap[h.ticker].sector && h.sector) {
              tickerMap[h.ticker].sector = h.sector;
            }
            tickerMap[h.ticker].totalWeight += h.percent;
            tickerMap[h.ticker].fundCount += 1;
            tickerMap[h.ticker].funds.push({ name: fund.name, weight: h.percent });
          });
        });
        return Object.values(tickerMap).map(item => ({
          ...item,
          avgWeight: item.totalWeight / item.fundCount
        }));
      }, [funds]);

      const rankingData = React.useMemo(() => {
        const sorted = [...allData];
        if (mode === 'weight') {
          sorted.sort((a, b) => b.totalWeight - a.totalWeight);
        } else {
          sorted.sort((a, b) => b.fundCount - a.fundCount || b.totalWeight - a.totalWeight);
        }
        return sorted.slice(0, 30);
      }, [allData, mode]);

      const maxTotal = rankingData.length > 0 ? Math.max(...rankingData.map(d => d.totalWeight)) : 1;
      const maxAvg = rankingData.length > 0 ? Math.max(...rankingData.map(d => d.avgWeight)) : 1;
      const fundByName = React.useMemo(() => {
        const map = new Map();
        (funds || []).forEach((fund) => map.set(String(fund.name || '').trim(), fund));
        return map;
      }, [funds]);

      return (
        <div>
          <div className="ranking-section-title">{t('ranking.title')}</div>
          <div className="ranking-tabs">
            <button className={`ranking-tab ${mode === 'weight' ? 'active' : ''}`} onClick={() => { setMode('weight'); setExpandedTicker(null); }}>{t('ranking.rankByWeight')}</button>
            <button className={`ranking-tab ${mode === 'popularity' ? 'active' : ''}`} onClick={() => { setMode('popularity'); setExpandedTicker(null); }}>{t('ranking.rankByPopularity')}</button>
          </div>
          <div className="ranking-table-container">
            <table className="ranking-table">
              <thead>
                <tr>
                  <th>{t('common.rank')}</th>
                  <th>{t('common.ticker')}</th>
                  <th>{t('common.company')}</th>
                  <th>{t('common.sector')}</th>
                  <th>{t('common.avgWeight')}</th>
                  <th>{t('common.totalWeight')}</th>
                  <th>{t('common.funds')}</th>
                  <th>★</th>
                </tr>
              </thead>
              <tbody>
                {rankingData.map((item, i) => {
                  const sector = resolveSector(item);
                  const sectorLabel = translate(language, `sector.${sector}`) || sector;
                  const totalBarWidth = (item.totalWeight / maxTotal) * 100;
                  const avgBarWidth = (item.avgWeight / maxAvg) * 100;
                  const isExpanded = expandedTicker === item.ticker;
                  return (
                    <React.Fragment key={item.ticker}>
                      <tr className="clickable" onClick={() => setExpandedTicker(isExpanded ? null : item.ticker)}>
                        <td><span className={`ranking-rank ${i < 3 ? 'top3' : ''}`}>{i + 1}</span></td>
                        <td><span className="ticker">{item.ticker}</span></td>
                        <td>{item.name}</td>
                        <td><span className="sector-badge" style={{ background: SECTOR_COLORS[sector] }}>{sectorLabel}</span></td>
                        <td className="weight-cell">
                          <div className="weight-bar" style={{ width: avgBarWidth + '%' }}></div>
                          <span className="weight-value">{item.avgWeight.toFixed(1)}%</span>
                        </td>
                        <td className="weight-cell">
                          <div className="weight-bar accent" style={{ width: totalBarWidth + '%' }}></div>
                          <span className="weight-value">{item.totalWeight.toFixed(1)}%</span>
                        </td>
                        <td><span className="ranking-funds-count">{item.fundCount}</span></td>
                        <td>
                          <button
                            className={`watch-btn compact ${watchedTickerSet?.has(normalizeTicker(item.ticker)) ? 'active' : ''}`}
                            onClick={(e) => {
                              e.stopPropagation();
                              onToggleTickerWatch && onToggleTickerWatch(item.ticker);
                            }}
                            title={watchedTickerSet?.has(normalizeTicker(item.ticker)) ? 'Unwatch ticker' : 'Watch ticker'}
                          >
                            ★
                          </button>
                        </td>
                      </tr>
                      {isExpanded && (
                        <tr className="ticker-funds-panel">
                          <td colSpan="8">

    function WatchView({

      previousFunds,

      const [mode, setMode] = React.useState('ticker');

      const tickerSummaryMap = React.useMemo(() => {

        return map;

      const tickerDeltaMap = React.useMemo(() => {
        const map = new Map();
        (tickerDeltaRows || []).forEach((row) => map.set(normalizeTicker(row.ticker), row));
        return map;
      }, [tickerDeltaRows]);

      const watchedTickerRows = React.useMemo(() => {

          .map((ticker) => {
            const normalized = normalizeTicker(ticker);
            const summary = tickerSummaryMap.get(normalized);
            const delta = tickerDeltaMap.get(normalized);
            if (!summary && !delta) return null;
            return {
              ticker: normalized,
              name: summary?.name || delta?.name || normalized,
              sector: resolveSector({
                ticker: normalized,
                sector: summary?.sector || delta?.sector,
                name: summary?.name || delta?.name
              }),
              currentFundCount: summary?.fundCount ?? delta?.currentFundCount ?? 0,
              deltaFundCount: delta?.score ?? 0,
              funds: summary?.funds || []
            };
          })
          .filter(Boolean)
          .sort((a, b) => Math.abs(b.deltaFundCount) - Math.abs(a.deltaFundCount) || b.currentFundCount - a.currentFundCount);
      }, [watchlist, tickerSummaryMap, tickerDeltaMap]);

      const currentFundMap = React.useMemo(() => {
        const map = new Map();
        (currentFunds || []).forEach((fund) => map.set(String(fund.name || '').trim(), fund));
        return map;
      }, [currentFunds]);

      const previousFundMap = React.useMemo(() => {

        (previousFunds || []).forEach((fund) => map.set(String(fund.name || '').trim(), fund));
        return map;
      }, [previousFunds]);

      const watchedFundRows = React.useMemo(() => {
        return (watchlist.funds || [])
          .map((fundName) => {
            const current = currentFundMap.get(fundName);
            if (!current) return null;
            const previous = previousFundMap.get(fundName);
            const currentCount = (current.holdings || []).length;
            const previousCount = (previous?.holdings || []).length;
            return {
              name: fundName,

              previousCount,
              delta: currentCount - previousCount,

                            <td>{row.name}</td>
                            <td><span className="sector-badge" style={{ background: SECTOR_COLORS[row.sector] || SECTOR_COLORS.Other }}>{translate(language, `sector.${row.sector}`) || row.sector}</span></td>

                    {selectedTickerDetail && (

                        </div>
                        {selectedTickerDetail.funds.length === 0 ? (

            {mode === 'fund' && (

                      <tr>

                        <th>{t('common.funds')}</th>
                        <th>{t('watch.deltaFunds')}</th>

                          <td><span className="ticker">{row.topHolding}</span></td>
                          <td>
                            <button className="watch-toggle-btn" style={{ textTransform: 'none', letterSpacing: '0' }} onClick={() => onOpenFund(row.current)}>
                              {t('watch.open')}

                          </td>
                          <td>
                            <button className={`watch-btn compact ${watchedFundSet.has(row.name) ? 'active' : ''}`} onClick={() => onToggleFundWatch(row.name)}>
                              ★
                            </button>
                          </td>

                      ))}
                    </tbody>
                  </table>
                )}
              </>
            )}

    function buildFundTickerLookup(funds) {
      const fundLookup = new Map();
      (funds || []).forEach((fund) => {
        const fundName = normalizeFundKey(fund?.name);
        if (!fundName) return;
        const tickerLookup = new Map();
        (fund?.holdings || []).forEach((holding) => {
          const ticker = normalizeTicker(holding?.ticker);
          if (!ticker) return;
          tickerLookup.set(ticker, {
            ticker,
            name: String(holding?.name || ticker).trim(),
            sector: getHoldingSector(holding),
            weight: Number(holding?.percent || 0)
          });
        });
        fundLookup.set(fundName, tickerLookup);
      });
      return fundLookup;
    }

    function buildTickerDeltaMap(currentFunds, prevFunds) {
      const EPSILON = 0.0001;
      const currentLookup = buildFundTickerLookup(currentFunds);
      const prevLookup = buildFundTickerLookup(prevFunds);
      const allFundNames = new Set([...currentLookup.keys(), ...prevLookup.keys()]);
      const tickerMap = new Map();

      allFundNames.forEach((fundName) => {
        const currentTickers = currentLookup.get(fundName) || new Map();
        const prevTickers = prevLookup.get(fundName) || new Map();
        const allTickers = new Set([...currentTickers.keys(), ...prevTickers.keys()]);

        allTickers.forEach((ticker) => {
          const currentHolding = currentTickers.get(ticker);
          const prevHolding = prevTickers.get(ticker);
          const currentWeight = Number(currentHolding?.weight || 0);
          const prevWeight = Number(prevHolding?.weight || 0);
          const reference = currentHolding || prevHolding;

          if (!tickerMap.has(ticker)) {
            tickerMap.set(ticker, {
              ticker,
              name: reference?.name || ticker,
              sector: reference?.sector || 'Other',
              currentFundCount: 0,
              prevFundCount: 0,
              currentTotalWeight: 0,
              prevTotalWeight: 0,
              buyCount: 0,
              sellCount: 0,
              newCount: 0,
              exitCount: 0,
              unchangedCount: 0
            });
          }

          const row = tickerMap.get(ticker);
          row.name = row.name || reference?.name || ticker;
          row.sector = row.sector === 'Other' && reference?.sector ? reference.sector : row.sector;
          row.currentTotalWeight += currentWeight;
          row.prevTotalWeight += prevWeight;

          if (currentWeight > EPSILON) row.currentFundCount += 1;
          if (prevWeight > EPSILON) row.prevFundCount += 1;

          if (prevWeight <= EPSILON && currentWeight > EPSILON) {
            row.newCount += 1;
          } else if (prevWeight > EPSILON && currentWeight <= EPSILON) {
            row.exitCount += 1;
          } else if (currentWeight - prevWeight > EPSILON) {
            row.buyCount += 1;
          } else if (prevWeight - currentWeight > EPSILON) {
            row.sellCount += 1;
          } else {
            row.unchangedCount += 1;
          }
        });
      });

      return Array.from(tickerMap.values())
        .map((row) => {
          const score = row.currentFundCount - row.prevFundCount;
          const netActionScore = (row.buyCount + row.newCount) - (row.sellCount + row.exitCount);
          return {
            ...row,
            score,
            netActionScore,
            currentTotalWeight: Number(row.currentTotalWeight.toFixed(1)),
            prevTotalWeight: Number(row.prevTotalWeight.toFixed(1)),
            weightDelta: Number((row.currentTotalWeight - row.prevTotalWeight).toFixed(1))
          };
        })
        .sort((a, b) => {
          if (Math.abs(b.score) !== Math.abs(a.score)) return Math.abs(b.score) - Math.abs(a.score);
          return b.currentFundCount - a.currentFundCount;
        });
    }

    function buildSectorAggregates(tickerDeltaRows) {
      const sectorMap = new Map();

      (tickerDeltaRows || []).forEach((row) => {
        const sector = row.sector || 'Other';
        if (!sectorMap.has(sector)) {
          sectorMap.set(sector, {
            sector,
            buyCount: 0,
            sellCount: 0,
            newCount: 0,
            exitCount: 0,
            totalCurrentFunds: 0,
            totalPrevFunds: 0,
            topTickers: []
          });
        }
        const agg = sectorMap.get(sector);
        agg.buyCount += row.buyCount;
        agg.sellCount += row.sellCount;
        agg.newCount += row.newCount;
        agg.exitCount += row.exitCount;
        agg.totalCurrentFunds += row.currentFundCount;
        agg.totalPrevFunds += row.prevFundCount;
        agg.topTickers.push(row);
      });

      return Array.from(sectorMap.values())
        .map((agg) => ({
          ...agg,
          sectorScore: (agg.buyCount + agg.newCount) - (agg.sellCount + agg.exitCount),
          topTickers: agg.topTickers
            .sort((a, b) => b.score - a.score || b.netActionScore - a.netActionScore)
            .slice(0, 10)
        }))
        .sort((a, b) => b.sectorScore - a.sectorScore);
    }

    function FlowView({ currentFunds, previousFunds, dataAsOf }) {
      const { t, language } = useI18n();
      const containerRef = React.useRef(null);
      const [tooltip, setTooltip] = React.useState(null);
      const [dims, setDims] = React.useState({ width: 1000, height: 600 });
      const [viewMode, setViewMode] = React.useState('stocks'); // 'stocks' | 'sectors'
      const [currentPeriodId, setCurrentPeriodId] = React.useState('latest');
      const [prevPeriodId, setPrevPeriodId] = React.useState('previous');
      const [activeSector, setActiveSector] = React.useState(null);

      // Measure container
      React.useEffect(() => {
        const measure = () => {
          if (containerRef.current) {
            const w = containerRef.current.clientWidth;
            setDims({ width: w, height: Math.max(500, Math.min(700, w * 0.55)) });
          }
        };
        measure();
        window.addEventListener('resize', measure);
        return () => window.removeEventListener('resize', measure);
      }, []);

      const periodMap = React.useMemo(() => ({
        latest: Array.isArray(currentFunds) ? currentFunds : [],
        previous: Array.isArray(previousFunds) ? previousFunds : []
      }), [currentFunds, previousFunds]);

      const periodOptions = React.useMemo(() => [
        { id: 'latest', label: `${t('flow.periodLatest')} (${dataAsOf})`, count: periodMap.latest.length },
        { id: 'previous', label: t('flow.periodPrevious'), count: periodMap.previous.length }
      ], [periodMap, t, dataAsOf]);

      const selectedCurrentFunds = periodMap[currentPeriodId] || [];
      const selectedPrevFunds = periodMap[prevPeriodId] || [];

      const tickerDeltaRows = React.useMemo(
        () => buildTickerDeltaMap(selectedCurrentFunds, selectedPrevFunds),
        [selectedCurrentFunds, selectedPrevFunds]
      );

      const sectorAggregates = React.useMemo(
        () => buildSectorAggregates(tickerDeltaRows),
        [tickerDeltaRows]
      );

      React.useEffect(() => {
        if (!activeSector && sectorAggregates.length > 0) {
          setActiveSector(sectorAggregates[0].sector);
        }
      }, [activeSector, sectorAggregates]);

      const stockFlowBySector = React.useMemo(() => {
        const grouped = {};
        tickerDeltaRows
          .filter((row) => row.currentFundCount > 0)
          .forEach((row) => {
            const sector = row.sector || 'Other';
            if (!grouped[sector]) grouped[sector] = [];
            grouped[sector].push({
              name: row.ticker,
              fullName: row.name,
              score: row.score,
              currentFundCount: row.currentFundCount,
              prevFundCount: row.prevFundCount,
              currentTotalWeight: row.currentTotalWeight,
              prevTotalWeight: row.prevTotalWeight,
              weightDelta: row.weightDelta,
              buyCount: row.buyCount,
              sellCount: row.sellCount,
              newCount: row.newCount,
              exitCount: row.exitCount,
              unchangedCount: row.unchangedCount,
              sizeMetric: row.currentFundCount
            });
          });

        return Object.keys(grouped).map((sector) => ({
          name: sector,
          children: grouped[sector].sort((a, b) => b.sizeMetric - a.sizeMetric).slice(0, 40)
        }));
      }, [tickerDeltaRows]);

      const maxAbsTickerScore = React.useMemo(() => {
        const maxScore = stockFlowBySector
          .flatMap((sector) => sector.children)
          .reduce((acc, item) => Math.max(acc, Math.abs(item.score)), 0);
        return Math.max(maxScore, 1);
      }, [stockFlowBySector]);

      // Build treemap layout — size = current fund count
      const cells = React.useMemo(() => {
        const { width, height } = dims;
        const root = d3.hierarchy({ name: 'root', children: stockFlowBySector })
          .sum((d) => d.sizeMetric || 0)
          .sort((a, b) => b.value - a.value);

        d3.treemap()
          .size([width, height])
          .paddingTop(22)
          .paddingInner(2)
          .paddingOuter(3)
          .round(true)(root);

        return root;
      }, [dims, stockFlowBySector]);

      const getColor = (row) => {
        const score = row.score;
        if (score === 0) return '#B8B5AD';
        const intensity = Math.min(Math.abs(score) / maxAbsTickerScore, 1);
        if (score > 0) {
          const r = Math.round(210 + 45 * intensity);
          const g = Math.round(145 - 100 * intensity);
          const b = Math.round(145 - 100 * intensity);
          return `rgb(${r},${g},${b})`;
        }
        const r = Math.round(120 - 70 * intensity);
        const g = Math.round(165 + 40 * intensity);
        const b = Math.round(120 - 50 * intensity);
        return `rgb(${r},${g},${b})`;
      };

      const formatScore = (score) => {
        if (!Number.isFinite(score)) return '0';
        return `${score > 0 ? '+' : ''}${score}`;
      };

      const handleMouseMove = (e, d) => {
        setTooltip({
          x: e.clientX + 12,
          y: e.clientY - 10,
          ...d.data
        });
      };

      const sectorGroups = cells.children || [];
      const activeSectorData = sectorAggregates.find((item) => item.sector === activeSector) || null;
      const maxAbsSectorScore = Math.max(...sectorAggregates.map((d) => Math.abs(d.sectorScore)), 1);

      return (
        <div>
          <div className="ranking-section-title">{t('flow.title')}</div>
          <p style={{ fontSize: '12px', color: '#2A9D8F', marginBottom: '24px', marginTop: '-12px' }}>
            {viewMode === 'stocks' ? t('flow.subtitle') : t('flow.subtitleSectors')}
          </p>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '12px', marginBottom: '20px' }}>
            <label style={{ fontSize: '11px', fontWeight: 700, color: 'var(--primary-teal)', letterSpacing: '1px' }}>
              {t('flow.currentPeriod')}
              <select
                value={currentPeriodId}
                onChange={(e) => {
                  const next = e.target.value;
                  setCurrentPeriodId(next);
                  if (next === prevPeriodId) {
                    const fallback = periodOptions.find((option) => option.id !== next);
                    if (fallback) setPrevPeriodId(fallback.id);
                  }
                }}
                style={{ marginTop: '6px', width: '100%', padding: '10px 12px', borderRadius: '10px', border: '1px solid rgba(38,70,83,0.25)', fontFamily: 'Montserrat, sans-serif' }}
              >
                {periodOptions.map((option) => (
                  <option key={option.id} value={option.id}>
                    {option.label} ({option.count})
                  </option>
                ))}
              </select>
            </label>
            <label style={{ fontSize: '11px', fontWeight: 700, color: 'var(--primary-teal)', letterSpacing: '1px' }}>
              {t('flow.previousPeriod')}
              <select
                value={prevPeriodId}
                onChange={(e) => {
                  const next = e.target.value;
                  setPrevPeriodId(next);
                  if (next === currentPeriodId) {
                    const fallback = periodOptions.find((option) => option.id !== next);
                    if (fallback) setCurrentPeriodId(fallback.id);
                  }
                }}
                style={{ marginTop: '6px', width: '100%', padding: '10px 12px', borderRadius: '10px', border: '1px solid rgba(38,70,83,0.25)', fontFamily: 'Montserrat, sans-serif' }}
              >
                {periodOptions.map((option) => (
                  <option key={option.id} value={option.id}>
                    {option.label} ({option.count})
                  </option>
                ))}
              </select>
            </label>
          </div>

          {/* View Toggle */}
          <div className="view-toggle-container">
            <div className="view-toggle">
              <button
                className={`view-toggle-btn ${viewMode === 'stocks' ? 'active' : ''}`}
                onClick={() => setViewMode('stocks')}
              >
                {t('flow.stocksBreakdown')}
              </button>
              <button
                className={`view-toggle-btn ${viewMode === 'sectors' ? 'active' : ''}`}
                onClick={() => setViewMode('sectors')}
              >
                {t('flow.sectorMomentum')}
              </button>
            </div>
          </div>

          {tickerDeltaRows.length === 0 && (
            <div className="empty-state" style={{ height: '220px' }}>
              <h2>{t('flow.noData')}</h2>
            </div>
          )}

          {/* Stocks Breakdown View (TreeMap) */}
          {viewMode === 'stocks' && tickerDeltaRows.length > 0 && (
            <div className="flow-container">
              <div className="treemap-wrapper" ref={containerRef}>
                <svg width={dims.width} height={dims.height} style={{ fontFamily: 'Montserrat, sans-serif' }}>
                  {sectorGroups.map((group) => (
                    <g key={group.data.name}>
                      <rect
                        x={group.x0} y={group.y0}
                        width={group.x1 - group.x0} height={group.y1 - group.y0}
                        fill="rgba(38, 70, 83, 0.04)"
                        stroke="rgba(38, 70, 83, 0.12)"
                        strokeWidth="1"
                        rx="4"
                      />
                      <text
                        x={group.x0 + 8} y={group.y0 + 15}
                        fontSize="10" fontWeight="700" fill="#264653"
                        textAnchor="start" letterSpacing="1.5"
                        style={{ textTransform: 'uppercase' }}
                      >
                        {translate(language, `sector.${group.data.name}`) || group.data.name}
                      </text>
                      {(group.children || []).map((leaf) => {
                        const w = leaf.x1 - leaf.x0;
                        const h = leaf.y1 - leaf.y0;
                        const showTicker = w > 40 && h > 20;
                        const showScore = w > 48 && h > 34;
                        return (
                          <g key={leaf.data.name} className="treemap-cell"
                            onMouseMove={(e) => handleMouseMove(e, leaf)}
                            onMouseLeave={() => setTooltip(null)}
                          >
                            <rect
                              x={leaf.x0} y={leaf.y0}
                              width={w} height={h}
                              fill={getColor(leaf.data)}
                              rx="3"
                            />
                            {showTicker && (
                              <text
                                x={leaf.x0 + w / 2} y={leaf.y0 + h / 2 + (showScore ? -4 : 2)}
                                textAnchor="middle"
                                fontSize={w > 70 ? '12' : '10'}
                                fontWeight="700"
                                fill="#fff"
                              >
                                {leaf.data.name}
                              </text>
                            )}
                            {showScore && (
                              <text
                                x={leaf.x0 + w / 2} y={leaf.y0 + h / 2 + 12}
                                textAnchor="middle"
                                fontSize="9"
                                fontWeight="600"
                                fill="rgba(255,255,255,0.9)"
                              >
                                {formatScore(leaf.data.score)}
                              </text>
                            )}
                          </g>
                        );
                      })}
                    </g>
                  ))}
                </svg>
              </div>

              <div className="flow-legend">
                <div className="flow-scale">
                  <span className="flow-scale-label">{t('flow.netSell')}</span>
                  <div className="flow-scale-bar" style={{
                    background: 'linear-gradient(90deg, rgb(50,200,70), rgb(110,160,110), #B8B5AD, rgb(200,130,130), rgb(255,40,40))'
                  }}></div>
                  <span className="flow-scale-label">{t('flow.netBuy')}</span>
                </div>
              </div>
            </div>
          )}

          {/* Sector Momentum View (Bar Chart) */}
          {viewMode === 'sectors' && tickerDeltaRows.length > 0 && (
            <div className="sector-momentum-container">
              <div className="momentum-chart">
                {sectorAggregates.map((sector) => {
                  const barWidth = (Math.abs(sector.sectorScore) / maxAbsSectorScore) * 45;
                  const isPositive = sector.sectorScore > 0;
                  const sectorLabel = translate(language, `sector.${sector.sector}`) || sector.sector;

                  return (
                    <div
                      key={sector.sector}
                      className="momentum-row"
                      onMouseEnter={() => setActiveSector(sector.sector)}
                      onClick={() => setActiveSector(sector.sector)}
                      style={{ cursor: 'pointer', background: activeSector === sector.sector ? 'rgba(233,196,106,0.12)' : 'transparent', borderRadius: '8px', padding: '0 10px' }}
                    >
                      <div className="momentum-label">{sectorLabel}</div>
                      <div className="momentum-bar-wrapper">
                        <div className="momentum-bar-center"></div>
                        {sector.sectorScore !== 0 && (
                          <div
                            className={`momentum-bar ${isPositive ? 'positive' : 'negative'}`}
                            style={{ width: `${barWidth}%` }}
                          >
                            <span className={`momentum-score ${isPositive ? 'positive' : 'negative'}`}>
                              {formatScore(sector.sectorScore)}
                            </span>
                          </div>
                        )}
                        {sector.sectorScore === 0 && (
                          <span style={{
                            position: 'absolute',
                            left: '50%',
                            transform: 'translateX(-50%)',
                            fontSize: '11px',
                            fontWeight: '600',
                            color: 'var(--primary-teal)'
                          }}>0</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="flow-legend" style={{ marginTop: '24px' }}>
                <div className="flow-scale">
                  <span className="flow-scale-label">{t('flow.netSell')}</span>
                  <div className="flow-scale-bar" style={{
                    background: 'linear-gradient(90deg, #4CAF50, #B8B5AD, #FF6B6B)'
                  }}></div>
                  <span className="flow-scale-label">{t('flow.netBuy')}</span>
                </div>
              </div>

              {activeSectorData && (
                <div style={{ marginTop: '20px', borderTop: '1px solid rgba(38,70,83,0.15)', paddingTop: '16px' }}>
                  <div style={{ fontSize: '13px', fontWeight: 700, color: 'var(--primary-teal)', marginBottom: '10px' }}>
                    {(translate(language, `sector.${activeSectorData.sector}`) || activeSectorData.sector)} · {t('flow.score')}: {formatScore(activeSectorData.sectorScore)}
                  </div>
                  <div style={{ display: 'flex', gap: '14px', flexWrap: 'wrap', fontSize: '12px', color: 'var(--primary-teal)' }}>
                    <span>{t('flow.newPos')}: <b>{activeSectorData.newCount}</b></span>
                    <span>{t('flow.buys')}: <b>{activeSectorData.buyCount}</b></span>
                    <span>{t('flow.sells')}: <b>{activeSectorData.sellCount}</b></span>
                    <span>{t('flow.exitPos')}: <b>{activeSectorData.exitCount}</b></span>
                  </div>
                  <div style={{ marginTop: '12px', fontSize: '12px', color: 'var(--primary-teal)', fontWeight: 700 }}>{t('flow.topFlowTickers')}</div>
                  <div style={{ marginTop: '8px', display: 'grid', gap: '6px' }}>
                    {activeSectorData.topTickers.map((item) => (
                      <div key={item.ticker} style={{ display: 'grid', gridTemplateColumns: '80px 1fr auto', gap: '10px', alignItems: 'center', fontSize: '12px' }}>
                        <span className="ticker">{item.ticker}</span>
                        <span style={{ color: 'var(--primary-teal)' }}>{item.name}</span>
                        <span style={{ fontWeight: 700, color: item.score >= 0 ? '#C0392B' : '#1E8449' }}>
                          {formatScore(item.score)} ({item.prevFundCount}→{item.currentFundCount})
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {viewMode === 'stocks' && tooltip && (
            <div className="treemap-tooltip" style={{ left: tooltip.x, top: tooltip.y }}>
              <div className="tt-ticker">{tooltip.name}</div>
              <div className="tt-company">{tooltip.fullName}</div>
              <div className="tt-row">
                <span>{t('flow.score')}</span>
                <span style={{ fontWeight: 700 }}>{formatScore(tooltip.score)}</span>
              </div>
              <div className="tt-row">
                <span>{t('flow.currentFunds')}</span>
                <span style={{ fontWeight: 700 }}>{tooltip.currentFundCount} {t('flow.fundsUnit')}</span>
              </div>
              <div className="tt-row">
                <span>{t('flow.previousFunds')}</span>
                <span style={{ fontWeight: 700 }}>{tooltip.prevFundCount} {t('flow.fundsUnit')}</span>
              </div>
              <div className="tt-row">
                <span>{t('flow.currentWeight')}</span>
                <span style={{ fontWeight: 700 }}>{tooltip.currentTotalWeight.toFixed(1)}%</span>
              </div>
              <div className="tt-row">
                <span>{t('flow.previousWeight')}</span>
                <span style={{ fontWeight: 700 }}>{tooltip.prevTotalWeight.toFixed(1)}%</span>
              </div>
              <div className="tt-row">
                <span>{t('flow.weightDelta')}</span>
                <span style={{ fontWeight: 700 }}>{formatScore(Number(tooltip.weightDelta.toFixed(1)))}%</span>
              </div>
              <div className="tt-row">
                <span>{t('flow.breakdown')}</span>
                <span>
                  <span className="tt-change-pos">{t('flow.newPos')} {tooltip.newCount}</span>
                  {' / '}
                  <span className="tt-change-pos">{t('flow.buys')} {tooltip.buyCount}</span>
                  {' / '}
                  <span className="tt-change-neg">{t('flow.sells')} {tooltip.sellCount}</span>
                  {' / '}
                  <span className="tt-change-neg">{t('flow.exitPos')} {tooltip.exitCount}</span>
                </span>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
