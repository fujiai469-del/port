<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Visualizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-sand: #E8E1D5;
      --primary-teal: #264653;
      --accent-gold: #E9C46A;
      --teal-light: #2A9D8F;
      --teal-dark: #1D3F4A;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-sand);
      color: var(--primary-teal);
      min-height: 100vh;
    }

    /* Header & Tabs */
    .header {
      background: var(--primary-teal);
      padding: 20px 40px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      gap: 8px;
    }

    .tab {
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      border: none;
      font-family: 'Montserrat', sans-serif;
    }

    .tab:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .tab.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search-box {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 13px;
      width: 220px;
      outline: none;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-box:focus {
      background: rgba(255, 255, 255, 0.2);
      width: 280px;
    }

    .lang-toggle {
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .lang-btn {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5);
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .lang-btn:hover {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8);
    }

    .lang-btn.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    /* Main Content */
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px;
    }

    /* Layout with legend */
    .home-layout {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 32px;
    }

    .list-layout-wrapper {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 32px;
    }

    /* Sector Legend */
    .sector-legend {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .sector-legend-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-teal);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--bg-sand);
    }

    .sector-legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 12px;
      color: var(--primary-teal);
    }

    .sector-legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .sector-legend-label {
      font-weight: 500;
    }

    /* Home Grid */
    .funds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .fund-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .fund-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(38, 70, 83, 0.15);
    }

    .fund-card-chart {
      width: 140px;
      height: 140px;
      margin-bottom: 16px;
    }

    .fund-card-name {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: var(--primary-teal);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .fund-card-meta {
      font-size: 11px;
      color: var(--teal-light);
      display: flex;
      gap: 12px;
    }

    .fund-card-meta span {
      background: rgba(42, 157, 143, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* List View */
    .list-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 40px;
      min-height: calc(100vh - 140px);
    }

    .list-sidebar {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      height: fit-content;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      position: sticky;
      top: 100px;
    }

    .list-item {
      padding: 14px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
      margin-bottom: 4px;
      border-left: 3px solid transparent;
    }

    .list-item:hover {
      background: rgba(38, 70, 83, 0.05);
    }

    .list-item.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
      font-weight: 600;
      border-left-color: var(--primary-teal);
    }

    /* Detail View */
    .detail-view {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      background: rgba(38, 70, 83, 0.05);
      color: var(--primary-teal);
      border: none;
      margin-bottom: 24px;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .back-btn:hover {
      background: rgba(38, 70, 83, 0.1);
    }

    .fund-title {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-teal);
    }

    .fund-subtitle {
      color: var(--teal-light);
      font-size: 14px;
      margin-bottom: 40px;
    }

    .chart-container {
      max-width: 350px;
      margin: 0 auto 40px;
    }

    .table-container {
      background: var(--bg-sand);
      border-radius: 16px;
      overflow: hidden;
    }

    .holdings-table {
      width: 100%;
      border-collapse: collapse;
    }

    .holdings-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 16px 20px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 600;
    }

    .holdings-table td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.1);
      background: #fff;
    }

    .holdings-table tr:last-child td {
      border-bottom: none;
    }

    .holdings-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .ticker {
      font-weight: 700;
      color: var(--primary-teal);
      background: rgba(233, 196, 106, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
    }

    .sector-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      color: #fff;
      display: inline-block;
      margin-left: 8px;
    }

    .percent-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .percent-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(38, 70, 83, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .percent-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-teal), var(--teal-light));
      border-radius: 4px;
    }

    .percent-bar-fill.top {
      background: linear-gradient(90deg, var(--accent-gold), #F4A261);
    }

    .percent-value {
      font-weight: 600;
      min-width: 50px;
      text-align: right;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 400px;
      color: var(--primary-teal);
      opacity: 0.6;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    /* Ranking View */
    .ranking-view {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .ranking-title {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-teal);
    }

    .ranking-subtitle {
      color: var(--teal-light);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
    }

    .ranking-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 14px 16px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
      font-weight: 600;
    }

    .ranking-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.1);
      background: #fff;
      font-size: 13px;
    }

    .ranking-table tr:last-child td {
      border-bottom: none;
    }

    .ranking-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .rank-number {
      font-weight: 700;
      font-size: 15px;
      color: var(--primary-teal);
      min-width: 32px;
      display: inline-block;
      text-align: center;
    }

    .rank-number.top3 {
      background: var(--accent-gold);
      color: var(--primary-teal);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      line-height: 32px;
    }

    .rank-funds-count {
      font-weight: 700;
      color: var(--primary-teal);
      background: rgba(42, 157, 143, 0.12);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      display: inline-block;
    }

    .rank-weight {
      font-weight: 600;
      color: var(--primary-teal);
    }

    .rank-row {
      transition: background 0.2s;
    }

    .rank-row.expanded td {
      background: rgba(233, 196, 106, 0.15);
      border-bottom-color: transparent;
    }

    .expand-arrow {
      font-size: 10px;
      color: var(--teal-light);
      transition: transform 0.2s;
    }

    .rank-detail-row td {
      background: var(--bg-sand) !important;
      padding: 0 !important;
    }

    .rank-funds-panel {
      padding: 16px 24px 20px;
    }

    .rank-funds-header {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--teal-light);
      padding: 0 0 10px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.1);
      margin-bottom: 4px;
    }

    .rank-fund-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(38, 70, 83, 0.06);
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 6px;
      padding-left: 8px;
      padding-right: 8px;
    }

    .rank-fund-item:last-child {
      border-bottom: none;
    }

    .rank-fund-item:hover {
      background: rgba(233, 196, 106, 0.2);
    }

    .rank-fund-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--primary-teal);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 16px;
    }

    .rank-fund-item:hover .rank-fund-name {
      color: var(--teal-light);
      text-decoration: underline;
    }

    .rank-fund-bar-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 140px;
    }

    .rank-fund-bar {
      flex: 1;
      height: 6px;
      background: rgba(38, 70, 83, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .rank-fund-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-gold), #F4A261);
      border-radius: 3px;
    }

    .rank-fund-percent {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-teal);
      min-width: 50px;
      text-align: right;
    }

    /* Mobile */
    @media (max-width: 900px) {
      .header {
        padding: 16px 20px;
      }

      .header-content {
        flex-wrap: wrap;
        gap: 12px;
      }

      .header-right {
        width: 100%;
        justify-content: space-between;
      }

      .search-box {
        flex: 1;
        width: auto;
      }

      .search-box:focus {
        width: auto;
      }

      .main-content {
        padding: 20px;
      }

      .home-layout {
        grid-template-columns: 1fr;
      }

      .list-layout-wrapper {
        grid-template-columns: 1fr;
      }

      .sector-legend {
        position: static;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        padding: 16px;
      }

      .sector-legend-title {
        width: 100%;
        margin-bottom: 8px;
      }

      .sector-legend-item {
        padding: 4px 0;
      }

      .funds-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }

      .fund-card {
        padding: 16px;
      }

      .fund-card-chart {
        width: 100px;
        height: 100px;
      }

      .fund-card-name {
        font-size: 12px;
      }

      .list-container {
        grid-template-columns: 1fr;
      }

      .list-sidebar {
        position: static;
        max-height: none;
      }

      .detail-view {
        padding: 24px;
      }

      .fund-title {
        font-size: 18px;
        letter-spacing: 2px;
      }

      .ranking-view {
        padding: 24px;
      }

      .ranking-title {
        font-size: 18px;
        letter-spacing: 2px;
      }

      .ranking-table th,
      .ranking-table td {
        padding: 10px 8px;
        font-size: 11px;
      }

      .ranking-table .hide-mobile {
        display: none;
      }

      .rank-funds-panel {
        padding: 12px 16px;
      }

      .rank-fund-bar-wrapper {
        min-width: 100px;
      }

      .rank-fund-name {
        font-size: 12px;
      }
    }
  </style>
</head>

      'SPY': 'ETF', 'QQQ': 'ETF', 'VTI': 'ETF', 'VOO': 'ETF', 'IWM': 'ETF',

      'IBIT': 'ETF', 'ETH': 'ETF', 'XLK': 'ETF', 'IAU': 'ETF', 'GLD': 'ETF',
      'GDX': 'ETF', 'GDXJ': 'ETF', 'EWZ': 'ETF', 'QLTY': 'ETF',
      'LAUR': 'Consumer', 'LOPE': 'Consumer', 'MAA': 'Financial', 'NIQ': 'Technology',
      'AMRZ': 'Financial', 'SE': 'Technology', 'BZ': 'Technology', 'YMM': 'Technology',
      'IRS': 'Financial', 'RAL': 'Other', 'ADES': 'Consumer'
    };

    function getSector(ticker) {
      return SECTOR_MAP[ticker] || 'Other';
    }

    function getSectorColor(ticker) {
      return SECTOR_COLORS[getSector(ticker)];
    }

    function getSectorName(ticker, lang) {
      const sector = getSector(ticker);
      return lang === 'ja' ? (SECTOR_NAMES_JP[sector] || sector) : sector;
    }

    // Language context
    const LangContext = React.createContext('en');

    function SectorLegend() {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];
      const sectors = Object.keys(SECTOR_COLORS);
      return (
        <div className="sector-legend">
          <div className="sector-legend-title">{t.sectorLegend}</div>
          {sectors.map(s => (
            <div key={s} className="sector-legend-item">
              <div className="sector-legend-dot" style={{ background: SECTOR_COLORS[s] }}></div>
              <span className="sector-legend-label">{t[s] || s}</span>
            </div>
          ))}
        </div>
      );
    }

    function App() {
      const [tab, setTab] = React.useState('home');
      const [selected, setSelected] = React.useState(null);
      const [search, setSearch] = React.useState('');
      const [lang, setLang] = React.useState('en');
      const t = I18N[lang];

      const filtered = FUNDS_DATA.filter(f =>
        f.name.toLowerCase().includes(search.toLowerCase()) ||
        f.holdings.some(h => h.ticker.toLowerCase().includes(search.toLowerCase()))
      );

      const [prevTab, setPrevTab] = React.useState('home');

      const handleSelectFund = (fund, fromTab) => {
        setSelected(fund);
        setPrevTab(fromTab || tab);
        setTab('detail');
      };

      const handleBack = () => {
        setSelected(null);
        setTab(prevTab);
      };

      return (
        <LangContext.Provider value={lang}>
          <div>
            <header className="header">
              <div className="header-content">
                <div className="logo">Portfolio Visualizer</div>
                <div className="tabs">
                  <button className={`tab ${tab === 'home' || (tab === 'detail' && prevTab === 'home') ? 'active' : ''}`} onClick={() => { setTab('home'); setSelected(null); }}>{t.home}</button>
                  <button className={`tab ${tab === 'list' ? 'active' : ''}`} onClick={() => setTab('list')}>{t.list}</button>
                  <button className={`tab ${tab === 'ranking' || (tab === 'detail' && prevTab === 'ranking') ? 'active' : ''}`} onClick={() => setTab('ranking')}>{t.ranking}</button>
                </div>
                <div className="header-right">
                  <input type="text" className="search-box" placeholder={t.searchPlaceholder} value={search} onChange={e => setSearch(e.target.value)} />
                  <div className="lang-toggle">
                    <button className={`lang-btn ${lang === 'en' ? 'active' : ''}`} onClick={() => setLang('en')}>EN</button>
                    <button className={`lang-btn ${lang === 'ja' ? 'active' : ''}`} onClick={() => setLang('ja')}>JP</button>
                  </div>
                </div>
              </div>
            </header>
            <main className="main-content">
              {tab === 'home' && <HomeView funds={filtered} onSelect={handleSelectFund} />}
              {tab === 'detail' && selected && <DetailView fund={selected} onBack={handleBack} backLabel={prevTab === 'ranking' ? t.backToRanking : t.backToHome} />}
              {tab === 'list' && <ListView funds={filtered} selected={selected} onSelect={setSelected} />}
              {tab === 'ranking' && <RankingView onSelectFund={(fund) => handleSelectFund(fund, 'ranking')} />}
            </main>
          </div>
        </LangContext.Provider>
      );
    }

    function HomeView({ funds, onSelect }) {
      return (
        <div className="home-layout">
          <div className="funds-grid">
            {funds.map((fund, i) => <FundCard key={i} fund={fund} onClick={() => onSelect(fund)} />)}
          </div>
          <SectorLegend />
        </div>
      );
    }

    function FundCard({ fund, onClick }) {
      const chartRef = React.useRef(null);
      const chartInstance = React.useRef(null);
      const lang = React.useContext(LangContext);
      const t = I18N[lang];

      React.useEffect(() => {
        if (chartInstance.current) chartInstance.current.destroy();
        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: fund.holdings.slice(0, 5).map(h => h.ticker),
            datasets: [{ data: fund.holdings.slice(0, 5).map(h => h.percent), backgroundColor: fund.holdings.slice(0, 5).map(h => getSectorColor(h.ticker)), borderWidth: 2, borderColor: '#fff' }]
          },
          options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false }, tooltip: { enabled: false } }, cutout: '55%', animation: { duration: 0 } }
        });
        return () => chartInstance.current?.destroy();
      }, [fund]);

      return (
        <div className="fund-card" onClick={onClick}>
          <div className="fund-card-chart"><canvas ref={chartRef}></canvas></div>
          <div className="fund-card-name">{fund.name}</div>
          <div className="fund-card-meta">
            <span>{fund.holdings.length} {t.holdings}</span>
            <span>{t.top}: {fund.holdings[0]?.ticker}</span>
          </div>
        </div>
      );
    }

    function ListView({ funds, selected, onSelect }) {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];
      return (
        <div className="list-layout-wrapper">
          <div className="list-container">
            <div className="list-sidebar">
              {funds.map((fund, i) => (
                <div key={i} className={`list-item ${selected?.name === fund.name ? 'active' : ''}`} onClick={() => onSelect(fund)}>{fund.name}</div>
              ))}
            </div>
            <div>{selected ? <DetailView fund={selected} /> : <div className="empty-state"><div className="empty-icon">📊</div><h2>{t.selectFund}</h2><p>{t.selectFundDesc}</p></div>}</div>
          </div>
          <SectorLegend />
        </div>
      );
    }

    function DetailView({ fund, onBack, backLabel }) {
      const chartRef = React.useRef(null);
      const chartInstance = React.useRef(null);
      const lang = React.useContext(LangContext);
      const t = I18N[lang];

      React.useEffect(() => {
        if (chartInstance.current) chartInstance.current.destroy();
        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: fund.holdings.map(h => h.ticker),
            datasets: [{
              data: fund.holdings.map(h => h.percent),
              backgroundColor: fund.holdings.map(h => getSectorColor(h.ticker)),
              borderWidth: 2,
              borderColor: '#fff'
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#264653',
                titleFont: { family: 'Montserrat', weight: '600' },
                bodyFont: { family: 'Montserrat' },
                callbacks: {
                  title: function(items) {
                    return items[0].label + '  ' + items[0].raw.toFixed(1) + '%';
                  },
                  label: function(ctx) {
                    const ticker = fund.holdings[ctx.dataIndex].ticker;
                    return getSectorName(ticker, lang);
                  }
                }
              }
            },
            cutout: '60%'
          }
        });
        return () => chartInstance.current?.destroy();
      }, [fund, lang]);

      return (
        <div className="detail-view">
          {onBack && <button className="back-btn" onClick={onBack}>← {backLabel || t.backToHome}</button>}
          <h1 className="fund-title">{fund.name}</h1>
          <p className="fund-subtitle">{fund.holdings.length} {t.holdings}</p>
          <div className="chart-container"><canvas ref={chartRef}></canvas></div>
          <div className="table-container">
            <table className="holdings-table">
              <thead><tr><th>{t.ticker}</th><th>{t.company}</th><th>{t.sector}</th><th>{t.allocation}</th></tr></thead>
              <tbody>
                {fund.holdings.map((h, i) => {
                  const sector = getSector(h.ticker);
                  const sectorLabel = lang === 'ja' ? (SECTOR_NAMES_JP[sector] || sector) : sector;
                  return (
                    <tr key={i}>
                      <td><span className="ticker">{h.ticker}</span></td>
                      <td>{h.name}</td>
                      <td><span className="sector-badge" style={{ background: SECTOR_COLORS[sector] }}>{sectorLabel}</span></td>
                      <td><div className="percent-bar"><div className="percent-bar-bg"><div className={`percent-bar-fill ${i === 0 ? 'top' : ''}`} style={{ width: `${h.percent}%` }}></div></div><span className="percent-value">{h.percent.toFixed(1)}%</span></div></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function RankingView({ onSelectFund }) {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];
      const [expanded, setExpanded] = React.useState(null);

      const rankings = React.useMemo(() => {
        const tickerMap = {};
        FUNDS_DATA.forEach(fund => {
          fund.holdings.forEach(h => {
            if (!tickerMap[h.ticker]) {
              tickerMap[h.ticker] = { ticker: h.ticker, name: h.name, fundCount: 0, totalWeight: 0, funds: [] };
            }
            tickerMap[h.ticker].fundCount += 1;
            tickerMap[h.ticker].totalWeight += h.percent;
            tickerMap[h.ticker].funds.push({ fund, percent: h.percent });
          });
        });
        const list = Object.values(tickerMap);
        list.forEach(item => {
          item.avgWeight = item.totalWeight / item.fundCount;
          item.funds.sort((a, b) => b.percent - a.percent);
        });
        list.sort((a, b) => b.fundCount - a.fundCount || b.totalWeight - a.totalWeight);
        return list.slice(0, 20);
      }, []);

      const toggleExpand = (ticker) => {
        setExpanded(expanded === ticker ? null : ticker);
      };

      return (
        <div className="ranking-view">
          <h1 className="ranking-title">{t.rankingTitle}</h1>
          <p className="ranking-subtitle">{t.rankingDesc}</p>
          <div className="table-container">
            <table className="ranking-table">
              <thead>
                <tr>
                  <th>{t.rankRank}</th>
                  <th>{t.rankTicker}</th>
                  <th>{t.rankCompany}</th>
                  <th className="hide-mobile">{t.rankSector}</th>
                  <th>{t.rankFunds}</th>
                  <th className="hide-mobile">{t.rankAvgWeight}</th>
                  <th>{t.rankTotalWeight}</th>
                </tr>
              </thead>
              <tbody>
                {rankings.map((item, i) => {
                  const sector = getSector(item.ticker);
                  const sectorLabel = lang === 'ja' ? (SECTOR_NAMES_JP[sector] || sector) : sector;
                  const isExpanded = expanded === item.ticker;
                  return (
                    <React.Fragment key={item.ticker}>
                      <tr className={`rank-row ${isExpanded ? 'expanded' : ''}`} onClick={() => toggleExpand(item.ticker)} style={{ cursor: 'pointer' }}>
                        <td><span className={`rank-number ${i < 3 ? 'top3' : ''}`}>{i + 1}</span></td>
                        <td><span className="ticker">{item.ticker}</span></td>
                        <td>{item.name}</td>
                        <td className="hide-mobile"><span className="sector-badge" style={{ background: SECTOR_COLORS[sector] }}>{sectorLabel}</span></td>
                        <td><span className="rank-funds-count">{item.fundCount}</span></td>
                        <td className="hide-mobile"><span className="rank-weight">{item.avgWeight.toFixed(1)}%</span></td>
                        <td>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                            <span className="rank-weight">{item.totalWeight.toFixed(1)}%</span>
                            <span className="expand-arrow">{isExpanded ? '▲' : '▼'}</span>
                          </div>
                        </td>
                      </tr>
                      {isExpanded && (
                        <tr className="rank-detail-row">
                          <td colSpan="7" style={{ padding: 0 }}>
                            <div className="rank-funds-panel">
                              <div className="rank-funds-header">
                                <span>{t.rankFundName}</span>
                                <span>{t.rankWeight}</span>
                              </div>
                              {item.funds.map((f, fi) => (
                                <div key={fi} className="rank-fund-item" onClick={(e) => { e.stopPropagation(); onSelectFund(f.fund); }}>
                                  <span className="rank-fund-name">{f.fund.name}</span>
                                  <div className="rank-fund-bar-wrapper">
                                    <div className="rank-fund-bar">
                                      <div className="rank-fund-bar-fill" style={{ width: `${Math.min(f.percent, 100)}%` }}></div>
                                    </div>
                                    <span className="rank-fund-percent">{f.percent.toFixed(1)}%</span>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
