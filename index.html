<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Visualizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg-sand: #E8E1D5;
      --primary-teal: #264653;
      --accent-gold: #E9C46A;
      --teal-light: #2A9D8F;
      --teal-dark: #1D3F4A;
      --bp-mobile: 768px;
      --bp-desktop: 1024px;
      --card-radius: 16px;
      --shadow-soft: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-sand);
      color: var(--primary-teal);
      min-height: 100vh;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent-gold);
      outline-offset: 2px;
    }

    .app-shell {
      min-height: 100vh;
    }

    /* Header & Tabs */
    .header {
      background: var(--primary-teal);
      padding: 20px 40px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
    }

    .logo {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      white-space: nowrap;
      flex: 1 1 auto;
      min-width: 0;
      margin: 0 8px 0 14px;
      padding-right: 6px;
    }

    .tabs-area {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      transition: all 0.3s;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      border: none;
      font-family: 'Montserrat', sans-serif;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tab:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .tab.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      flex: 0 0 auto;
      margin-left: 8px;
    }

    .app-shell.mode-mobile .tabs {
      flex-wrap: nowrap;
      width: 100%;
      overflow-x: auto;
      margin: 0;
      padding-right: 0;
    }

    .app-shell.mode-mobile .tabs-area {
      width: 100%;
    }

    .app-shell.mode-mobile .tab {
      flex: 0 0 auto;
      text-align: center;
      min-height: 44px;
    }

    .app-shell.mode-mobile .header-right {
      width: 100%;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 13px;
      width: 210px;
      outline: none;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .search-mode-select {
      padding: 9px 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 12px;
      min-width: 92px;
      font-family: 'Montserrat', sans-serif;
      outline: none;
    }

    .search-mode-select option {
      color: #183440;
    }

    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-box:focus {
      background: rgba(255, 255, 255, 0.2);
      width: 280px;
    }

    .lang-toggle {
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .lang-btn {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.8);
    }

    .lang-btn.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    .data-timestamp {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .tab-refresh-btn {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 8px;
      padding: 0;
      cursor: pointer;
      width: 38px;
      min-width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      text-transform: none;
    }

    .tab-refresh-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .tab-refresh-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .refresh-icon.spinning {
      animation: spin-refresh 1s linear infinite;
    }

    @keyframes spin-refresh {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .refresh-status {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.75);
      white-space: nowrap;
    }

    .refresh-status.error {
      color: #FFD2D2;
    }

    .alert-btn {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 13px;
      min-width: 40px;
    }

    .alert-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .alert-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--accent-gold);
      color: var(--primary-teal);
      font-size: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .alerts-panel {
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      width: min(420px, 95vw);
      max-height: 360px;
      overflow-y: auto;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      padding: 12px;
      z-index: 150;
      color: var(--primary-teal);
    }

    .alerts-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.15);
    }

    .alerts-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .alerts-clear {
      border: none;
      background: transparent;
      color: var(--teal-light);
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }

    .alert-item {
      border: 1px solid rgba(38, 70, 83, 0.12);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(38, 70, 83, 0.03);
      font-size: 12px;
      line-height: 1.5;
    }

    .alert-item.unread {
      border-color: rgba(233, 196, 106, 0.7);
      background: rgba(233, 196, 106, 0.12);
    }

    .watch-btn {
      border: none;
      background: transparent;
      color: rgba(38, 70, 83, 0.5);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .watch-btn:hover {
      background: rgba(233, 196, 106, 0.18);
      color: var(--primary-teal);
    }

    .watch-btn.active {
      color: var(--accent-gold);
      text-shadow: 0 0 1px rgba(0, 0, 0, 0.25);
    }

    .watch-btn.compact {
      font-size: 14px;
      padding: 0;
      margin-left: 6px;
    }

    /* Main Content */
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px;
    }

    .app-shell.mode-desktop .main-content {
      padding: 48px;
    }

    .app-shell.mode-mobile .main-content {
      padding: 20px;
    }

    /* Layout with legend */
    .home-layout {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 32px;
    }

    .home-main {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .home-summary {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      width: fit-content;
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(38, 70, 83, 0.08);
    }

    .home-summary-label {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(38, 70, 83, 0.72);
      font-weight: 700;
    }

    .home-summary-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary-teal);
      line-height: 1;
    }

    .list-layout-wrapper {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 32px;
    }

    /* Sector Legend */
    .sector-legend {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .sector-legend-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-teal);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--bg-sand);
    }

    .sector-legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      font-size: 12px;
      color: var(--primary-teal);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .sector-legend-item:hover {
      background: rgba(38, 70, 83, 0.05);
    }

    .sector-legend-item.active {
      background: var(--accent-gold);
      font-weight: 600;
    }

    .sector-legend-item.dimmed {
      opacity: 0.4;
    }

    .sector-legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .sector-legend-label {
      font-weight: 500;
    }

    /* Home Grid */
    .funds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .fund-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .fund-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(38, 70, 83, 0.15);
    }

    .fund-card-chart {
      width: 140px;
      height: 140px;
      margin-bottom: 16px;
    }

    .fund-card-name {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: var(--primary-teal);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .fund-card-meta {
      font-size: 11px;
      color: var(--teal-light);
      display: flex;
      gap: 12px;
    }

    .fund-card-meta span {
      background: rgba(42, 157, 143, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* List View */
    .list-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 40px;
      min-height: calc(100vh - 140px);
    }

    .list-sidebar {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      height: fit-content;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      position: sticky;
      top: 100px;
    }

    .list-item {
      padding: 14px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
      margin-bottom: 4px;
      border-left: 3px solid transparent;
    }

    .list-item:hover {
      background: rgba(38, 70, 83, 0.05);
    }

    .list-item.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
      font-weight: 600;
      border-left-color: var(--primary-teal);
    }

    /* Detail View */
    .detail-view {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .detail-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 20px;
    }

    .detail-tab {
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(38, 70, 83, 0.08);
      color: var(--primary-teal);
      border: none;
      transition: all 0.2s;
      font-family: 'Montserrat', sans-serif;
    }

    .detail-tab.active {
      background: var(--primary-teal);
      color: #fff;
    }

    .detail-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .detail-sort {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-teal);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail-sort select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid rgba(38, 70, 83, 0.12);
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-teal);
      font-family: 'Montserrat', sans-serif;
      background: #fff;
      cursor: pointer;
    }

    .detail-hint {
      font-size: 11px;
      color: var(--teal-light);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      background: rgba(38, 70, 83, 0.05);
      color: var(--primary-teal);
      border: none;
      margin-bottom: 24px;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .back-btn:hover {
      background: rgba(38, 70, 83, 0.1);
    }

    .fund-title {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-teal);
    }

    .fund-subtitle {
      color: var(--teal-light);
      font-size: 14px;
      margin-bottom: 40px;
    }

    .chart-container {
      max-width: 350px;
      margin: 0 auto 40px;
    }

    .table-container {
      background: var(--bg-sand);
      border-radius: 16px;
      overflow: hidden;
    }

    .holdings-table {
      width: 100%;
      border-collapse: collapse;
    }

    .holdings-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 16px 20px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 600;
    }

    .holdings-table td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.1);
      background: #fff;
    }

    .holdings-table tr:last-child td {
      border-bottom: none;
    }

    .holdings-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .holding-row.match td {
      background: rgba(233, 196, 106, 0.18);
    }

    .holding-row.match td:first-child {
      box-shadow: inset 4px 0 0 var(--accent-gold);
    }

    .holding-row.match .ticker {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    .ticker {
      font-weight: 700;
      color: var(--primary-teal);
      background: rgba(233, 196, 106, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
    }

    .sector-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      white-space: nowrap;
      word-break: keep-all;
      line-height: 1.1;
    }

    .percent-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .percent-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(38, 70, 83, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .percent-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-teal), var(--teal-light));
      border-radius: 4px;
    }

    .percent-bar-fill.top {
      background: linear-gradient(90deg, var(--accent-gold), #F4A261);
    }

    .percent-value {
      font-weight: 600;
      min-width: 50px;
      text-align: right;
    }

    .about-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .profile-card {
      background: var(--bg-sand);
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: inset 0 0 0 1px rgba(38, 70, 83, 0.08);
    }

    .profile-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--teal-light);
      margin-bottom: 6px;
    }

    .profile-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-teal);
      line-height: 1.4;
    }

    .profile-description {
      font-size: 13px;
      line-height: 1.7;
      color: var(--primary-teal);
      margin-top: 12px;
    }

    .read-more {
      border: none;
      background: none;
      color: var(--teal-light);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-top: 6px;
    }

    /* Ranking View */
    .ranking-table-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      overflow: hidden;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
    }

    .ranking-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 16px 20px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 600;
    }

    .ranking-table td {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.08);
      background: #fff;
      font-size: 13px;
    }

    .ranking-table tr:last-child td {
      border-bottom: none;
    }

    .ranking-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .ranking-rank {
      font-weight: 700;
      color: var(--primary-teal);
      font-size: 14px;
    }

    .ranking-rank.top3 {
      color: var(--accent-gold);
    }

    .weight-cell {
      position: relative;
      overflow: hidden;
    }

    .weight-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: rgba(38, 70, 83, 0.1);
      border-radius: 0 4px 4px 0;
      transition: width 0.5s ease;
    }

    .weight-bar.accent {
      background: rgba(42, 157, 143, 0.15);
    }

    .weight-value {
      position: relative;
      z-index: 1;
      font-weight: 600;
      font-size: 13px;
    }

    .ranking-funds-count {
      font-size: 11px;
      color: var(--teal-light);
      background: rgba(42, 157, 143, 0.1);
      padding: 3px 8px;
      border-radius: 10px;
    }

    .ranking-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--primary-teal);
      margin-bottom: 20px;
    }

    .ranking-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .ranking-tab {
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s;
      background: #fff;
      color: var(--primary-teal);
      border: 2px solid rgba(38, 70, 83, 0.12);
      font-family: 'Montserrat', sans-serif;
    }

    .ranking-tab:hover {
      border-color: var(--teal-light);
    }

    .ranking-tab.active {
      background: var(--primary-teal);
      color: #fff;
      border-color: var(--primary-teal);
    }

    .ranking-table tr.clickable {
      cursor: pointer;
    }

    .ranking-table tr.clickable:hover td {
      background: rgba(233, 196, 106, 0.15);
    }

    .ticker-funds-panel {
      background: rgba(38, 70, 83, 0.03);
      border-bottom: 1px solid rgba(38, 70, 83, 0.1);
    }

    .ticker-funds-panel td {
      padding: 0 !important;
      background: transparent !important;
    }

    .ticker-funds-inner {
      margin: 10px 14px 14px;
      padding: 14px 16px;
      border: 1px solid rgba(38, 70, 83, 0.14);
      border-radius: 12px;
      background: #fcfaf6;
    }

    .ticker-funds-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--teal-light);
      margin-bottom: 8px;
    }

    .ticker-fund-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ticker-fund-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid rgba(38, 70, 83, 0.16);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary-teal);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Montserrat', sans-serif;
      white-space: nowrap;
    }

    .ticker-fund-chip:hover {
      background: rgba(233, 196, 106, 0.28);
      border-color: var(--accent-gold);
    }

    .ticker-fund-chip .chip-weight {
      font-weight: 700;
      color: var(--teal-light);
    }

    /* Overlap Analysis */
    .overlap-controls {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .overlap-select-group {
      flex: 1;
      min-width: 240px;
    }

    .overlap-select-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-teal);
      margin-bottom: 8px;
      display: block;
    }

    .overlap-select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid rgba(38, 70, 83, 0.15);
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-teal);
      background: #fff;
      cursor: pointer;
      transition: all 0.3s;
      outline: none;
    }

    .overlap-select:focus {
      border-color: var(--teal-light);
      box-shadow: 0 0 0 3px rgba(42, 157, 143, 0.1);
    }

    .overlap-vs {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-gold);
      padding-top: 20px;
    }

    .overlap-result {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .overlap-summary {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .overlap-stat {
      background: var(--bg-sand);
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
    }

    .overlap-stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-teal);
    }

    .overlap-stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--teal-light);
      margin-top: 4px;
    }

    .overlap-table {
      width: 100%;
      border-collapse: collapse;
    }

    .overlap-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 14px 16px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 11px;
      font-weight: 600;
    }

    .overlap-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.08);
      font-size: 13px;
    }

    .overlap-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .overlap-empty {
      text-align: center;
      padding: 40px;
      color: var(--primary-teal);
      opacity: 0.5;
      font-size: 14px;
    }

    /* Flow / Treemap */
    .flow-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      padding: 32px;
    }

    .treemap-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    .treemap-wrapper svg {
      display: block;
    }

    .treemap-cell rect {
      stroke: var(--bg-sand);
      stroke-width: 2px;
      transition: opacity 0.15s;
    }

    .treemap-cell:hover rect {
      opacity: 0.85;
    }

    .treemap-cell text {
      pointer-events: none;
      font-family: 'Montserrat', sans-serif;
    }

    .treemap-tooltip {
      position: fixed;
      background: var(--primary-teal);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Montserrat', sans-serif;
      pointer-events: none;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      line-height: 1.6;
      max-width: 260px;
    }

    .treemap-tooltip .tt-ticker {
      font-weight: 700;
      font-size: 14px;
    }

    .treemap-tooltip .tt-company {
      opacity: 0.8;
      font-size: 11px;
    }

    .treemap-tooltip .tt-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 4px;
    }

    .treemap-tooltip .tt-change-pos {
      color: #FF6B6B;
      font-weight: 700;
    }

    .treemap-tooltip .tt-change-neg {
      color: #6BCB77;
      font-weight: 700;
    }

    .flow-legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--primary-teal);
    }

    .flow-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flow-legend-swatch {
      width: 28px;
      height: 14px;
      border-radius: 3px;
    }

    .flow-scale {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .flow-scale-bar {
      width: 120px;
      height: 12px;
      border-radius: 3px;
    }

    .flow-scale-label {
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 400px;
      color: var(--primary-teal);
      opacity: 0.6;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    /* View Toggle - Neumorphism Style */
    .view-toggle-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .view-toggle {
      display: flex;
      background: #E8E1D5;
      border-radius: 16px;
      padding: 6px;
      box-shadow: inset 3px 3px 8px rgba(0, 0, 0, 0.08),
        inset -3px -3px 8px rgba(255, 255, 255, 0.9);
    }

    .view-toggle-btn {
      padding: 12px 28px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      background: transparent;
      color: var(--primary-teal);
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .view-toggle-btn:hover {
      color: var(--teal-light);
    }

    .view-toggle-btn.active {
      background: #fff;
      box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.1),
        -2px -2px 6px rgba(255, 255, 255, 0.8);
      color: var(--primary-teal);
    }

    /* Sector Momentum Bar Chart */
    .sector-momentum-container {
      background: #fff;
      border-radius: 16px;
      padding: 24px 32px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .momentum-chart {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .momentum-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      align-items: center;
      gap: 16px;
      height: 40px;
    }

    .momentum-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-teal);
      text-align: right;
    }

    .momentum-bar-wrapper {
      display: flex;
      align-items: center;
      height: 100%;
      position: relative;
    }

    .momentum-bar-center {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(38, 70, 83, 0.2);
      transform: translateX(-50%);
    }

    .momentum-bar {
      height: 28px;
      border-radius: 4px;
      position: absolute;
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
    }

    .momentum-bar.positive {
      left: 50%;
      background: linear-gradient(90deg, #E87B7B, #FF6B6B);
    }

    .momentum-bar.negative {
      right: 50%;
      background: linear-gradient(270deg, #6BCB77, #4CAF50);
    }

    .momentum-score {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      padding: 0 10px;
      white-space: nowrap;
    }

    .momentum-score.positive {
      margin-left: auto;
      padding-right: 10px;
    }

    .momentum-score.negative {
      margin-right: auto;
      padding-left: 10px;
    }

    .watch-container {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-soft);
    }

    .watch-toggle {
      display: inline-flex;
      border-radius: 10px;
      background: rgba(38, 70, 83, 0.08);
      padding: 4px;
      margin-bottom: 16px;
    }

    .watch-toggle-btn {
      border: none;
      background: transparent;
      color: var(--primary-teal);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .watch-toggle-btn.active {
      background: #fff;
      box-shadow: 0 2px 8px rgba(38, 70, 83, 0.16);
    }

    .watch-table {
      width: 100%;
      border-collapse: collapse;
    }

    .watch-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 12px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: left;
    }

    .watch-table td {
      padding: 11px 12px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.08);
      font-size: 13px;
    }

    .watch-table tr:hover td {
      background: rgba(233, 196, 106, 0.12);
    }

    .watch-delta-pos {
      color: #C0392B;
      font-weight: 700;
    }

    .watch-delta-neg {
      color: #1E8449;
      font-weight: 700;
    }

    .watch-detail {
      margin-top: 14px;
      border: 1px solid rgba(38, 70, 83, 0.12);
      border-radius: 10px;
      padding: 14px;
      background: rgba(38, 70, 83, 0.03);
    }

    .watch-detail-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-teal);
    }

    /* Performance */
    .perf-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .perf-card {
      background: var(--bg-sand);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: center;
    }

    .perf-card-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--teal-light);
      margin-bottom: 4px;
    }

    .perf-card-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-teal);
    }

    .perf-card-value.positive { color: #C0392B; }
    .perf-card-value.negative { color: #1E8449; }
    .perf-card-value.na { color: rgba(38,70,83,0.35); font-size: 14px; }

    .perf-chart-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 20px;
    }

    .perf-chart-periods {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .perf-period-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(38,70,83,0.18);
      background: transparent;
      color: var(--primary-teal);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.2s;
    }

    .perf-period-btn:hover { border-color: var(--teal-light); }

    .perf-period-btn.active {
      background: var(--primary-teal);
      color: #fff;
      border-color: var(--primary-teal);
    }

    .perf-toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .perf-toggle-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary-teal);
    }

    .perf-toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      background: rgba(38,70,83,0.2);
      border-radius: 10px;
      cursor: pointer;
      border: none;
      padding: 0;
      transition: background 0.2s;
    }

    .perf-toggle-switch.on { background: var(--teal-light); }

    .perf-toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }

    .perf-toggle-switch.on::after { transform: translateX(16px); }

    .perf-error-box {
      background: rgba(231,76,60,0.08);
      border: 1px solid rgba(231,76,60,0.25);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      color: var(--primary-teal);
      margin-bottom: 16px;
    }

    .perf-error-icon { font-size: 16px; flex-shrink: 0; }

    .perf-error-text { flex: 1; line-height: 1.5; }

    .perf-error-reason {
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }

    .perf-retry-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(38,70,83,0.25);
      background: #fff;
      color: var(--primary-teal);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      margin-top: 8px;
    }

    .perf-retry-btn:hover { background: rgba(38,70,83,0.05); }

    .perf-skeleton {
      background: linear-gradient(90deg, rgba(38,70,83,0.06) 25%, rgba(38,70,83,0.12) 50%, rgba(38,70,83,0.06) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s ease-in-out infinite;
      border-radius: 8px;
    }

    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .perf-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .perf-inline.positive { color: #C0392B; }
    .perf-inline.negative { color: #1E8449; }
    .perf-inline.na { color: rgba(38,70,83,0.35); }

    .perf-sort-select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid rgba(38,70,83,0.12);
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-teal);
      font-family: 'Montserrat', sans-serif;
      background: #fff;
      cursor: pointer;
    }

    .perf-warn-icon {
      color: #E67E22;
      cursor: help;
      font-size: 13px;
      position: relative;
    }

    .perf-warn-tooltip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-teal);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      white-space: nowrap;
      z-index: 50;
      pointer-events: none;
    }

    .settings-container {
      max-width: 700px;
    }

    .settings-section {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 20px;
    }

    .settings-section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-teal);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--bg-sand);
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      font-size: 13px;
    }

    .settings-label {
      font-weight: 600;
      color: var(--primary-teal);
    }

    .settings-desc {
      font-size: 12px;
      color: var(--teal-light);
      margin-top: 4px;
      line-height: 1.5;
    }

    .settings-input {
      padding: 8px 12px;
      border: 2px solid rgba(38,70,83,0.15);
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-teal);
      width: 100%;
      max-width: 400px;
    }

    .settings-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: var(--primary-teal);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
    }

    .settings-btn:hover { opacity: 0.9; }

    .settings-btn.secondary {
      background: transparent;
      border: 2px solid rgba(38,70,83,0.2);
      color: var(--primary-teal);
    }

    .csv-drop-zone {
      border: 2px dashed rgba(38,70,83,0.25);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--teal-light);
      font-size: 13px;
    }

    .csv-drop-zone:hover,
    .csv-drop-zone.drag-over {
      border-color: var(--teal-light);
      background: rgba(42,157,143,0.05);
    }

    .csv-mapping-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .csv-mapping-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-teal);
    }

    .csv-mapping-select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(38,70,83,0.2);
      font-size: 12px;
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-teal);
      width: 100%;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .header {
        padding: 16px 20px;
      }

      .header-content {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .header-right {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .search-box {
        flex: 1;
        width: auto;
        min-width: 180px;
      }

      .tab-refresh-btn {
        width: 40px;
        min-width: 40px;
        height: 40px;
      }

      .search-mode-select {
        min-width: 86px;
      }

      .search-box:focus {
        width: auto;
      }

      .main-content {
        padding: 20px;
      }

      .home-layout {
        grid-template-columns: 1fr;
      }

      .list-layout-wrapper {
        grid-template-columns: 1fr;
      }

      .sector-legend {
        position: static;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        padding: 16px;
      }

      .sector-legend-title {
        width: 100%;
        margin-bottom: 8px;
      }

      .sector-legend-item {
        padding: 4px 0;
      }

      .funds-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
      }

      .fund-card {
        padding: 16px;
      }

      .fund-card-chart {
        width: 100px;
        height: 100px;
      }

      .fund-card-name {
        font-size: 12px;
      }

      .list-container {
        grid-template-columns: 1fr;
      }

      .list-sidebar {
        position: static;
        max-height: none;
      }

      .detail-view {
        padding: 24px;
      }

      .fund-title {
        font-size: 18px;
        letter-spacing: 2px;
      }

      .tab {

    function getNestedValue(source, path) {
      return path.split('.').reduce((acc, key) => (acc && acc[key] !== undefined ? acc[key] : undefined), source);
    }

    function interpolate(template, params) {
      if (!params) return template;
      return template.replace(/\{\{(\w+)\}\}/g, (match, key) => {
        const value = params[key];
        return value !== undefined && value !== null ? value : '';
      });
    }

    function translate(language, key, params) {
      const primary = getNestedValue(LOCALES[language], key);
      const fallback = getNestedValue(LOCALES.en, key);
      const text = typeof primary === 'string' ? primary : (typeof fallback === 'string' ? fallback : '');
      return interpolate(text, params);
    }

    function getInitialLanguage() {
      if (typeof window === 'undefined') return 'en';
      const stored = window.localStorage.getItem('pv_lang');
      if (stored === 'en' || stored === 'ja') return stored;
      const browser = (navigator.language || '').toLowerCase();
      return browser.startsWith('ja') ? 'ja' : 'en';
    }

    function getInitialWatchlist() {
      if (typeof window === 'undefined') return { tickers: [], funds: [] };
      try {
        const parsed = JSON.parse(window.localStorage.getItem(WATCHLIST_STORAGE_KEY) || '{}');
        const tickers = Array.isArray(parsed.tickers) ? parsed.tickers.map(normalizeTicker).filter(Boolean) : [];
        const funds = Array.isArray(parsed.funds) ? parsed.funds.map(v => String(v || '').trim()).filter(Boolean) : [];
        return {
          tickers: Array.from(new Set(tickers)),
          funds: Array.from(new Set(funds))
        };
      } catch (err) {
        return { tickers: [], funds: [] };
      }
    }

    function getInitialReadAlerts() {
      if (typeof window === 'undefined') return [];
      try {
        const parsed = JSON.parse(window.localStorage.getItem(ALERT_READ_STORAGE_KEY) || '[]');
        if (!Array.isArray(parsed)) return [];
        return parsed.map(v => String(v || '')).filter(Boolean);
      } catch (err) {
        return [];
      }
    }

    function resolveLocalizedValue(value, language) {
      if (!value) return '';
      if (typeof value === 'string') return value;
      if (typeof value === 'object') return value[language] || value.en || '';
      return '';
    }

    const I18nContext = React.createContext({
      language: 'en',
      setLanguage: () => {},
      t: (key, params) => translate('en', key, params)
    });

    function useI18n() {
      return React.useContext(I18nContext);
    }

    function normalizeTicker(value) {
      return String(value || '').trim().toUpperCase();
    }

    function normalizeSearchText(value) {
      return String(value || '').trim();
    }

    function normalizeTickerMap(raw) {
      const map = {};
      if (!raw || typeof raw !== 'object') return map;
      Object.entries(raw).forEach(([key, value]) => {
        const normalizedKey = normalizeTicker(key);
        const normalizedValue = normalizeTicker(value);
        if (!normalizedKey || !normalizedValue) return;
        map[normalizedKey] = normalizedValue;
        if (/^\d{1,8}$/.test(normalizedKey)) {
          map[normalizedKey.padStart(9, '0')] = normalizedValue;
        }
      });
      return map;
    }

    function isCusipLike(value) {
      const key = normalizeTicker(value);
      if (!key) return false;
      if (!/^[0-9A-Z]{8,9}$/.test(key)) return false;
      return /\d/.test(key);
    }

    function mapCusipToTicker(value) {
      const key = normalizeTicker(value);
      if (!key) return '';
      if (!isCusipLike(key)) return key;
      if (TICKER_MAP[key]) return TICKER_MAP[key];
      const padded = key.padStart(9, '0');
      if (TICKER_MAP[padded]) return TICKER_MAP[padded];
      const trimmed = key.replace(/^0+/, '');
      if (trimmed && TICKER_MAP[trimmed]) return TICKER_MAP[trimmed];
      return key;
    }

    function shouldUseManualHoldings(currentHoldings, manualHoldings) {
      if (!Array.isArray(manualHoldings) || manualHoldings.length === 0) return false;
      if (!Array.isArray(currentHoldings) || currentHoldings.length === 0) return true;
      const cusipCount = currentHoldings.filter((h) => isCusipLike(h?.ticker)).length;
      return cusipCount / currentHoldings.length >= MANUAL_CUSIP_THRESHOLD;
    }

    function mergeManualHoldings(funds, manualFunds) {
      if (!Array.isArray(funds)) return [];
      const manualMap = new Map(
        (manualFunds || []).map((fund) => [String(fund?.name || '').trim(), fund])
      );
      return funds.map((fund) => {
        const name = String(fund?.name || '').trim();
        const manualFund = manualMap.get(name);
        if (manualFund && shouldUseManualHoldings(fund?.holdings, manualFund?.holdings)) {
          return { ...fund, holdings: manualFund.holdings };
        }
        return fund;
      });
    }

    function normalizeHoldings(rawHoldings) {
      if (!Array.isArray(rawHoldings)) return [];
      const map = new Map();
      for (const holding of rawHoldings) {
        const ticker = mapCusipToTicker(holding?.ticker);
        if (!ticker) continue;
        const percentValue = Number(holding?.percent);
        const percent = Number.isFinite(percentValue) ? percentValue : 0;
        const existing = map.get(ticker);
        if (!existing) {
          map.set(ticker, {
            ticker,
            name: holding?.name || '',
            sector: holding?.sector || '',
            percent,
            _maxPercent: percent
          });
        } else {
          existing.percent += percent;
          if ((!existing.name && holding?.name) || percent > existing._maxPercent) {
            existing.name = holding?.name || existing.name;
            existing.sector = holding?.sector || existing.sector;
          }
          if (percent > existing._maxPercent) existing._maxPercent = percent;
        }
      }
      const aggregated = Array.from(map.values()).map(({ _maxPercent, ...rest }) => rest);
      aggregated.sort((a, b) => b.percent - a.percent);
      return aggregated;
    }

    function normalizeFunds(rawFunds) {
      if (!Array.isArray(rawFunds)) return [];
      return rawFunds.map(fund => ({
        ...fund,
        holdings: normalizeHoldings(fund?.holdings)
      }));
    }

    function isTickerLikeQuery(value) {
      const query = normalizeTicker(value);
      if (!query) return false;
      if (!/^[A-Z0-9.\-]+$/.test(query)) return false;
      if (query.length > 8) return false;
      return !/\s/.test(String(value || ''));
    }

      if (mode === 'fund') return 'fund';
      if (mode === 'ticker') return 'ticker';
      return isTickerLikeQuery(query) ? 'ticker' : 'fund';
    }

    function matchesTicker(ticker, query, mode) {
      const intent = resolveSearchIntent(query, mode);
      if (intent !== 'ticker') return false;
      return normalizeTicker(ticker) === normalizeTicker(query);
    }

    function matchesFundName(name, query, mode) {
      const intent = resolveSearchIntent(query, mode);
      if (intent !== 'fund') return false;
      return String(name || '').toLowerCase().includes(normalizeSearchText(query).toLowerCase());
    }

      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      const locale = language === 'ja' ? 'ja-JP' : 'en-US';
      return date.toLocaleString(locale, {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

      const text = String(error || '').trim();
      if (!text) return t('refresh.failed');
      if (text.includes('Missing GITHUB_REFRESH_TOKEN') || text.includes('Missing GITHUB_TOKEN')) {
        return t('refresh.errMissingToken');
      }
      if (text.includes('Unauthorized')) {
        return t('refresh.errUnauthorized');
      }
      if (text.includes('GitHub dispatch failed')) {

      }
      const compact = text.length > 42 ? `${text.slice(0, 42)}...` : text;
      return t('refresh.failedReason', { reason: compact });

      if (abs >= 1e9) return `$${(valueUsd / 1e9).toFixed(1)}B`;

    // --- Performance Metrics Calculation ---
    function computeMetrics(priceSeries) {
      if (!priceSeries || priceSeries.length < 2) return null;

      // Filter invalid prices
      const valid = priceSeries
        .filter(p => p && p.date && typeof p.price === 'number' && p.price > 0)
        .sort((a, b) => new Date(a.date) - new Date(b.date));

      if (valid.length < 2) return null;

      const firstDate = new Date(valid[0].date);
      const lastDate = new Date(valid[valid.length - 1].date);
      const firstPrice = valid[0].price;
      const lastPrice = valid[valid.length - 1].price;

      // Daily returns
      const dailyReturns = [];
      for (let i = 1; i < valid.length; i++) {
        const ret = (valid[i].price - valid[i - 1].price) / valid[i - 1].price;
        dailyReturns.push(ret);
      }

      // Total Return for period
      function totalReturnSince(startDate) {
        const startPoint = findAsOfPoint(valid, startDate);
        if (!startPoint) return null;
        return (lastPrice - startPoint.price) / startPoint.price;
      }

      // Find as-of point (closest past date)
      function findAsOfPoint(series, targetDate) {
        const target = new Date(targetDate).getTime();
        let best = null;
        for (const p of series) {
          const d = new Date(p.date).getTime();
          if (d <= target) {
            if (!best || d > new Date(best.date).getTime()) best = p;
          }
        }
        return best;
      }

      const now = lastDate;
      const y = now.getFullYear();
      const m = now.getMonth();
      const d = now.getDate();

      const date1M = new Date(y, m - 1, d);
      const date3M = new Date(y, m - 3, d);
      const date6M = new Date(y, m - 6, d);
      const date1Y = new Date(y - 1, m, d);
      const dateYTD = new Date(y, 0, 1);

      const totalReturn = {
        '1M': totalReturnSince(date1M),
        '3M': totalReturnSince(date3M),
        '6M': totalReturnSince(date6M),
        '1Y': totalReturnSince(date1Y),
        'YTD': totalReturnSince(dateYTD),
        'MAX': (lastPrice - firstPrice) / firstPrice
      };

      // Annualized Return (1Y+ only)
      const totalDays = (lastDate - firstDate) / (1000 * 60 * 60 * 24);
      const totalYears = totalDays / 365.25;
      const annualizedReturn = totalYears >= 1
        ? Math.pow(lastPrice / firstPrice, 1 / totalYears) - 1
        : null;

      // Volatility (annualized, daily returns * sqrt(252))
      let volatility = null;
      if (dailyReturns.length >= 5) {
        const mean = dailyReturns.reduce((s, r) => s + r, 0) / dailyReturns.length;
        const variance = dailyReturns.reduce((s, r) => s + (r - mean) ** 2, 0) / (dailyReturns.length - 1);
        volatility = Math.sqrt(variance) * Math.sqrt(TRADING_DAYS_PER_YEAR);
      }

      // Max Drawdown
      let maxDrawdown = 0;
      let peak = valid[0].price;
      for (const p of valid) {
        if (p.price > peak) peak = p.price;
        const dd = (p.price - peak) / peak;
        if (dd < maxDrawdown) maxDrawdown = dd;
      }

      // Sharpe Ratio (rf=0)
      let sharpe = null;
      if (annualizedReturn !== null && volatility !== null && volatility > 0) {
        sharpe = annualizedReturn / volatility;
      }

      return {
        totalReturn,
        annualizedReturn,
        volatility,
        maxDrawdown,
        sharpe,
        firstDate: valid[0].date,
        lastDate: valid[valid.length - 1].date,
        dataPoints: valid.length
      };
    }

    function formatPercent(value) {
      if (value === null || value === undefined || !Number.isFinite(value)) return null;
      const pct = value * 100;
      const sign = pct >= 0 ? '+' : '';
      return `${sign}${pct.toFixed(1)}%`;
    }

    function formatRatio(value) {
      if (value === null || value === undefined || !Number.isFinite(value)) return null;
      return value.toFixed(2);
    }

    // --- Stooq CSV Parser ---
    function parseStooqCsv(csvText) {
      const lines = csvText.trim().split('\n');
      if (lines.length < 2) return [];
      const header = lines[0].toLowerCase();
      if (!header.includes('date') || !header.includes('close')) return [];
      const cols = lines[0].split(',').map(c => c.trim().toLowerCase());
      const dateIdx = cols.indexOf('date');
      const closeIdx = cols.indexOf('close');
      if (dateIdx < 0 || closeIdx < 0) return [];

      const series = [];
      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(',');
        if (parts.length <= Math.max(dateIdx, closeIdx)) continue;
        const date = parts[dateIdx].trim();
        const price = parseFloat(parts[closeIdx].trim());
        if (!date || isNaN(price) || price <= 0) continue;
        series.push({ date, price });
      }
      return series.sort((a, b) => new Date(a.date) - new Date(b.date));
    }

    // --- Broker CSV Parser (generic) ---
    function parseBrokerCsv(csvText, columnMapping) {
      const lines = csvText.trim().split('\n');
      if (lines.length < 2) return [];
      const headers = lines[0].split(',').map(c => c.trim());
      const dateCol = columnMapping?.date || headers.find(h => /date|日付/i.test(h));
      const priceCol = columnMapping?.price || headers.find(h => /price|基準価額|nav|終値/i.test(h));
      const tickerCol = columnMapping?.ticker || headers.find(h => /ticker|銘柄|ファンド|fund/i.test(h));

      if (!dateCol || !priceCol) return [];
      const dateIdx = headers.indexOf(dateCol);
      const priceIdx = headers.indexOf(priceCol);
      const tickerIdx = tickerCol ? headers.indexOf(tickerCol) : -1;

      const records = [];
      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(',');
        const date = parts[dateIdx]?.trim();
        const price = parseFloat(parts[priceIdx]?.trim());
        const ticker = tickerIdx >= 0 ? parts[tickerIdx]?.trim() : '';
        if (!date || isNaN(price) || price <= 0) continue;
        records.push({ date, price, ticker });
      }
      return records.sort((a, b) => new Date(a.date) - new Date(b.date));
    }

    // --- Data Status Types ---
    const DATA_STATUS = {
      OK: 'OK',

      FETCH_ERROR: 'FETCH_ERROR',
      RATE_LIMIT: 'RATE_LIMIT',
      UNSUPPORTED: 'UNSUPPORTED'
    };

    function makeDataError(status, message, provider) {
      return { status, message, provider: provider || null };
    }

    function toStooqSymbol(ticker) {
      const raw = normalizeTicker(ticker);
      if (!raw) return '';
      if (!/^[A-Z0-9.\-]+$/.test(raw)) return '';
      const parts = raw.split('.');
      if (parts.length === 2 && /^[A-Z]{2,3}$/.test(parts[1])) {
        const base = parts[0].replace(/\./g, '-').toLowerCase();
        return `${base}.${parts[1].toLowerCase()}`;
      }
      const base = raw.replace(/\./g, '-').toLowerCase();
      return `${base}.us`;
    }

    // --- Stooq Provider ---
    async function fetchStooqPriceSeries(ticker) {
      const symbol = toStooqSymbol(ticker);
      if (!symbol) {
        return { series: null, error: makeDataError(DATA_STATUS.FETCH_ERROR, 'Invalid ticker symbol', 'stooq') };
      }
      try {
        const res = await fetch(`/api/stooq-proxy?s=${encodeURIComponent(symbol)}`);
        if (res.status === 429) {
          return { series: null, error: makeDataError(DATA_STATUS.RATE_LIMIT, 'Rate limited', 'stooq') };
        }
        if (res.status === 404) {
          const body = await res.json().catch(() => ({}));
          return { series: null, error: makeDataError(DATA_STATUS.FETCH_ERROR, body.error || 'No data', 'stooq') };
        }
        if (res.status === 503) {
          const body = await res.json().catch(() => ({}));
          return { series: null, error: makeDataError(DATA_STATUS.RATE_LIMIT, body.error || 'CAPTCHA', 'stooq') };
        }
        if (!res.ok) {
          return { series: null, error: makeDataError(DATA_STATUS.FETCH_ERROR, `HTTP ${res.status}`, 'stooq') };
        }
        const csv = await res.text();
        const series = parseStooqCsv(csv);
        if (series.length === 0) {
          return { series: null, error: makeDataError(DATA_STATUS.FETCH_ERROR, 'Empty or invalid CSV response', 'stooq') };
        }
        return { series, error: null };
      } catch (err) {
        return { series: null, error: makeDataError(DATA_STATUS.FETCH_ERROR, String(err?.message || err), 'stooq') };
      }
    }

    // --- MUFG AM NAV Provider (placeholder - requires user config) ---
    async function fetchMufgNavSeries(fundCode, endpoint) {
      if (!endpoint) {
        return { series: null, error: makeDataError(DATA_STATUS.PROVIDER_UNAVAILABLE, 'MUFG AM API endpoint not configured', 'mufg') };
      }
      try {
        const res = await fetch(`${endpoint}?fundCode=${encodeURIComponent(fundCode)}`);
        if (!res.ok) {
          return { series: null, error: makeDataError(DATA_STATUS.FETCH_ERROR, `HTTP ${res.status}`, 'mufg') };
        }
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          return { series: null, error: makeDataError(DATA_STATUS.FETCH_ERROR, 'No NAV data returned', 'mufg') };
        }
        const series = data
          .map(d => ({ date: d.date, price: Number(d.nav || d.price) }))
          .filter(d => d.date && d.price > 0)
          .sort((a, b) => new Date(a.date) - new Date(b.date));
        return { series: series.length > 0 ? series : null, error: series.length > 0 ? null : makeDataError(DATA_STATUS.FETCH_ERROR, 'Invalid NAV data', 'mufg') };
      } catch (err) {
        return { series: null, error: makeDataError(DATA_STATUS.FETCH_ERROR, String(err?.message || err), 'mufg') };
      }
    }

    // --- CSV Import Provider ---
    function getCsvPriceSeries(ticker) {
      const imported = getCsvImportData();
      if (!imported || !imported.records) return { series: null, error: makeDataError(DATA_STATUS.UNSUPPORTED, 'No CSV data imported', 'csv') };
      const matching = imported.records.filter(r =>
        !ticker || !r.ticker || r.ticker.toUpperCase() === ticker.toUpperCase()
      );
      if (matching.length < 2) {
        return { series: null, error: makeDataError(DATA_STATUS.FETCH_ERROR, 'Insufficient CSV data for this ticker', 'csv') };
      }
      return { series: matching.map(r => ({ date: r.date, price: r.price })), error: null };
    }

    // --- MarketDataFacade ---
    function resolveTickersForFund(fund) {
      if (!fund || !fund.holdings || fund.holdings.length === 0) return [];
      return fund.holdings
        .map(h => normalizeTicker(h.ticker))
        .filter(Boolean)
        .filter((v, i, arr) => arr.indexOf(v) === i);
    }

    // Per-ticker price cache in memory (session only)
    const priceSeriesCache = new Map();

    async function fetchTickerPriceSeries(ticker, settings) {
      const cacheKey = `stooq:${ticker}`;
      if (priceSeriesCache.has(cacheKey)) return priceSeriesCache.get(cacheKey);

      // Try Stooq for equities/ETFs
      const stooqEnabled = settings?.stooqEnabled !== false;
      if (stooqEnabled) {
        const result = await fetchStooqPriceSeries(ticker);
        if (result.series) {
          priceSeriesCache.set(cacheKey, result);
        }
        return result;
      }

      return { series: null, error: makeDataError(DATA_STATUS.PROVIDER_UNAVAILABLE, 'No provider enabled', null) };
    }

    // --- Price Series Filtering by Period ---
    function filterSeriesByPeriod(series, period) {
      if (!series || series.length === 0) return series;
      const last = new Date(series[series.length - 1].date);
      const y = last.getFullYear();
      const m = last.getMonth();
      const d = last.getDate();
      let startDate;
      switch (period) {
        case '1M': startDate = new Date(y, m - 1, d); break;
        case '3M': startDate = new Date(y, m - 3, d); break;
        case '6M': startDate = new Date(y, m - 6, d); break;
        case '1Y': startDate = new Date(y - 1, m, d); break;
        case 'YTD': startDate = new Date(y, 0, 1); break;
        case 'MAX': default: return series;
      }
      const startTime = startDate.getTime();
      return series.filter(p => new Date(p.date).getTime() >= startTime);
    }

    // --- Performance for a single ticker (top holding representative) ---
    function useTickerPerformance(ticker, retryKey) {
      const [state, setState] = React.useState({ loading: false, series: null, metrics: null, error: null });

      React.useEffect(() => {
        if (!ticker) {
          setState({ loading: false, series: null, metrics: null, error: makeDataError(DATA_STATUS.MISSING_MAPPING, 'No ticker', null) });
          return;
        }
        let cancelled = false;
        setState(prev => ({ ...prev, loading: true, error: null }));
        const settings = getDataSourceSettings();

        fetchTickerPriceSeries(ticker, settings).then(result => {
          if (cancelled) return;
          if (result.error) {
            setState({ loading: false, series: null, metrics: null, error: result.error });
          } else {
            const metrics = computeMetrics(result.series);
            setState({ loading: false, series: result.series, metrics, error: null });
          }
        });

        return () => { cancelled = true; };
      }, [ticker, retryKey]);

      return state;
    }

    // --- Fund Performance Sort Logic ---
    function useFundPerformanceSort(funds) {
      const [sortKey, setSortKey] = React.useState('default');
      const [perfCache, setPerfCache] = React.useState(new Map());
      const [loadingTickers, setLoadingTickers] = React.useState(new Set());
      const perfCacheRef = React.useRef(perfCache);
      const loadingTickersRef = React.useRef(loadingTickers);
      const MAX_PERF_FETCH_CONCURRENCY = 6;

      React.useEffect(() => {
        perfCacheRef.current = perfCache;
      }, [perfCache]);

      React.useEffect(() => {
        loadingTickersRef.current = loadingTickers;
      }, [loadingTickers]);

      // Extract top ticker for each fund (representative performance)
      const fundTopTickers = React.useMemo(() => {
        const map = new Map();
        (funds || []).forEach(fund => {
          const top = fund.holdings?.[0]?.ticker;
          if (top) map.set(fund.name, normalizeTicker(top));
        });
        return map;
      }, [funds]);

      const loadTickerMetrics = React.useCallback((tickers, settings) => {
        const uniqueTickers = [...new Set(tickers)].filter(Boolean);
        const toLoad = uniqueTickers.filter((ticker) =>
          !perfCacheRef.current.has(ticker) && !loadingTickersRef.current.has(ticker)
        );

        if (toLoad.length === 0) return () => {};

        setLoadingTickers((prev) => {
          const next = new Set(prev);
          toLoad.forEach((ticker) => next.add(ticker));
          loadingTickersRef.current = next;
          return next;
        });

        let cancelled = false;
        const queue = [...toLoad];
        const workers = Array.from(
          { length: Math.min(MAX_PERF_FETCH_CONCURRENCY, queue.length) },
          async () => {
            while (!cancelled) {
              const ticker = queue.shift();
              if (!ticker) break;
              const result = await fetchTickerPriceSeries(ticker, settings);
              if (cancelled) break;
              const metrics = result.series ? computeMetrics(result.series) : null;
              setPerfCache((prev) => {
                const next = new Map(prev);
                next.set(ticker, { metrics, error: result.error });
                perfCacheRef.current = next;
                return next;
              });
              setLoadingTickers((prev) => {
                const next = new Set(prev);
                next.delete(ticker);
                loadingTickersRef.current = next;
                return next;
              });
            }
          }
        );

        Promise.all(workers).catch(() => {});
        return () => { cancelled = true; };
      }, []);

      // Warm cache in background so first performance sort feels instant.
      React.useEffect(() => {
        const settings = getDataSourceSettings();
        const tickers = [...fundTopTickers.values()];
        return loadTickerMetrics(tickers, settings);
      }, [fundTopTickers, loadTickerMetrics]);

      const sortedFunds = React.useMemo(() => {
        if (!funds) return funds;
        if (sortKey === 'default') {
          return [...funds].sort((a, b) => {
            const countA = a?.holdings?.length || 0;
            const countB = b?.holdings?.length || 0;
            if (countB !== countA) return countB - countA;
            return String(a?.name || '').localeCompare(String(b?.name || ''));
          });
        }

        return [...funds].sort((a, b) => {
          const tickerA = fundTopTickers.get(a.name);
          const tickerB = fundTopTickers.get(b.name);
          const perfA = tickerA ? perfCache.get(tickerA)?.metrics : null;
          const perfB = tickerB ? perfCache.get(tickerB)?.metrics : null;

          // No data goes to end
          if (!perfA && !perfB) return 0;
          if (!perfA) return 1;
          if (!perfB) return -1;

          let valA, valB;
          switch (sortKey) {
            case '1Y': valA = perfA.totalReturn['1Y']; valB = perfB.totalReturn['1Y']; break;
            case '6M': valA = perfA.totalReturn['6M']; valB = perfB.totalReturn['6M']; break;
            case '3M': valA = perfA.totalReturn['3M']; valB = perfB.totalReturn['3M']; break;
            case '1M': valA = perfA.totalReturn['1M']; valB = perfB.totalReturn['1M']; break;
            case 'YTD': valA = perfA.totalReturn['YTD']; valB = perfB.totalReturn['YTD']; break;
            case 'sharpe': valA = perfA.sharpe; valB = perfB.sharpe; break;
            case 'mdd':
              valA = perfA.maxDrawdown; valB = perfB.maxDrawdown;
              // Higher (less negative) is better for MDD
              if (valA === null && valB === null) return 0;
              if (valA === null) return 1;
              if (valB === null) return -1;
              return valB - valA; // ascending: less negative is better
            case 'vol':
              valA = perfA.volatility; valB = perfB.volatility;
              if (valA === null && valB === null) return 0;
              if (valA === null) return 1;
              if (valB === null) return -1;
              return valA - valB; // ascending: lower is better
            default: return 0;
          }

          if (valA === null && valB === null) return 0;
          if (valA === null) return 1;
          if (valB === null) return -1;
          return valB - valA; // descending for returns and sharpe
        });
      }, [funds, sortKey, perfCache, fundTopTickers]);

      return { sortedFunds, sortKey, setSortKey, perfCache, fundTopTickers };
    }

    function SectorLegend({ activeSector, onSectorClick }) {
      const { t } = useI18n();
      const sectors = Object.keys(SECTOR_COLORS);
      return (
        <div className="sector-legend">
          <div className="sector-legend-title">{t('common.sectorLegend')}</div>
          {sectors.map(s => {
            const isActive = activeSector === s;
            const isDimmed = activeSector && !isActive;
            return (
              <div key={s}
                className={`sector-legend-item ${isActive ? 'active' : ''} ${isDimmed ? 'dimmed' : ''}`}
                onClick={() => onSectorClick ? onSectorClick(isActive ? null : s) : null}>
                <div className="sector-legend-dot" style={{ background: SECTOR_COLORS[s] }}></div>
                <span className="sector-legend-label">{t(`sector.${s}`) || s}</span>
              </div>
            );
          })}
        </div>
