<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Visualizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg-sand: #E8E1D5;
      --primary-teal: #264653;
      --accent-gold: #E9C46A;
      --teal-light: #2A9D8F;
      --teal-dark: #1D3F4A;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-sand);
      color: var(--primary-teal);
      min-height: 100vh;
    }

    /* Header & Tabs */
    .header {
      background: var(--primary-teal);
      padding: 20px 40px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      gap: 8px;
    }

    .tab {
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      border: none;
      font-family: 'Montserrat', sans-serif;
    }

    .tab:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .tab.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search-box {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 13px;
      width: 220px;
      outline: none;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-box:focus {
      background: rgba(255, 255, 255, 0.2);
      width: 280px;
    }

    .lang-toggle {
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .lang-btn {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5);
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .lang-btn:hover {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8);
    }

    .lang-btn.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
    }

    .data-timestamp {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* Main Content */
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px;
    }

    /* Layout with legend */
    .home-layout {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 32px;
    }

    .list-layout-wrapper {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 32px;
    }

    /* Sector Legend */
    .sector-legend {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .sector-legend-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-teal);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--bg-sand);
    }

    .sector-legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      font-size: 12px;
      color: var(--primary-teal);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .sector-legend-item:hover {
      background: rgba(38, 70, 83, 0.05);
    }

    .sector-legend-item.active {
      background: var(--accent-gold);
      font-weight: 600;
    }

    .sector-legend-item.dimmed {
      opacity: 0.4;
    }

    .sector-legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .sector-legend-label {
      font-weight: 500;
    }

    /* Home Grid */
    .funds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .fund-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .fund-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(38, 70, 83, 0.15);
    }

    .fund-card-chart {
      width: 140px;
      height: 140px;
      margin-bottom: 16px;
    }

    .fund-card-name {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: var(--primary-teal);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .fund-card-meta {
      font-size: 11px;
      color: var(--teal-light);
      display: flex;
      gap: 12px;
    }

    .fund-card-meta span {
      background: rgba(42, 157, 143, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* List View */
    .list-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 40px;
      min-height: calc(100vh - 140px);
    }

    .list-sidebar {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      height: fit-content;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      position: sticky;
      top: 100px;
    }

    .list-item {
      padding: 14px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
      margin-bottom: 4px;
      border-left: 3px solid transparent;
    }

    .list-item:hover {
      background: rgba(38, 70, 83, 0.05);
    }

    .list-item.active {
      background: var(--accent-gold);
      color: var(--primary-teal);
      font-weight: 600;
      border-left-color: var(--primary-teal);
    }

    /* Detail View */
    .detail-view {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      background: rgba(38, 70, 83, 0.05);
      color: var(--primary-teal);
      border: none;
      margin-bottom: 24px;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .back-btn:hover {
      background: rgba(38, 70, 83, 0.1);
    }

    .fund-title {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-teal);
    }

    .fund-subtitle {
      color: var(--teal-light);
      font-size: 14px;
      margin-bottom: 40px;
    }

    .chart-container {
      max-width: 350px;
      margin: 0 auto 40px;
    }

    .table-container {
      background: var(--bg-sand);
      border-radius: 16px;
      overflow: hidden;
    }

    .holdings-table {
      width: 100%;
      border-collapse: collapse;
    }

    .holdings-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 16px 20px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 600;
    }

    .holdings-table td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.1);
      background: #fff;
    }

    .holdings-table tr:last-child td {
      border-bottom: none;
    }

    .holdings-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .ticker {
      font-weight: 700;
      color: var(--primary-teal);
      background: rgba(233, 196, 106, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
    }

    .sector-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      color: #fff;
      display: inline-block;
      margin-left: 8px;
    }

    .percent-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .percent-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(38, 70, 83, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .percent-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-teal), var(--teal-light));
      border-radius: 4px;
    }

    .percent-bar-fill.top {
      background: linear-gradient(90deg, var(--accent-gold), #F4A261);
    }

    .percent-value {
      font-weight: 600;
      min-width: 50px;
      text-align: right;
    }

    /* Ranking View */
    .ranking-table-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      overflow: hidden;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
    }

    .ranking-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 16px 20px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 600;
    }

    .ranking-table td {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.08);
      background: #fff;
      font-size: 13px;
    }

    .ranking-table tr:last-child td {
      border-bottom: none;
    }

    .ranking-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .ranking-rank {
      font-weight: 700;
      color: var(--primary-teal);
      font-size: 14px;
    }

    .ranking-rank.top3 {
      color: var(--accent-gold);
    }

    .weight-cell {
      position: relative;
      overflow: hidden;
    }

    .weight-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: rgba(38, 70, 83, 0.1);
      border-radius: 0 4px 4px 0;
      transition: width 0.5s ease;
    }

    .weight-bar.accent {
      background: rgba(42, 157, 143, 0.15);
    }

    .weight-value {
      position: relative;
      z-index: 1;
      font-weight: 600;
      font-size: 13px;
    }

    .ranking-funds-count {
      font-size: 11px;
      color: var(--teal-light);
      background: rgba(42, 157, 143, 0.1);
      padding: 3px 8px;
      border-radius: 10px;
    }

    .ranking-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--primary-teal);
      margin-bottom: 20px;
    }

    .ranking-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .ranking-tab {
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s;
      background: #fff;
      color: var(--primary-teal);
      border: 2px solid rgba(38, 70, 83, 0.12);
      font-family: 'Montserrat', sans-serif;
    }

    .ranking-tab:hover {
      border-color: var(--teal-light);
    }

    .ranking-tab.active {
      background: var(--primary-teal);
      color: #fff;
      border-color: var(--primary-teal);
    }

    .ranking-table tr.clickable {
      cursor: pointer;
    }

    .ranking-table tr.clickable:hover td {
      background: rgba(233, 196, 106, 0.15);
    }

    .ticker-funds-panel {
      background: var(--bg-sand);
      border-radius: 0 0 12px 12px;
    }

    .ticker-funds-panel td {
      padding: 0 !important;
      background: transparent !important;
    }

    .ticker-funds-inner {
      padding: 12px 20px 16px 60px;
    }

    .ticker-funds-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--teal-light);
      margin-bottom: 8px;
    }

    .ticker-fund-chip {
      display: inline-block;
      background: #fff;
      border: 1px solid rgba(38, 70, 83, 0.1);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 500;
      color: var(--primary-teal);
      margin: 3px 4px 3px 0;
      transition: all 0.2s;
    }

    .ticker-fund-chip:hover {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    .ticker-fund-chip .chip-weight {
      font-weight: 700;
      color: var(--teal-light);
      margin-left: 6px;
    }

    /* Overlap Analysis */
    .overlap-controls {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .overlap-select-group {
      flex: 1;
      min-width: 240px;
    }

    .overlap-select-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-teal);
      margin-bottom: 8px;
      display: block;
    }

    .overlap-select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid rgba(38, 70, 83, 0.15);
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-teal);
      background: #fff;
      cursor: pointer;
      transition: all 0.3s;
      outline: none;
    }

    .overlap-select:focus {
      border-color: var(--teal-light);
      box-shadow: 0 0 0 3px rgba(42, 157, 143, 0.1);
    }

    .overlap-vs {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-gold);
      padding-top: 20px;
    }

    .overlap-result {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
    }

    .overlap-summary {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .overlap-stat {
      background: var(--bg-sand);
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
    }

    .overlap-stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-teal);
    }

    .overlap-stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--teal-light);
      margin-top: 4px;
    }

    .overlap-table {
      width: 100%;
      border-collapse: collapse;
    }

    .overlap-table th {
      background: var(--primary-teal);
      color: #fff;
      padding: 14px 16px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 11px;
      font-weight: 600;
    }

    .overlap-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(38, 70, 83, 0.08);
      font-size: 13px;
    }

    .overlap-table tr:hover td {
      background: rgba(233, 196, 106, 0.1);
    }

    .overlap-empty {
      text-align: center;
      padding: 40px;
      color: var(--primary-teal);
      opacity: 0.5;
      font-size: 14px;
    }

    /* Flow / Treemap */
    .flow-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(38, 70, 83, 0.08);
      padding: 32px;
    }

    .treemap-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    .treemap-wrapper svg {
      display: block;
    }

    .treemap-cell rect {
      stroke: var(--bg-sand);
      stroke-width: 2px;
      transition: opacity 0.15s;
    }

    .treemap-cell:hover rect {
      opacity: 0.85;
    }

    .treemap-cell text {
      pointer-events: none;
      font-family: 'Montserrat', sans-serif;
    }

    .treemap-tooltip {
      position: fixed;
      background: var(--primary-teal);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Montserrat', sans-serif;
      pointer-events: none;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      line-height: 1.6;
      max-width: 260px;
    }

    .treemap-tooltip .tt-ticker {
      font-weight: 700;
      font-size: 14px;
    }

    .treemap-tooltip .tt-company {
      opacity: 0.8;
      font-size: 11px;
    }

    .treemap-tooltip .tt-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 4px;
    }

    .treemap-tooltip .tt-change-pos {
      color: #FF6B6B;
      font-weight: 700;
    }

    .treemap-tooltip .tt-change-neg {
      color: #6BCB77;
      font-weight: 700;
    }

    .flow-legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--primary-teal);
    }

    .flow-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flow-legend-swatch {
      width: 28px;
      height: 14px;
      border-radius: 3px;
    }

    .flow-scale {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .flow-scale-bar {
      width: 120px;
      height: 12px;
      border-radius: 3px;
    }

    .flow-scale-label {
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 400px;
      color: var(--primary-teal);
      opacity: 0.6;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    /* Mobile */
    @media (max-width: 900px) {
      .header {
        padding: 16px 20px;
      }

      .header-content {
        flex-wrap: wrap;
        gap: 12px;
      }

      .header-right {
        width: 100%;
        justify-content: space-between;
      }

      .search-box {
        flex: 1;
        width: auto;
      }

      .search-box:focus {
        width: auto;
      }

      .main-content {
        padding: 20px;
      }

      .home-layout {
        grid-template-columns: 1fr;
      }

      .list-layout-wrapper {
        grid-template-columns: 1fr;
      }

      .sector-legend {
        position: static;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        padding: 16px;
      }

      .sector-legend-title {
        width: 100%;
        margin-bottom: 8px;
      }

      .sector-legend-item {
        padding: 4px 0;
      }

      .funds-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }

      .fund-card {
        padding: 16px;
      }

      .fund-card-chart {
        width: 100px;
        height: 100px;
      }

      .fund-card-name {
        font-size: 12px;
      }

      .list-container {
        grid-template-columns: 1fr;
      }

      .list-sidebar {
        position: static;
        max-height: none;
      }

      .detail-view {
        padding: 24px;
      }

      .fund-title {
        font-size: 18px;
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>

      const filtered = FUNDS_DATA.filter(f =>
        f.name.toLowerCase().includes(search.toLowerCase()) ||
        f.holdings.some(h => h.ticker.toLowerCase().includes(search.toLowerCase()))
      );

      const handleSelectFund = (fund) => {

        setTab('home');

      return (

            <header className="header">

                    <button className={`lang-btn ${lang === 'en' ? 'active' : ''}`} onClick={() => setLang('en')}>EN</button>

    function HomeView({ funds, onSelect }) {
      const [activeSector, setActiveSector] = React.useState(null);

      const sortedFunds = React.useMemo(() => {
        if (!activeSector) return funds;
        return [...funds].sort((a, b) => {
          const aWeight = a.holdings.reduce((sum, h) => getSector(h.ticker) === activeSector ? sum + h.percent : sum, 0);
          const bWeight = b.holdings.reduce((sum, h) => getSector(h.ticker) === activeSector ? sum + h.percent : sum, 0);
          return bWeight - aWeight;
        });
      }, [funds, activeSector]);

      return (
        <div className="home-layout">
          <div className="funds-grid">
            {sortedFunds.map((fund, i) => <FundCard key={fund.name} fund={fund} onClick={() => onSelect(fund)} />)}
          </div>
          <SectorLegend activeSector={activeSector} onSectorClick={setActiveSector} />
        </div>
      );
    }

      const lang = React.useContext(LangContext);
      const t = I18N[lang];

      React.useEffect(() => {
        if (chartInstance.current) chartInstance.current.destroy();
        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: fund.holdings.slice(0, 5).map(h => h.ticker),
            datasets: [{ data: fund.holdings.slice(0, 5).map(h => h.percent), backgroundColor: fund.holdings.slice(0, 5).map(h => getSectorColor(h.ticker)), borderWidth: 2, borderColor: '#fff' }]

          options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false }, tooltip: { enabled: false } }, cutout: '55%', animation: { duration: 0 } }
        });
        return () => chartInstance.current?.destroy();
      }, [fund]);

      return (
        <div className="fund-card" onClick={onClick}>
          <div className="fund-card-chart"><canvas ref={chartRef}></canvas></div>
          <div className="fund-card-name">{fund.name}</div>
          <div className="fund-card-meta">
            <span>{fund.holdings.length} {t.holdings}</span>
            <span>{t.top}: {fund.holdings[0]?.ticker}</span>
          </div>
        </div>
      );
    }

    function OverlapView() {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];
      const [fundAIndex, setFundAIndex] = React.useState('');
      const [fundBIndex, setFundBIndex] = React.useState('');

      const fundA = fundAIndex !== '' ? FUNDS_DATA[parseInt(fundAIndex)] : null;
      const fundB = fundBIndex !== '' ? FUNDS_DATA[parseInt(fundBIndex)] : null;

      const analysis = React.useMemo(() => {
        if (!fundA || !fundB) return null;
        const holdingsA = {};
        fundA.holdings.forEach(h => { holdingsA[h.ticker] = h; });
        const holdingsB = {};
        fundB.holdings.forEach(h => { holdingsB[h.ticker] = h; });

        const common = [];
        const onlyA = [];
        const onlyB = [];

        Object.keys(holdingsA).forEach(ticker => {
          if (holdingsB[ticker]) {
            common.push({ ticker, name: holdingsA[ticker].name, weightA: holdingsA[ticker].percent, weightB: holdingsB[ticker].percent });
          } else {
            onlyA.push(holdingsA[ticker]);
          }
        });
        Object.keys(holdingsB).forEach(ticker => {
          if (!holdingsA[ticker]) onlyB.push(holdingsB[ticker]);
        });

        common.sort((a, b) => (b.weightA + b.weightB) - (a.weightA + a.weightB));
        return { common, onlyA, onlyB };
      }, [fundA, fundB]);

      return (
        <div>
          <div className="ranking-section-title">{t.overlapTitle}</div>
          <div className="overlap-controls">
            <div className="overlap-select-group">
              <label className="overlap-select-label">{t.fundA}</label>
              <select className="overlap-select" value={fundAIndex} onChange={e => setFundAIndex(e.target.value)}>
                <option value="">{t.selectFundPlaceholder}</option>
                {FUNDS_DATA.map((f, i) => <option key={i} value={i}>{f.name}</option>)}
              </select>
            </div>
            <div className="overlap-vs">VS</div>
            <div className="overlap-select-group">
              <label className="overlap-select-label">{t.fundB}</label>
              <select className="overlap-select" value={fundBIndex} onChange={e => setFundBIndex(e.target.value)}>
                <option value="">{t.selectFundPlaceholder}</option>
                {FUNDS_DATA.map((f, i) => <option key={i} value={i}>{f.name}</option>)}
              </select>
            </div>
          </div>

          {!analysis && (
            <div className="overlap-result">
              <div className="overlap-empty">{t.selectBothFunds}</div>
            </div>
          )}

          {analysis && (
            <div className="overlap-result">
              <div className="overlap-summary">
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.common.length}</div>
                  <div className="overlap-stat-label">{t.commonHoldings}</div>
                </div>
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.onlyA.length}</div>
                  <div className="overlap-stat-label">{t.onlyInA}</div>
                </div>
                <div className="overlap-stat">
                  <div className="overlap-stat-value">{analysis.onlyB.length}</div>
                  <div className="overlap-stat-label">{t.onlyInB}</div>
                </div>
              </div>

              {analysis.common.length > 0 ? (
                <div style={{ borderRadius: '12px', overflow: 'hidden' }}>
                  <table className="overlap-table">
                    <thead>
                      <tr>
                        <th>{t.ticker}</th>
                        <th>{t.company}</th>
                        <th>{t.sector}</th>
                        <th>{t.weightInA}</th>
                        <th>{t.weightInB}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {analysis.common.map(item => {
                        const sector = getSector(item.ticker);
                        const sectorLabel = lang === 'ja' ? (SECTOR_NAMES_JP[sector] || sector) : sector;
                        return (
                          <tr key={item.ticker}>
                            <td><span className="ticker">{item.ticker}</span></td>
                            <td>{item.name}</td>
                            <td><span className="sector-badge" style={{ background: SECTOR_COLORS[sector] }}>{sectorLabel}</span></td>
                            <td style={{ fontWeight: 600 }}>{item.weightA.toFixed(1)}%</td>
                            <td style={{ fontWeight: 600 }}>{item.weightB.toFixed(1)}%</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              ) : (
                <div className="overlap-empty">{t.noOverlap}</div>
              )}
            </div>
          )}
        </div>
      );
    }

    function RankingView() {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];
      const [mode, setMode] = React.useState('weight');
      const [expandedTicker, setExpandedTicker] = React.useState(null);

      const allData = React.useMemo(() => {
        const tickerMap = {};
        FUNDS_DATA.forEach(fund => {
          fund.holdings.forEach(h => {
            if (!tickerMap[h.ticker]) {
              tickerMap[h.ticker] = { ticker: h.ticker, name: h.name, totalWeight: 0, fundCount: 0, funds: [] };
            }
            tickerMap[h.ticker].totalWeight += h.percent;
            tickerMap[h.ticker].fundCount += 1;
            tickerMap[h.ticker].funds.push({ name: fund.name, weight: h.percent });
          });
        });
        return Object.values(tickerMap).map(item => ({
          ...item,
          avgWeight: item.totalWeight / item.fundCount
        }));
      }, []);

      const rankingData = React.useMemo(() => {
        const sorted = [...allData];
        if (mode === 'weight') {
          sorted.sort((a, b) => b.totalWeight - a.totalWeight);
        } else {
          sorted.sort((a, b) => b.fundCount - a.fundCount || b.totalWeight - a.totalWeight);
        }
        return sorted.slice(0, 30);
      }, [allData, mode]);

      const maxTotal = rankingData.length > 0 ? Math.max(...rankingData.map(d => d.totalWeight)) : 1;
      const maxAvg = rankingData.length > 0 ? Math.max(...rankingData.map(d => d.avgWeight)) : 1;
      const maxFunds = rankingData.length > 0 ? Math.max(...rankingData.map(d => d.fundCount)) : 1;

      return (
        <div>
          <div className="ranking-section-title">{t.rankingTitle}</div>
          <div className="ranking-tabs">
            <button className={`ranking-tab ${mode === 'weight' ? 'active' : ''}`} onClick={() => { setMode('weight'); setExpandedTicker(null); }}>{t.rankByWeight}</button>
            <button className={`ranking-tab ${mode === 'popularity' ? 'active' : ''}`} onClick={() => { setMode('popularity'); setExpandedTicker(null); }}>{t.rankByPopularity}</button>
          </div>
          <div className="ranking-table-container">
            <table className="ranking-table">
              <thead>
                <tr>
                  <th>{t.rank}</th>
                  <th>{t.ticker}</th>
                  <th>{t.company}</th>
                  <th>{t.sector}</th>
                  <th>{t.avgWeight}</th>
                  <th>{t.totalWeight}</th>
                  <th>{t.funds}</th>
                </tr>
              </thead>
              <tbody>
                {rankingData.map((item, i) => {
                  const sector = getSector(item.ticker);
                  const sectorLabel = lang === 'ja' ? (SECTOR_NAMES_JP[sector] || sector) : sector;
                  const totalBarWidth = (item.totalWeight / maxTotal) * 100;
                  const avgBarWidth = (item.avgWeight / maxAvg) * 100;
                  const isExpanded = expandedTicker === item.ticker;
                  return (
                    <React.Fragment key={item.ticker}>
                      <tr className="clickable" onClick={() => setExpandedTicker(isExpanded ? null : item.ticker)}>

                                </span>
                              ))}
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );

    function FlowView() {
      const lang = React.useContext(LangContext);
      const t = I18N[lang];
      const containerRef = React.useRef(null);
      const [tooltip, setTooltip] = React.useState(null);
      const [dims, setDims] = React.useState({ width: 1000, height: 600 });

      // Measure container
      React.useEffect(() => {
        const measure = () => {
          if (containerRef.current) {
            const w = containerRef.current.clientWidth;
            setDims({ width: w, height: Math.max(500, Math.min(700, w * 0.55)) });
          }
        };
        measure();
        window.addEventListener('resize', measure);
        return () => window.removeEventListener('resize', measure);
      }, []);

      // Color: Diffusion Index — normalized score = (buyers - sellers) / (buyers + sellers)
      // Japanese style: red = net buy, green = net sell, grey = neutral
      const getColor = (d) => {
        const total = d.buyers + d.sellers;
        if (total === 0) return '#B8B5AD';
        const score = (d.buyers - d.sellers) / total; // -1 to +1
        if (score > 0) {
          const intensity = score; // 0..1
          const r = Math.round(200 + 55 * intensity);
          const g = Math.round(130 - 90 * intensity);
          const b = Math.round(130 - 90 * intensity);
          return `rgb(${r},${g},${b})`;
        } else if (score < 0) {
          const intensity = Math.abs(score); // 0..1
          const r = Math.round(110 - 60 * intensity);
          const g = Math.round(160 + 40 * intensity);
          const b = Math.round(110 - 40 * intensity);
          return `rgb(${r},${g},${b})`;
        }
        return '#B8B5AD';
      };

      // Diffusion label for cell text
      const getDiffusionLabel = (d) => {
        const total = d.buyers + d.sellers;
        if (total === 0) return '—';
        const score = d.buyers - d.sellers;
        return (score > 0 ? '+' : '') + score;
      };

      // Build treemap layout — size = holders count
      const cells = React.useMemo(() => {
        const { width, height } = dims;
        const root = d3.hierarchy({ name: 'root', children: MOCK_MONEY_FLOW })
          .sum(d => d.holders || 0)
          .sort((a, b) => b.value - a.value);

        d3.treemap()
          .size([width, height])
          .paddingTop(22)
          .paddingInner(2)
          .paddingOuter(3)
          .round(true)(root);

        return root;
      }, [dims]);

      const handleMouseMove = (e, d) => {
        setTooltip({
          x: e.clientX + 12,
          y: e.clientY - 10,
          ticker: d.data.name,
          fullName: d.data.fullName,
          holders: d.data.holders,
          buyers: d.data.buyers,
          sellers: d.data.sellers,
        });
      };

      const sectorGroups = cells.children || [];

      return (
        <div>
          <div className="ranking-section-title">{t.flowTitle}</div>
          <p style={{ fontSize: '12px', color: '#2A9D8F', marginBottom: '24px', marginTop: '-12px' }}>{t.flowSubtitle}</p>
          <div className="flow-container">
            <div className="treemap-wrapper" ref={containerRef}>
              <svg width={dims.width} height={dims.height} style={{ fontFamily: 'Montserrat, sans-serif' }}>
                {sectorGroups.map(group => (
                  <g key={group.data.name}>
                    <rect
                      x={group.x0} y={group.y0}
                      width={group.x1 - group.x0} height={group.y1 - group.y0}
                      fill="rgba(38, 70, 83, 0.04)"
                      stroke="rgba(38, 70, 83, 0.12)"
                      strokeWidth="1"
                      rx="4"
                    />
                    <text
                      x={group.x0 + 8} y={group.y0 + 15}
                      fontSize="10" fontWeight="700" fill="#264653"
                      textAnchor="start" letterSpacing="1.5"
                      style={{ textTransform: 'uppercase' }}
                    >
                      {lang === 'ja' ? (SECTOR_NAMES_JP[group.data.name] || group.data.name) : group.data.name}
                    </text>
                    {(group.children || []).map(leaf => {
                      const w = leaf.x1 - leaf.x0;
                      const h = leaf.y1 - leaf.y0;
                      const showTicker = w > 32 && h > 20;
                      const showDI = w > 44 && h > 34;
                      return (
                        <g key={leaf.data.name} className="treemap-cell"
                          onMouseMove={e => handleMouseMove(e, leaf)}
                          onMouseLeave={() => setTooltip(null)}
                        >
                          <rect
                            x={leaf.x0} y={leaf.y0}
                            width={w} height={h}
                            fill={getColor(leaf.data)}
                            rx="3"
                          />
                          {showTicker && (
                            <text
                              x={leaf.x0 + w / 2} y={leaf.y0 + h / 2 + (showDI ? -4 : 2)}
                              textAnchor="middle"
                              fontSize={w > 70 ? '12' : '10'}
                              fontWeight="700"
                              fill="#fff"
                            >
                              {leaf.data.name}
                            </text>
                          )}
                          {showDI && (
                            <text
                              x={leaf.x0 + w / 2} y={leaf.y0 + h / 2 + 12}
                              textAnchor="middle"
                              fontSize="9"
                              fontWeight="600"
                              fill="rgba(255,255,255,0.85)"
                            >
                              {getDiffusionLabel(leaf.data)}
                            </text>
                          )}
                        </g>
                      );
                    })}
                  </g>
                ))}
              </svg>
            </div>

            {/* Legend */}
            <div className="flow-legend">
              <div className="flow-scale">
                <span className="flow-scale-label">{t.netSell}</span>
                <div className="flow-scale-bar" style={{

                }}></div>
                <span className="flow-scale-label">{t.netBuy}</span>
              </div>
            </div>
          </div>

          {/* Tooltip */}
          {tooltip && (
            <div className="treemap-tooltip" style={{ left: tooltip.x, top: tooltip.y }}>

              <div className="tt-company">{tooltip.fullName}</div>
              <div className="tt-row">
                <span>{t.heldBy}</span>
                <span style={{ fontWeight: 700 }}>{tooltip.holders} {t.fundsUnit}</span>
              </div>
              <div className="tt-row">
                <span>{t.sentiment}</span>
                <span>
                  <span className="tt-change-pos">{tooltip.buyers} {t.buys}</span>
                  {' / '}
                  <span className="tt-change-neg">{tooltip.sellers} {t.sells}</span>
                </span>
              </div>
            </div>
          )}
        </div>
      );
    }
